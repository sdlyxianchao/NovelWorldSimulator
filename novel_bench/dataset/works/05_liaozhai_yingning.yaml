id: liaozhai
title: 聊斋志异·婴宁
title_en: "Strange Tales from a Chinese Studio: Yingning"
author: 蒲松龄
year: "1766"
country: 中国
language: zh
category: 古典
medium: 出版
genres: [志怪, 文言短篇, 爱情]
representativeness: |
  文言短篇小说的顶峰。二十世纪前，中国写"鬼狐"写得最好的不是长篇小说，而是这些千字以内的短篇。
  婴宁一篇尤其特别：女主角几乎只用笑声塑造，几乎没有一句正经台词——
  这是对"人物声音"这条评测维度最刁钻的一次考试。
license: public_domain
bible:
  worldview: |
    故事发生在山东莒县一带。书生王子服元宵看灯，遇见一位带婢女、拈梅花的少女，一见倾心，
    相思成疾。表兄吴生哄他说那是自己表妹，已许了人家；王生不信，独自往南山寻访，
    竟真在谷中寻到一处村落。这村落人烟稀少，屋舍整洁，却说不清来历。
    此世界有狐有鬼，但都与常人无异，只是来历不明、不能见光。
  rules:
    - 有狐鬼，但她们守人间礼数；不许施法伤人，除非被人逼迫。
    - 王生是读书人，说话用文言，但不掉书袋；婴宁说话极少，多以笑代替。
    - 村落的位置说不清，问起来乡人只笑不答。
    - 这一场只写午后到掌灯这一段，不许一句"过了数日"。
  places:
    - 名称: 南山·谷中村落
      说明: 几间茅舍，门前一架木香，安静得不像有人住
      方位: 莒县南山的背阴处
      内里: [门前, 院落, 花架, 堂屋]
    - 名称: 王家·书房
      说明: 王生读书处，窗外一株海棠
      方位: 莒县县城王家宅内
    - 名称: 上元灯市
      说明: 正月十五的街市，人挤人，卖花灯的摊子一路摆到桥头
      方位: 莒县县城十字街
  people:
    - 姓名: 王子服
      别称: [王生, 王子服, 书生]
      身份: 莒县书生，父早亡，由母亲抚养
      性格: 痴，认准了就不回头；礼数周全，但一急就说不出话
      口癖: 自称"小生"，急了只说"这……这……"
      秘密: 相思成疾，已经瘦得脱形
      目标: 找到那个拈梅花的女子
      红线: 不肯把这事当笑谈讲给旁人听
    - 姓名: 婴宁
      别称: [婴宁, 女子, 少女, 姑娘]
      身份: 谷中老媪的养女，来历不明
      性格: 极爱笑，笑不可止；天真到不懂忌讳，说话直来直去
      口癖: 几乎不说话的一个人，一开口就笑
      秘密: 她其实不是人，是老媪抚养的狐女
      目标: 守着花架和母亲过日子
      红线: 不许人折她家的花
    - 姓名: 老媪
      别称: [老媪, 老妇, 老妈妈]
      身份: 婴宁的养母，谷中独居的老妇人
      性格: 耳背，说话慢，礼数上极认真
      口癖: 叫王生"郎君"，常说"老身"
      秘密: 她早知女儿来历，也知道这一天迟早会来
      目标: 给女儿找个正经人家
      红线: 不许王生在天黑后留在院里
    - 姓名: 吴生
      别称: [吴生]
      身份: 王生的表兄
      性格: 圆滑，爱开玩笑，也真心替表弟奔走
      口癖: 爱说"我哄你的"
      秘密: 当初那句"是我表妹"确实是随口编的
      目标: 把表弟的病治好
      红线: 不敢再拿这事开玩笑
  relations:
    - 甲: '王子服'
      乙: '婴宁'
      关系: '一见倾心，一个痴一个笑'
    - 甲: '婴宁'
      乙: '老媪'
      关系: '母女，实则养育之恩'
    - 甲: '王子服'
      乙: '吴生'
      关系: '表兄弟，一个认真一个打趣'
  foreshadows:
    - 编号: 'F1'
      内容: '婴宁手里那枝梅花，枯了王生也不肯丢'
    - 编号: 'F2'
      内容: '老媪说"只是少个媒人"，一句话定了后半段的婚事'
    - 编号: 'F3'
      内容: '婴宁笑到不能止，日后在西邻子面前也是这个笑'
  details:
    - 名称: '梅花'
      说明: '上元节婴宁手里拈的那一枝，王生收着'
    - 名称: '木香架'
      说明: '谷中院前的花架，婴宁常坐在下面'
    - 名称: '杖'
      说明: '老媪拄的一根竹杖，走路很慢'
  style:
    pov: 第三人称限知
    era: premodern
    sentence: 文言短句，简净，几乎不用形容词
    diction: 浅近文言，对话用白话化的文言
    dialogue: 低到中，靠动作与笑
    taboos: [手机, 电话, 咖啡, 分钟, 情绪, 状态, 心理, 氛围]
cases:
  - id: lz-01
    cut: 中段
    at: 婴宁篇 王子服独自入山寻访
    story_time: "午后"
    place: 南山·谷中村落
    present: [王子服, 婴宁, 老媪]
    focus: [人物声音, 留白, 志怪氛围]
    previously: |
      上元节，王子服在灯市遇见一位拈梅花的少女，一见倾心。表兄吴生哄他说那是自家表妹，
      已许了人。王生不信，相思成疾，病中取出那枝枯梅摩挲。病稍好，他瞒着家人独自往南山走，
      走了三十余里，谷中忽然出现一个小村落。
    scene_seed: |
      王生站在院门外，看见木香架下坐着一个人，正低头把玩一枝花。
      听见脚步，那人抬头，先是一怔，随即笑出声来，笑得手里的花都抖落了。
    ground_truth:
      hard:
        - 不许让王子服带着家人或仆从来（他是瞒着家里独自上山的）
        - 不许让婴宁说成串的完整句子（她是'笑不可止'，一开口就笑）
        - 不许用现代白话（必须浅近文言，不许出现'情绪''感觉''气氛'）
        - 不许让老媪一见面就知道王生的来意
      beats:
        - 婴宁笑着把花丢在地上，转身进屋；片刻又探出头来看他，仍在笑。
        - 王生拾起花，自报姓名，说是来寻亲的；婴宁只笑不答，喊"阿母"。
        - 老媪拄杖出来，耳背，问了三遍才听清，说家中并无这门亲戚，却仍留他坐。
        - 老媪问他家世，听说未娶，便说"只是少个媒人"，婴宁在旁又笑不可止。
        - 天色将晚，老媪留他吃饭，饭后让他到后院歇；王生一夜不曾合眼。
      excerpt: |
        媪曰："郎君何姓？"曰："婿姓王。"媪曰："王郎亦复何来？"生曰："此来为访亲。"媪曰："何亲？"
        生不能答。媪笑曰："郎君远来，想是饥矣。"遂命婢治具。生视婢，即向所遇之女也。
        女方笑不可止，媪顾曰："此女亦太憨生，然亦殊不恶。"
      divergence_note: |
        婴宁的台词应当极少，甚至为零；她的"回答"是笑、是转身、是丢花。
        若把她写成伶牙俐齿的少女，这一篇的魂就丢了。
      alternatives:
        - stance: 婴宁一言不发，全靠动作把王生留在院里（笑、递花、引路）
          why_valid: 原文本就以'笑'代'语'，把她写成零台词也成立；而且这更贴合'来历不明、不通人间礼数'的设定。
          beats:
            - 王生自报姓名，婴宁只笑，把手里那枝花丢在他脚边，转身进院
            - 她走到花架下回头看他一眼，又笑，抬手招了招
            - 老媪出来问话，婴宁在旁边替母亲搬凳、倒水，始终不出声
            - 王生告辞时，她把那枝落地的花捡起来递还给他
        - stance: 先写老媪的耳背与絮叨，王生与婴宁的相见被推到院子深处
          why_valid: 志怪小说常以'老人絮语'起手，把异处藏在日常里；推迟相见不违背任何设定，反而让谷中村落更不像人间。
          beats:
            - 王生叩门，老媪耳背，问了三遍才听清，先让他坐
            - 老媪絮絮说谷中少有人来，又说女儿在院里玩
            - 王生随她手指看过去，只看见花架后一角衣裳
            - 等他终于看清那女子，日头已偏西
