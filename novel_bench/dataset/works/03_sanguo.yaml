id: sanguo
title: 三国演义
title_en: Romance of the Three Kingdoms
author: 罗贯中
year: "1522"
country: 中国
language: zh
category: 古典
medium: 出版
genres: [历史, 权谋, 战争, 群像]
representativeness: |
  章回体历史演义的最高峰，也是中文世界最普及的权谋教科书。"智"与"诈"的博弈写成可看的场面：
  空城计、草船借箭、舌战群儒，几乎每个中国人都会讲。它考的是"信息不对称下的决策"，
  与推演系统的多主体博弈天然同构。
license: public_domain
bible:
  worldview: |
    汉末天下三分，魏据中原，蜀守巴蜀，吴据江东。连年用兵，粮道与人心比刀枪更要紧。
    蜀汉以"汉室正统"立国，兵力最弱，全靠诸葛亮的谋与法度撑着；魏国兵多将广，
    司马懿老于用兵，最擅长的不是打赢，而是不输。街亭一失，蜀军全线退回汉中，
    西城只剩老弱残兵。
  rules:
    - 没有法术。所谓"呼风唤雨"只是借地利天时，不许真的作法。
    - 兵数、粮草、路程都要说得通：三千人不能围十万人，一天走不了三百里。
    - 人物说话分身份：谋士讲利害，武将讲进退，主公讲取舍。
    - 这一场只写城楼与城外这一小片地方，不许切到别处战场。
  places:
    - 名称: 西城·城楼
      说明: 一座小城，城墙不高，城楼上可望见大道
      方位: 西城北门
      内里: [城楼, 垛口, 琴案, 楼梯]
    - 名称: 西城·县衙
      说明: 城里唯一像样的院子，蜀军临时驻扎
      方位: 西城正中
    - 名称: 西城·北门
      说明: 城门大开，门前一条土路直通山道
      方位: 西城北
  people:
    - 姓名: 诸葛亮
      身份: 蜀汉丞相，统兵在外
      性格: 极静，越是危急越慢；说话先给对方留退路，再堵死
      口癖: 常以"吾"自称，话说一半留一半
      秘密: 城里确实只有两千五百老弱，一仗都打不了
      目标: 让司马懿自己退兵，保住汉中退路
      红线: 不弃城而走——一走，全军辎重就完了
    - 姓名: 司马懿
      身份: 魏国大都督，统十五万兵
      性格: 多疑，能忍，最怕中计；宁可放过也不肯冒险
      口癖: 说话慢，爱先问"此中有何诈"
      秘密: 朝中有人忌他，他不敢有大的折损
      目标: 不战而取西城，同时保住自己的兵
      红线: 不许儿子擅自攻城
    - 姓名: 司马昭
      身份: 司马懿次子，随军
      性格: 锐气重，急于立功，看不起父亲的小心
      口癖: 爱说"父亲何太怯"
      秘密: 想抢头功，好在军中立足
      目标: 攻下西城
      红线: 不敢违父命硬来
    - 姓名: 老军
      身份: 西城守门的老兵，五十多岁
      性格: 老实，怕官，也怕死；让扫街就扫街
      口癖: 一口一个"丞相"
      秘密: 知道城里没兵，腿一直在抖
      目标: 活过今天
      红线: 不敢多问一句
  relations:
    - 甲: '诸葛亮'
      乙: '司马懿'
      关系: '多年对手，彼此比谁都了解对方的用兵习惯'
    - 甲: '司马懿'
      乙: '司马昭'
      关系: '父子，一个要稳，一个要功'
    - 甲: '诸葛亮'
      乙: '老军'
      关系: '丞相与老卒，命令下得越平静，老卒越怕'
  foreshadows:
    - 编号: 'F1'
      内容: '诸葛亮平日从不弄险，这一次反常，正是要叫对手不信'
    - 编号: 'F2'
      内容: '琴弦断了一根，他换弦的手很稳，这细节决定了成败'
    - 编号: 'F3'
      内容: '城门扫地的老兵，扫得越从容，越像有伏兵'
  details:
    - 名称: '鹤氅'
      说明: '诸葛亮常穿的羽衣，城楼上远远看得见'
    - 名称: '琴'
      说明: '一张七弦琴，摆在城楼案上'
    - 名称: '香'
      说明: '城楼上焚的一炉香，青烟直上，远处看得分明'
  style:
    pov: 第三人称全知
    era: premodern
    sentence: 半文半白，短句多，四字句用于判断，长句用于陈说利害
    diction: 三国白话，多用"吾""汝""且""遂"，少用现代抽象词
    dialogue: 高，谋略全靠对白铺开
    taboos: [手机, 电话, 咖啡, 分钟, 情绪, 状态, 压力, 心理, 秒]
cases:
  - id: sg-01
    cut: 高潮前
    at: 第九十五回 武侯弹琴退仲达
    story_time: "午后"
    place: 西城·城楼
    present: [诸葛亮, 老军, 司马昭]
    focus: [信息不对称, 心理博弈, 节奏]
    previously: |
      马谡不听调度，失了街亭。司马懿引十五万大军望西城而来。诸葛亮手上只有两千五百老弱，
      文武官员尽皆失色。他传令：旗号尽藏，城门大开，每门派二十军士扮作百姓洒扫街道，
      不许擅动；自己披鹤氅、戴纶巾，引二小童携琴一张，于城上敌楼前凭栏而坐，焚香操琴。
    scene_seed: |
      尘土扬起，魏军前锋已到城下。老军握着扫帚立在门洞边，手抖得扫帚苗直响。
      城楼上香烟笔直，琴声不快不慢。司马昭在马上抬头看了很久，回头说了句什么。
    ground_truth:
      hard:
        - 不许让诸葛亮真的施法或呼风唤雨
        - 不许让司马懿当场识破并攻城（他必须自己退）
        - 不许出现现代军事术语（心理战/信息战 不许）
        - 不许让老军知道全盘计划（他只被吩咐扫地）
      beats:
        - 司马昭请战，说"莫非诸葛亮无军，故作此态"，要冲进去。
        - 司马懿止住他，说诸葛亮平生谨慎，不曾弄险，今大开城门，必有埋伏。
        - 他侧耳听琴，琴声不乱，越听越疑，终于传令后军作前军，望北山退去。
        - 退到山后，司马昭再问，司马懿说："吾若为司马懿，必不便退也。"
        - 众官问其故，诸葛亮说：此人料我平生谨慎，必不弄险，见如此模样，疑有伏兵，所以退去。
      excerpt: |
        懿看毕，仰天大笑，曰："吾若为司马懿，必不便退也。"遂令后军作前军，前军作后军，望北山路而退。
        次子司马昭曰："莫非诸葛亮无军，故作此态？父亲何故便退兵？"懿曰："亮平生谨慎，不曾弄险。
        今大开城门，必有埋伏。我兵若进，中其计也。汝辈岂知？宜速退。"
      divergence_note: |
        关键不是"谁更聪明"，而是让读者看见司马懿凭什么退：他信的是诸葛亮一生的行为记录。
        若写成一见琴声就吓跑，等于把胜负归给玄学。
      alternatives:
        - stance: 诸葛亮不开城门，只命人把城门关严、自己上城楼焚香（守而不空）
          why_valid: 空城计的关键不是'门开'，而是'让对方不敢进'；关门焚香同样是一副有恃无恐的样子。
          beats:
            - 诸葛亮命军士把四门关严，不许喧哗
            - 他披鹤氅上城楼，焚香操琴，两个小童侍立
            - 司马昭请战，司马懿看见城门紧闭反而更疑
            - 琴声不乱，司马懿终于退兵
