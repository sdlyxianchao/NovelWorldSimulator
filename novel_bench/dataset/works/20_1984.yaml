id: nineteen_eighty_four
title: 一九八四
title_en: Nineteen Eighty-Four
author: 乔治·奥威尔
year: "1949"
country: 英国
language: en
category: 现代
medium: 出版
genres: [反乌托邦, 政治, 科幻, 长篇]
representativeness: |
  政治寓言的范式之作。它把"语言如何塑造思想"写成可感的日常：新话、双重思想、电幕。
  它检验的是世界观约束的硬度——一旦设定"电幕无处不在"，人物的每一个动作都要付代价。
license: in_copyright_short_quote
bible:
  worldview: |
    大洋国，一九八四年（按党的说法）。党由"老大哥"象征性地统治，四个部门分管
    真理、和平、仁爱、富裕。电幕装在每间屋子、每条走廊，思想警察随时可能敲门。
    历史可以被改写，报纸每天都在被修正。新话正在削减词汇，为的是让某些思想无法被想出来。
    温斯顿在真理部负责改写旧报纸。
  rules:
    - 电幕无处不在，但盲区存在；人物必须随时计算被看见的风险。
    - 党的口号、新话词汇要准确使用："战争即和平，自由即奴役，无知即力量"。
    - 不许出现超自然；所有恐惧都来自制度与人。
    - 这一场只写真理部走廊到厕所这一段路。
  places:
    - 名称: 真理部·七层走廊
      说明: 走廊长，灯管惨白，电幕每隔十几米一个
      方位: 伦敦一号空降场
      内里: [走廊, 隔间, 厕所, 楼梯间]
    - 名称: 真理部·温斯顿的隔间
      说明: 一个小格子，桌上有一台老式书写器
      方位: 真理部七层
    - 名称: 查林顿先生的小店
      说明: 旧货铺，楼上有间没有电幕的屋子
      方位: 无产阶级区
  people:
    - 姓名: 温斯顿
      身份: 真理部记录司的职员，三十九岁
      性格: 谨慎到偏执，心里反抗，行动迟缓；相信记忆比文件真实
      口癖: 心里反复推演最坏结果
      秘密: 他正在写一本日记，这本身就是死罪
      目标: 保住一点点真实的东西
      红线: 不在电幕前露出任何表情
    - 姓名: 茱莉亚
      身份: 小说司的职员，二十六岁
      性格: 外表是模范党员，内里只反叛与自己有关的部分
      口癖: 说话直接，爱说"别傻"
      秘密: 她已经跟踪温斯顿很久
      目标: 找点属于自己的快乐
      红线: 不谈政治，不信任任何人
    - 姓名: 奥勃良
      身份: 核心党员，温斯顿心目中可能的同谋
      性格: 沉稳，宽厚的外表下无从判断
      口癖: 说话慢，爱引用党的原则
      秘密: 他一开始就在钓温斯顿
      目标: 完成对温斯顿的"治疗"
      红线: 不容许任何不精确
    - 姓名: 派逊斯
      身份: 温斯顿的邻居，热心党员
      性格: 愚忠，嗓门大，连自己的孩子都怕
      口癖: 爱说"太好了"
      秘密: 他的女儿举报过他梦话
      目标: 做一个好党员
      红线: 不许人说老大哥的坏话
  relations:
    - 甲: 温斯顿
      乙: 茱莉亚
      关系: 互相吸引，又互相提防
    - 甲: 温斯顿
      乙: 奥勃良
      关系: 他以为找到了同谋，其实找到了审判者
    - 甲: 温斯顿
      乙: 派逊斯
      关系: 邻居，一个清醒一个愚忠
  foreshadows:
    - 编号: F1
      内容: 那本日记，写下的每一个字都是证据
    - 编号: F2
      内容: 茱莉亚递纸条时假装摔倒，这个动作以后还会出现
    - 编号: F3
      内容: 查林顿小店楼上的屋子，没有电幕——这件事本身就可疑
  details:
    - 名称: 电幕
      说明: 一面能看能听的铁板，装在墙上，可以调低音量但不能关
    - 名称: 新话
      说明: 正在推行的简化语言，词汇每年都在减少
    - 名称: 两分钟仇恨
      说明: 每天固定的集会，对着敌人的脸吼叫
  style:
    pov: 第三人称限知
    era: dystopia
    sentence: 中长句，陈述冷静，恐惧藏在名词里
    diction: 平实的现代汉语，政治术语准确，不抒情
    dialogue: 中，对话克制，多是试探
    taboos: [手机, 网络, 咖啡, 分钟, 情绪, 状态, 压力, 正能量]
cases:
  - id: nef-01
    cut: 中段
    at: 第一部 茱莉亚在走廊里塞纸条
    story_time: "上午"
    place: 真理部·七层走廊
    present: [温斯顿, 茱莉亚, 派逊斯]
    focus: [制度压迫, 风险计算, 心理张力]
    previously: |
      温斯顿在真理部记录司改写旧报纸，心里早已不信党，却从不敢露出来。
      他注意到小说司有个黑头发的姑娘总在看他，怀疑她是思想警察的眼线，
      甚至梦见她告发自己。这一天上午，他端着饭盒走在七层走廊上。
    scene_seed: |
      走廊上人来人往，电幕正播着仇恨周的新闻。那姑娘从对面走来，
      走到他身边时忽然踉跄了一下，一只手扶住他的胳膊。
      派逊斯在几步外，正大声跟人说话。
    ground_truth:
      hard:
        - 不许让温斯顿当场表露反抗（他必须怕）
        - 不许让茱莉亚说出'我爱你'之外的任何计划
        - 不许出现现代科技（手机/网络 不许）
        - 不许让电幕被关掉或失效
      beats:
        - 姑娘把一张折好的纸塞进他手里，什么也没说，继续往前走。
        - 温斯顿不敢当场看，走到厕所隔间里才展开，纸上写着"我爱你"。
        - 他整个人懵了，第一个念头是"这是陷阱"，第二个念头是"我该怎么办"。
        - 接下来几天，两人在食堂用极短的眼神和位置暗示约定见面时间。
        - 他们在乡下见面，茱莉亚说，她早就看出他和别人不一样。
      excerpt: |
        她踉跄了一下，把手按在我的胳膊上。等我们错开身，我手里多了一张折起来的纸。
        我走进厕所隔间，把纸展开，上面写着："我爱你。"
        我站在那里很久，脑子里只有一个念头：这一定是陷阱。
      divergence_note: |
        这一场的关键是"不敢高兴"：温斯顿的第一反应必须是恐惧，而不是狂喜。
        若写成两情相悦的浪漫桥段，制度的分量就消失了。
      alternatives:
        - stance: 茱莉亚不递纸条，只在食堂坐到温斯顿对面，把盐罐推过去
          why_valid: 她的示好可以完全不用文字；在电幕下用物件传意，比纸条更安全，也更符合她的谨慎。
          beats:
            - 茱莉亚端着托盘坐到温斯顿对面
            - 她把盐罐推到他手边，没有看他
            - 温斯顿愣了很久，把盐罐拿起来
            - 她起身走了，托盘留在桌上
