id: shediao
title: 射雕英雄传
title_en: The Legend of the Condor Heroes
author: 金庸
year: "1957"
country: 中国
language: zh
category: 当代
medium: 出版
genres: [武侠, 成长, 江湖, 长篇]
representativeness: |
  新派武侠的定型之作，也是华语世界销量最大的通俗小说之一。郭靖"笨"、黄蓉"灵"，
  两个人一开口就分得清清楚楚；江湖有规矩、有门派、有辈分。
  它最适合检验"人物口吻能不能立住"和"打斗有没有物理感"。
license: in_copyright_short_quote
bible:
  worldview: |
    南宋宁宗年间，金人占北，宋室偏安。江湖上东邪西毒南帝北丐中神通，五绝各据一方；
    全真教、丐帮、桃花岛各有规矩。郭靖是遗腹子，随母在蒙古长大，资质鲁钝，性子却极诚；
    黄蓉是东邪黄药师的女儿，聪明机变，从小在岛上长大，不懂世俗礼数。
    两人在张家口相遇时，郭靖还是个刚下江南的傻小子。
  rules:
    - 武功有来历、有招式名，交手要讲距离、力道、兵刃，不许一招秒杀。
    - 江湖规矩要遵守：长辈为先、拜帖、切口、辈分称呼。
    - 郭靖说话短、慢、直；黄蓉说话快、俏、绕。
    - 这一场只写酒楼里这一顿饭，不许切去别处打斗。
  places:
    - 名称: 张家口·长庆楼
      说明: 城门口的大酒楼，楼下是脚夫，楼上是客商
      方位: 张家口南门内
      内里: [大堂, 雅座, 后厨, 二楼栏杆]
    - 名称: 张家口·城门
      说明: 南北商旅必经，风沙大
      方位: 张家口南门
    - 名称: 桃花岛
      说明: 东海孤岛，岛上桃花成阵
      方位: 东海
  people:
    - 姓名: 郭靖
      别称: [郭靖]
      身份: 蒙古长大的汉人少年，全真教马钰传过内功
      性格: 木讷，迟钝，认死理；答应的事一定做到
      口癖: 说话短，"好""我不懂""你说得对"
      秘密: 他身上带着一把匕首和两锭黄金，是母亲给的
      目标: 找到杀父仇人，学成武功
      红线: 不许人骂他母亲
    - 姓名: 黄蓉
      别称: [黄蓉, 蓉儿]
      身份: 东邪黄药师之女，此刻扮作小叫化
      性格: 机灵，顽皮，爱试探人；谁对她好，她就记一辈子
      口癖: 爱说"喂"，说话带着笑
      秘密: 她是偷跑出岛的，怕父亲追来
      目标: 找个不嫌她的人
      红线: 不许人可怜她
    - 姓名: 店小二
      别称: [小二, 伙计, 店小二]
      身份: 长庆楼的伙计
      性格: 势利，看衣裳下菜碟
      口癖: 一口一个"爷"
      秘密: 后厨的菜其实不新鲜
      目标: 多讨几个赏钱
      红线: 不许客人砸店
    - 姓名: 完颜洪烈
      别称: [完颜洪烈, 六王爷, 王爷]
      身份: 金国六王爷，此刻微服南下
      性格: 阴沉，有城府，礼贤下士的姿态做得极足
      口癖: 说话慢条斯理
      秘密: 郭靖的父亲死在他手上
      目标: 收罗江湖人为金国所用
      红线: 不许人提他的真实身份
  relations:
    - 甲: '郭靖'
      乙: '黄蓉'
      关系: '初见，一个傻一个俏，一顿饭定了一生'
    - 甲: '黄蓉'
      乙: '店小二'
      关系: '叫化与伙计，一个刁一个势利'
    - 甲: '完颜洪烈'
      乙: '郭靖'
      关系: '杀父之仇，可惜双方都还不知'
  foreshadows:
    - 编号: 'F1'
      内容: '郭靖那匹汗血宝马，日后救过黄蓉的命'
    - 编号: 'F2'
      内容: '黄蓉点的菜里有"玉笛谁家听落梅"，是桃花岛的讲究'
    - 编号: 'F3'
      内容: '完颜洪烈在楼上看着这两个少年，记住了郭靖的脸'
  details:
    - 名称: '汗血宝马'
      说明: '郭靖从蒙古带来的小红马，脚力极佳'
    - 名称: '匕首'
      说明: '郭靖母亲给的短匕，鞘上刻着字'
    - 名称: '叫化装'
      说明: '黄蓉偷跑出来时的破衣烂衫，脸上抹了灰'
  style:
    pov: 第三人称限知
    era: premodern
    sentence: 中短句，动作清楚，节奏快
    diction: 现代白话夹江湖语，菜名与器物写得实
    dialogue: 很高，靠对白立人物
    taboos: [手机, 电话, 咖啡, 分钟, 情绪, 状态, 压力, 心理活动]
cases:
  - id: sd-01
    cut: 中段
    at: 张家口长庆楼，郭靖初遇扮作小叫化的黄蓉
    story_time: "正午"
    place: 张家口·长庆楼
    present: [郭靖, 黄蓉, 店小二]
    focus: [人物声音, 反差, 慷慨与试探]
    previously: |
      郭靖奉母命南下，一路走到张家口。他在城门边看见一个瘦小的叫化子被人欺负，
      替他解了围，又请他到长庆楼吃饭。叫化子也不客气，跟着就上了楼，
      一屁股坐在他对面，把脚架在凳子上。
    scene_seed: |
      店小二拿着抹布过来，眼睛在叫化子身上扫了一眼，脸就沉了。
      郭靖把菜单推过去，说"你点"。叫化子抬眼看他，笑了一下，接过菜单。
    ground_truth:
      hard:
        - 不许让郭靖一开始就显露武功高强（他此时还很笨）
        - 不许让黄蓉以真面目示人（她还扮作小叫化）
        - 不许让完颜洪烈当场暴露身份
        - 不许用现代词（人格魅力/反差萌 不许）
      beats:
        - 黄蓉一口气点了十几样菜，专挑贵的、难的，还嫌店小二脸色难看。
        - 郭靖一句不问，只说"再添两个你爱吃的"；菜上来，黄蓉吃得极香，他看着她吃。
        - 黄蓉又试他，说要借他的马，郭靖解下缰绳就递过去，连姓名都不问。
        - 黄蓉忽然把脸一抹，露出本来面目，笑说"你这个人真傻"。
        - 郭靖只说了一句"你饿不饿"，黄蓉眼圈就红了。
      excerpt: |
        那少年笑道："你这个人真傻，我骗你的。"郭靖道："你饿不饿？"那少年一怔，
        眼圈儿红了，低下头去。郭靖道："你再吃些。"那少年道："我不吃了。"
        郭靖道："那我送你回去。"那少年道："我没有家。"
      divergence_note: |
        郭靖的"傻"要写成一种稳定的品性，不是装傻；黄蓉的"试"要一层层加码。
        若两人一见面就互相看穿、说破身份，这一段就没了。
      alternatives:
        - stance: 黄蓉不点贵菜，专挑便宜的，专试郭靖会不会嫌她寒酸
          why_valid: 她要试的是'这个人会不会看不起我'；点便宜菜同样能试出来，且更符合叫化的身份。
          beats:
            - 黄蓉只要了两碗面、一碟咸菜
            - 店小二脸色更难看，郭靖却让再加两个菜
            - 黄蓉问他不嫌么，郭靖说不嫌
            - 她低头吃面，吃了很久没说话
