id: biancheng
title: 边城
title_en: Border Town
author: 沈从文
year: "1934"
country: 中国
language: zh
category: 现代
medium: 出版
genres: [抒情, 乡土, 爱情, 中篇]
representativeness: |
  中国现代抒情小说的代表作。它几乎不写冲突，全靠水声、灯火、月色和一句半句没说完的话
  推进感情。用它来测，是因为大多数 AI 写作在"没有事件"的段落里会立刻露出原形：
  要么空转，要么强行制造戏剧。
license: public_domain
bible:
  worldview: |
    湘西茶峒，一条酉水，一只渡船。溪边白塔下住着摆渡的老船夫和他外孙女翠翠。
    城里掌水码头的船总顺顺有两个儿子：天保大老、傩送二老，都生得结实、会泅水。
    端午赛龙舟，中秋放河灯。这里的人不富裕，但讲究体面：话说得少，事做得实，
    心里有情也不肯先开口。
  rules:
    - 没有坏人，也没有巧合。所有转折都由性情与误会推动。
    - 不写心理分析，只写动作、声音、光线；情绪要藏在景物后面。
    - 人物说话带湘西腔："要得""莫""哪个"
    - 这一场只写天黑前后这一段时间，不许跳到第二年。
  places:
    - 名称: 茶峒·碧溪岨渡口
      说明: 溪边渡口，一条渡船，白塔就在岸上
      方位: 茶峒城外溪边
      内里: [渡船, 白塔, 石阶, 岸边竹林]
    - 名称: 茶峒·河街
      说明: 沿河的吊脚楼，端午最热闹，龙船从这里下水
      方位: 茶峒城临河一条街
    - 名称: 茶峒·顺顺家
      说明: 船总家，院子里堆着缆索与桐油
      方位: 河街中段
  people:
    - 姓名: 翠翠
      别称: [翠翠, 姑娘]
      身份: 老船夫的外孙女，十五六岁
      性格: 安静，害羞，心里有话不肯说；对谁好都用"恼"来遮
      口癖: 常只说半句，剩下的话咽回去
      秘密: 她已记住那个在水里捉鸭子的年轻人
      目标: 守着爷爷和渡船，日子照旧
      红线: 不许人拿她的心事开玩笑
    - 姓名: 老船夫
      别称: [老船夫, 爷爷, 外公]
      身份: 碧溪岨的摆渡人，翠翠的外公
      性格: 老实，爱喝两杯，心里装着孙女的终身大事却不肯明说
      口癖: 爱说"要得"，喝多了就唱
      秘密: 他看得出两个后生都中意翠翠，怕选错
      目标: 给翠翠寻一门稳妥的亲事
      红线: 不许人欺侮翠翠
    - 姓名: 傩送
      别称: [傩送, 二老]
      身份: 船总顺顺的二儿子，人称二老
      性格: 爽朗，会泅水，说话带笑；心里认真，面上不肯露
      口癖: 爱说"莫怕"
      秘密: 第一眼就喜欢这个骂他的姑娘
      目标: 讨这个姑娘做媳妇
      红线: 不许哥哥让着他
    - 姓名: 天保
      别称: [天保, 大老]
      身份: 顺顺的大儿子，人称大老
      性格: 直，厚，什么都写在脸上
      口癖: 说话大声，爱说"我同你讲"
      秘密: 也知道弟弟的心思，愿意让
      目标: 娶一个能持家的媳妇
      红线: 兄弟不许为一个女子翻脸
  relations:
    - 甲: '翠翠'
      乙: '老船夫'
      关系: '祖孙，相依为命，谁也不肯把心里话说明'
    - 甲: '翠翠'
      乙: '傩送'
      关系: '端午夜初遇，一个骂了一个笑了'
    - 甲: '傩送'
      乙: '天保'
      关系: '亲兄弟，将来要争同一个姑娘'
  foreshadows:
    - 编号: 'F1'
      内容: '端午夜那盏火把，照见翠翠的脸，二老记了很久'
    - 编号: 'F2'
      内容: '爷爷说"要得"，可这门亲事他终究没定下来'
    - 编号: 'F3'
      内容: '白塔在雷雨夜里倒过一次，是全书最重的一笔'
  details:
    - 名称: '渡船'
      说明: '一根竹缆拉来拉去的方头渡船，公家的'
    - 名称: '鸭子'
      说明: '端午龙船赛后，河里放鸭子，谁捉到归谁'
    - 名称: '火把'
      说明: '山里人夜行用的松明火把'
  style:
    pov: 第三人称限知
    era: modern
    sentence: 长句舒缓，多用"的"字结构，句子像水一样慢慢流
    diction: 湘西口语，清淡，不堆形容词，多用声音与颜色
    dialogue: 中，话说一半，靠留白
    taboos: [手机, 电话, 咖啡, 分钟, 情绪, 状态, 压力, 心理, 氛围感]
cases:
  - id: bc-01
    cut: 中段
    at: 端午夜 翠翠在河边等爷爷
    story_time: "傍晚"
    place: 茶峒·河街河边
    present: [翠翠, 傩送, 老船夫]
    focus: [留白, 抒情节奏, 人物初遇]
    previously: |
      茶峒端午赛龙舟，翠翠跟爷爷进城看热闹。龙船赛完，天已经黑了，爷爷被熟人拉去喝酒，
      说好来接她。翠翠一个人坐在河岸的石头上等，河面上还有零星的火把和鼓声，
      看龙船的人渐渐散了。
    scene_seed: |
      水声很响。翠翠抱着膝盖坐着，听见水里有响动，抬头看见一个人从水里冒出来，
      手里提着两只鸭子，水顺着他的胳膊往下淌。那人也看见了她。
    ground_truth:
      hard:
        - 不许让翠翠或傩送把心意说破
        - 不许写明确的心理分析（她心里想…不许）
        - 不许出现现代词汇（氛围/情愫/心动 不许）
        - 不许让老船夫当场定下亲事
      beats:
        - 傩送问她是不是碧溪岨渡船的孙女，笑说"你一个人坐在这里，不怕么"。
        - 翠翠想起方才就是这个人赢了龙船，心里恼，嘴上说"狗，谁要你管"。
        - 傩送不恼，只说"你骂我，我还是要送你回去"，回头叫来一个提火把的伙计。
        - 火把照着路，翠翠走在前面，听见他在后面笑，走了一段，回头时人已经不见了。
        - 回到渡口，爷爷醉醺醺地回来，问她怎么回来的；她只说"有人送"，再不肯多讲。
      excerpt: |
        翠翠一面走一面想，想起日前在大河边看龙船，那二老在水里追赶鸭子的情形，
        心里又觉着有点可笑。她记起那二老说"你骂我，我还是要送你回去"的话，
        脸烧得厉害，一句话也不说，只低着头走。
      divergence_note: |
        这一场不能有表白、不能有解释。翠翠的"恼"就是她的喜欢；
        若写成两人互相看对了眼、明白说破，就不是《边城》了。
      alternatives:
        - stance: 傩送什么也不说，只把捉到的鸭子塞给翠翠就走
          why_valid: 原文里他确实捉了鸭子；让他一句话不说地送出去，更贴边城'有情也不肯先开口'的规矩。
          beats:
            - 傩送从水里上来，把两只鸭子放在翠翠脚边
            - 翠翠低头看鸭子，不看他
            - 他站着，想说什么，终于只说'拿着'
            - 他转身走了，火把的光在河面上晃
