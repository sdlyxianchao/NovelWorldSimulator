id: suspect_x
title: 嫌疑人X的献身
title_en: The Devotion of Suspect X
author: 东野圭吾
year: "2005"
country: 日本
language: ja
category: 当代
medium: 出版
genres: [推理, 犯罪, 数学, 长篇]
representativeness: |
  当代本格推理的代表作之一，也是"叙述性诡计"用得最干净的长篇：读者看到的每一件事都是真的，
  只是被安排过。它检验的是"信息该怎么给"——推理小说的公平性，与推演系统的信息边界同构。
license: in_copyright_short_quote
bible:
  worldview: |
    东京，江东区。廉价公寓并排而立，隔音很差。花冈靖子在便当店做工，
    与女儿美里同住。隔壁住着高中数学教师石神哲哉，一个沉默的中年人，
    每天固定时间出门买便当。靖子的前夫富坚慎二是个无赖，纠缠不休。
    警视厅的草薙与物理学家汤川是旧识。
  rules:
    - 本格推理：所有线索必须对读者公平，不许凭空出现新信息。
    - 石神说话极简，逻辑严密；靖子慌乱，美里沉默。
    - 时间线是核心，几点几分必须交代清楚。
    - 这一场只写案发当夜到第二天清晨。
  places:
    - 名称: 公寓·花冈家
      说明: 一室一厅，隔音差，厨房很小
      方位: 江东区森下町
      内里: [玄关, 起居室, 厨房, 阳台]
    - 名称: 公寓·石神家
      说明: 隔壁，屋里堆满数学书
      方位: 同一层
    - 名称: 便当店
      说明: 靖子打工的地方，早上七点开门
      方位: 车站前
  people:
    - 姓名: 花冈靖子
      别称: [靖子, 母亲, 花冈靖子]
      身份: 便当店店员，离婚独居，带着女儿
      性格: 温顺，疲惫，遇事只会道歉；护起女儿来会拼命
      口癖: 说话小声，常先道歉
      秘密: 她杀了前夫
      目标: 保住女儿，不被抓
      红线: 不许人碰美里
    - 姓名: 美里
      别称: [美里, 女儿]
      身份: 靖子的女儿，高中生
      性格: 沉默，敏感，比母亲更硬
      口癖: 几乎不说话
      秘密: 她动手打了继父
      目标: 让母亲平安
      红线: 不许人进这个家
    - 姓名: 石神
      别称: [石神, 石神哲哉, 隔壁那位]
      身份: 隔壁的高中数学教师，前大学研究员
      性格: 冷静，寡言，把世界看成一道可解的题
      口癖: 说话像在陈述定理
      秘密: 他爱着靖子，并且已经想好了全部安排
      目标: 让这对母女不受追究
      红线: 不许人把他的手法算错
    - 姓名: 汤川
      别称: [汤川, 汤川学]
      身份: 帝都大学物理学家，石神的旧友
      性格: 观察入微，好奇心重，讲道理时不留情面
      口癖: 爱说"有意思"
      秘密: 他已经开始怀疑石神
      目标: 弄清真相
      红线: 不做伪证
  relations:
    - 甲: 石神
      乙: 花冈靖子
      关系: 邻居，他单方面守着这对母女
    - 甲: 花冈靖子
      乙: 美里
      关系: 母女，一个软弱一个倔
    - 甲: 汤川
      乙: 石神
      关系: 旧友，也是唯一能看穿他的人
  foreshadows:
    - 编号: F1
      内容: 石神每天在同一时间买便当，这个"规律"后来成了证词的一部分
    - 编号: F2
      内容: 案发次日清晨，石神在走廊上遇到靖子，只说了一句"今天也辛苦了"
    - 编号: F3
      内容: 那辆被丢弃的自行车，是全书最重要的一件物证
  details:
    - 名称: 便当
      说明: 便当店每天限量，石神总买同一种
    - 名称: 自行车
      说明: 便宜的变速车，被丢在河边
    - 名称: 暖桌
      说明: 母女俩冬天吃饭的小桌
  style:
    pov: 第三人称限知
    era: contemporary
    sentence: 短句，陈述句为主，时间与动作写得极准
    diction: 平实的现代汉语，克制，不写华丽比喻
    dialogue: 中，对话短，信息密度高
    taboos: [手机(可), 咖啡, 分钟(可), 情绪, 状态, 压力, 心理创伤]
cases:
  - id: sx-01
    cut: 开篇
    at: 第一章 靖子杀了前夫，石神敲门
    story_time: "深夜"
    place: 公寓·花冈家
    present: [花冈靖子, 美里, 石神]
    focus: [开篇建置, 信息控制, 紧张感]
    previously: ""
    scene_seed: |
      暖桌翻在一边，富坚倒在地板上，一动不动。靖子的手还在抖，
      美里缩在墙角。门铃响了。隔着一道门，外面的人没有说话。
    ground_truth:
      hard:
        - 不许让石神表现出情绪波动（他始终平静得像在解题）
        - 不许让警方或第三人当场出现（此刻只有这母女与门外的邻居）
        - 不许让靖子主动坦白或自首
        - 不许写出现代侦讯术语（痕检/DNA/监控 一律不许）
      beats:
        - 靖子不敢开门，石神在门外说"我是隔壁的石神"，声音很平静。
        - 他说"我听见了"，又说"这种事，一个人处理不了"。
        - 他没有进门，只在门外问了三件事：几点、用了什么、有没有人看见。
        - 他说"交给我"，让他们把屋子收拾干净，天亮前不要出门。
        - 第二天清晨，他在走廊上遇到靖子，只说了一句"今天也辛苦了"。
      excerpt: |
        "我是隔壁的石神。"门外的人说。
        靖子握着门把，手在抖。"我听见了。"他说，"这种事，一个人处理不了。"
        他问了几点、用了什么、有没有人看见。然后他说："交给我。"
      divergence_note: |
        石神不许表现出任何情绪。他的可怕之处正在于"平静得像在解题"；
        若写成热心邻居仗义相助，这个人物就塌了。
      alternatives:
        - stance: 石神隔着门只问一句就回去，把全部安排留到第二天
          why_valid: 原著里石神的介入正是从极少的几句话开始的；让他当场不多说，既符合他'把世界看成一道可解的题'的性格，也更有压迫感。
          beats:
            - 门铃响，石神在门外自报姓名，说自己听见了动静
            - 他只问了一句'有没有人看见'，听见回答后说'那就好'
            - 他没有进门，只说'明天照常去上班'，脚步远去
            - 靖子靠着门滑坐下去，美里仍缩在墙角
        - stance: 全从美里的视角写，母亲的行动只以声音与影子呈现
          why_valid: 原作本就有大量从美里眼中看出去的段落；把这一段完全交给孩子，能让'母亲做了什么'悬着，也符合设定。
          beats:
            - 美里听见门铃，看见母亲的手在暖桌边上停住
            - 母亲走到门边，她只看见母亲的背影和门缝的光
            - 门外的人说话很轻，她听不清，只听见母亲的呼吸
            - 母亲回来时脸色是白的，什么也没说，先去洗手
