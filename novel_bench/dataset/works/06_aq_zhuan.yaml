id: aq
title: 阿Q正传
title_en: The True Story of Ah Q
author: 鲁迅
year: "1921"
country: 中国
language: zh
category: 现代
medium: 出版
genres: [讽刺, 国民性, 中篇]
representativeness: |
  中国现代小说的奠基作之一。它写一个人如何用"精神胜利法"把每一次挨打都变成胜利，
  叙述者又始终带着一层冷嘲。中文小说里把"内心独白"与"叙述者腔调"分开写得最清楚的一篇，
  正好检验推演系统会不会把两者搅成一团。
license: public_domain
bible:
  worldview: |
    清末民初，鲁镇未庄。赵太爷家是村里第一家，秀才、举人、钱家、假洋鬼子，
    构成了未庄的秩序。阿Q没有家，住在土谷祠，靠打短工过活：舂米、撑船、割麦，
    什么活都做。他没有姓名，没有籍贯，连"姓赵"都不许他说。
    未庄人闲了就拿他取笑，他也拿别人取笑，取笑完了照旧去做工。
  rules:
    - 叙述者用第一人称"我"讲阿Q的事，但"我"始终不出场，只做考证与评点。
    - 阿Q的内心是阿Q的，不许写成作者的思想；他的逻辑要自洽地荒唐。
    - 未庄人说话带浙东土白： "你算是什么东西" "虫豸" "妈妈的"。
    - 这一场只写土谷祠到街上这一小段路，不许跳去写革命党进城。
  places:
    - 名称: 未庄·土谷祠
      说明: 阿Q住的地方，一间破祠，堆着稻草
      方位: 未庄村口
      内里: [神像, 稻草堆, 门槛]
    - 名称: 未庄·酒店
      说明: 村口一家小酒店，闲人聚集，消息都从这里传
      方位: 未庄村口
      内里: [柜台, 长凳, 酒坛]
    - 名称: 未庄·赵太爷门前
      说明: 青石门楼，门口有石阶，村里人路过都要低一头
      方位: 未庄正中
  people:
    - 姓名: 阿Q
      别称: [阿Q, 阿Quei]
      身份: 未庄的短工，无家无业
      性格: 自尊又自贱，挨了打立刻在心里翻盘；怕强欺弱，见了赵太爷就矮半截
      口癖: 常说"我们先前——比你阔的多啦"，被打了就说"儿子打老子"
      秘密: 他其实不记得自己姓什么，也说不清籍贯
      目标: 活得像个"人"，最好能娶个女人
      红线: 不许人提他头上的癞疮疤
    - 姓名: 闲人
      别称: [闲人, 那人]
      身份: 未庄的闲汉，常在酒店门口晒太阳
      性格: 无聊，爱看热闹，动手不为仇恨只为取乐
      口癖: 一句一个"你算是什么东西"
      秘密: 他们也怕赵太爷，只敢欺负阿Q
      目标: 找点乐子
      红线: 不许阿Q还嘴
    - 姓名: 赵太爷
      别称: [赵太爷, 太爷]
      身份: 未庄第一家，秀才的父亲
      性格: 威严，算得清，最重体面
      口癖: 说话拖长音，爱说"你姓赵么"
      秘密: 家里正为革命党的事发慌
      目标: 保住家业与脸面
      红线: 不许穷人称本家
    - 姓名: 小D
      别称: [小D, 小同]
      身份: 未庄的另一个短工，比阿Q年轻
      性格: 瘦弱，嘴硬，跟阿Q抢过活
      口癖: 说话急，爱顶嘴
      秘密: 他也怕阿Q，但看出阿Q更怕人
      目标: 有活干，有饭吃
      红线: 不许叫他"假洋鬼子"
  relations:
    - 甲: '阿Q'
      乙: '闲人'
      关系: '挨打与取乐，未庄日常的一景'
    - 甲: '阿Q'
      乙: '赵太爷'
      关系: '不许姓赵的穷本家，见面就矮三分'
    - 甲: '阿Q'
      乙: '小D'
      关系: '抢活的对手，打起来两败俱伤'
  foreshadows:
    - 编号: 'F1'
      内容: '癞疮疤这三个字，是阿Q一切忌讳的源头'
    - 编号: 'F2'
      内容: '阿Q说"我们先前比你阔的多啦"，这句日后变成他的护身符'
    - 编号: 'F3'
      内容: '土谷祠的神像，阿Q从不拜，却在临死前想起'
  details:
    - 名称: '癞疮疤'
      说明: '阿Q头上的疮疤，他最忌讳别人提'
    - 名称: '黄酒'
      说明: '未庄酒店卖的酒，一碗几个钱，闲人赊账'
    - 名称: '辫子'
      说明: '未庄人头上的辫子，革命党来了才有人剪'
  style:
    pov: 第一人称
    era: modern
    sentence: 中长句，反讽的插入语多，句尾常带一个转折
    diction: 五四白话夹浙东土白，冷嘲，不抒情
    dialogue: 中，对话短促，多为挑衅
    taboos: [手机, 电话, 咖啡, 分钟, 状态, 压力, 心理分析, 情绪管理]
cases:
  - id: aq-01
    cut: 中段
    at: 第二章 优胜记略
    story_time: "午后"
    place: 未庄·酒店门口
    present: [阿Q, 闲人, 小D]
    focus: [内心独白, 反讽, 人物逻辑]
    previously: |
      阿Q在未庄以打短工为生。他头上长了癞疮疤，最忌讳人说"癞"字，推而广之连"光""亮""灯"
      都忌讳。未庄的闲人偏偏爱拿这个取笑他，一取笑，他就发怒，一發怒就打，
      打不过就被人揪住辫子在墙上碰几个响头。这一天他又在酒店门口晒太阳。
    scene_seed: |
      一个闲人走过来，斜着眼看他的头，故意把话说得含含糊糊。阿Q先装作没听见，
      手却已经攥紧了。旁边小D抱着胳膊站着看。
    ground_truth:
      hard:
        - 不许让阿Q真的打赢（他必须挨打）
        - 不许让叙述者替阿Q总结心理（必须写他自己的念头）
        - 不许用现代心理学词（自尊/补偿/投射 不许）
        - 不许让闲人说出有教养的话
      beats:
        - 闲人终于说出"亮起来了"，阿Q跳起来骂，动手，被揪住辫子往墙上碰了五下。
        - 闲人还要他认"人打畜生"，阿Q起初不肯，挨了打才低声说"打虫豸，好不好？我是虫豸"。
        - 闲人满意地走了。阿Q站了一刻，心里想：我是第一个能自轻自贱的人，状元也是"第一"，算起来还是我赢。
        - 于是他得意起来，去酒店赊酒喝；酒罢回土谷祠，倒头便睡，睡得很安稳。
      excerpt: |
        闲人还不完，只撩他，于是终而至于打。阿Q在形式上打败了，被人揪住黄辫子，
        在壁上碰了四五个响头，闲人这才心满意足的得胜的走了。阿Q站了一刻，心里想，
        "我总算被儿子打了，现在的世界真不像样……"于是也心满意足的得胜的走了。
      divergence_note: |
        关键在"翻盘"那一步的心理转折必须写在阿Q的逻辑里，而不是由叙述者替他总结。
        写出来的效果应当让读者既想笑又难受；只写"他很生气"就算没接住。
      alternatives:
        - stance: 阿Q挨打后不说'儿子打老子'，改成把自己认作'第一个能挨打的人'
          why_valid: 精神胜利法的核心是'换个比法我就赢了'；换一个比法同样成立，且更荒唐。
          beats:
            - 闲人揪住辫子往墙上碰，阿Q不还手
            - 碰完他蹲在地上想：能挨这么多下还不倒的，未庄只有我一个
            - 他于是觉得自己比闲人强
            - 他站起来，拍拍土，去酒店赊酒
