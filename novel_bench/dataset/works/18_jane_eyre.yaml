id: jane_eyre
title: 简·爱
title_en: Jane Eyre
author: 夏洛蒂·勃朗特
year: "1847"
country: 英国
language: en
category: 古典
medium: 出版
genres: [哥特, 成长, 爱情, 第一人称]
representativeness: |
  英语第一人称小说的典范。一个相貌平平、地位低下的家庭女教师，靠"我"的声音撑起整本书；
  同时它又是哥特小说：笑声、火光、阁楼上的秘密。它测的是"叙述者的自我意识"能不能被写出来。
license: public_domain
bible:
  worldview: |
    英格兰北方，维多利亚时代早年。桑菲尔德庄园的主人是罗切斯特先生，常年在外，
    家里只有管家费尔法克斯太太、一个法国小女孩和一群仆人。
    简·爱是孤儿，做过洛伍德慈善学校的教师，来桑菲尔德任家庭教师。
    庄园很大，走廊很长，夜里常有奇怪的笑声。身份等级森严：家庭教师不算客人，也不算仆人。
  rules:
    - 第一人称，简的叙述克制、准确，不自我怜悯。
    - 有哥特元素，但每一件怪事都必须有现实解释，只是解释得晚。
    - 简说话直，罗切斯特说话粗鲁而试探。
    - 这一场只写夜里起火到天亮这一段。
  places:
    - 名称: 桑菲尔德·三楼走廊
      说明: 走廊很长，地毯旧了，尽头是阁楼的门
      方位: 桑菲尔德庄园三楼
    - 名称: 桑菲尔德·罗切斯特的卧室
      说明: 大床，帐幔厚重，壁炉常年点着
      方位: 桑菲尔德二楼东端
    - 名称: 桑菲尔德·图书室
      说明: 费尔法克斯太太常在这儿做针线
      方位: 桑菲尔德一楼
  people:
    - 姓名: 简·爱
      身份: 桑菲尔德庄园的家庭教师
      性格: 外表安静，内里极硬；受辱必回嘴，但从不失礼
      口癖: 说话简短直接，心里常自问"这公平吗"
      秘密: 她已经爱上罗切斯特，却绝不肯承认
      目标: 保住自己的独立与尊严
      红线: 不许人拿她的贫穷与相貌取笑
    - 姓名: 罗切斯特
      身份: 桑菲尔德的主人
      性格: 阴郁，专横，喜欢试探别人；心里有沉重的秘密
      口癖: 说话带命令式，爱说"你"
      秘密: 三楼关着他的妻子
      目标: 找一个能平等说话的人
      红线: 不许人上三楼
    - 姓名: 费尔法克斯太太
      身份: 桑菲尔德的管家
      性格: 和善，谨慎，凡事往好处想
      口癖: 爱说"亲爱的"
      秘密: 她也听过那笑声，但选择不问
      目标: 把家管好
      红线: 不议论主人
    - 姓名: 格雷斯·普尔
      身份: 三楼的女仆
      性格: 粗壮，沉默，爱喝酒
      口癖: 说话含混，常自言自语
      秘密: 她负责看管那个不能说的人
      目标: 保住这份工
      红线: 不让人靠近阁楼
  relations:
    - 甲: 简·爱
      乙: 罗切斯特
      关系: 主仆，也是唯一能与他平等对话的人
    - 甲: 罗切斯特
      乙: 格雷斯·普尔
      关系: 雇主与守秘人
    - 甲: 简·爱
      乙: 费尔法克斯太太
      关系: 受照顾的年轻人与好心的长辈
  foreshadows:
    - 编号: F1
      内容: 夜里的笑声，简第一次听见时以为是自己耳鸣
    - 编号: F2
      内容: 罗切斯特说"你救了我的命"，这句话日后有了另一层意思
    - 编号: F3
      内容: 阁楼的门锁着，钥匙在格雷斯·普尔身上
  details:
    - 名称: 水罐
      说明: 简房里的一只陶罐，用来洗漱
    - 名称: 帐幔
      说明: 罗切斯特床上的厚帐，起火时烧得最快
    - 名称: 蜡烛
      说明: 夜里熄灯是规矩，走廊只留一盏
  style:
    pov: 第一人称
    era: premodern
    sentence: 中长句，叙述清晰，情绪压在句尾
    diction: 维多利亚英语的中文对应：端正、克制、少修饰
    dialogue: 高，对话里全是试探
    taboos: [手机, 电话, 咖啡, 分钟, 情绪, 状态, 压力, 心理阴影]
cases:
  - id: je-01
    cut: 中段
    at: 第一卷 罗切斯特的卧室起火
    story_time: "深夜"
    place: 桑菲尔德·三楼走廊
    present: [简·爱, 罗切斯特, 格雷斯·普尔]
    focus: [哥特氛围, 第一人称, 行动中的情感]
    previously: |
      简到桑菲尔德两个月，渐渐与罗切斯特熟起来。这一夜她被一阵奇怪的笑声惊醒，
      声音从三楼传来，又像是从自己门外经过。她起身去看，走廊里有一股焦味。
    scene_seed: |
      烟从罗切斯特房间的门缝里渗出来。简推开门，看见床帐已经烧起来，
      主人躺在床上，一动不动。火苗正往帐顶爬。
    ground_truth:
      hard:
        - 不许让简说出爱慕之意（她绝不肯先承认）
        - 不许让罗切斯特说出三楼的秘密
        - 不许让火自己熄灭（必须有人扑灭）
        - 不许写超自然现象（笑声必须有出处）
      beats:
        - 简端起房里的水罐，把水全泼在帐子上，又去端洗脸盆，来回几趟把火浇灭。
        - 罗切斯特被呛醒，坐起来，看见她满手是水，先问"是你吗，简"。
        - 他不许她去叫仆人，说这事不能传出去；简问为什么，他只说"别问"。
        - 他握住她的手，说"你救了我的命"，又说"我很高兴欠你一条命"。
        - 天亮前他让她回房，临走回头看了她一眼；简一夜没睡，心里说不清是怕还是别的。
      excerpt: |
        我端起水罐，把水泼在床帐上，又跑回自己房里端来洗脸盆，来回几趟，火终于灭了。
        他坐起来，声音沙哑："是你吗，简？"我说是我。他沉默了很久，说："你救了我的命。
        我很高兴欠你一条命。"天还没亮，他让我回房去，别叫人知道。
      divergence_note: |
        这一场不能写表白。情感要藏在"他又握了一下我的手"这种动作里；
        若让两人当场倾诉，哥特的阴冷和身份的隔阂就同时没了。
      alternatives:
        - stance: 简先救火，再退回自己房里，全程不与罗切斯特说话
          why_valid: 她的自尊不允许她在那种时刻多留一刻；沉默地救完就走，同样是她的选择。
          beats:
            - 简端水扑火，来回几趟
            - 罗切斯特醒来，她已退到门口
            - 他说'是你吗'，她答'是我'，然后行了个礼退出
            - 回到房里，她坐到天亮
