id: luotuoxiangzi
title: 骆驼祥子
title_en: Rickshaw Boy
author: 老舍
year: "1936"
country: 中国
language: zh
category: 现代
medium: 出版
genres: [都市, 底层, 悲剧, 长篇]
representativeness: |
  中国现代长篇里写"人怎样被一座城磨碎"最狠的一部。老舍的北京口语是全书的骨：
  短句、儿化、动词密。它测的是"语言的口语质地"和"一个卑微愿望如何一步步落空"的长线因果。
license: public_domain
bible:
  worldview: |
    民国十八年的北平。洋车是城里最常见的营生：拉车的靠两条腿和一辆车吃饭，
    车是租的还是自己的，是两种人生。车厂由刘四爷这样的人把着，车份儿一天一交；
    虎妞是刘四爷的女儿，三十七八岁，管着厂里的账。祥子是乡下进城的孤儿，
    身量大、肯下力，最大的念想就是有一辆自己的车。
  rules:
    - 全部用北平口语：儿化、短句、"敢情""得嘞""拉倒"。
    - 不写作者评点，只写祥子眼里看见的东西和他的念头。
    - 钱要算得清：车份儿、车价、饭钱，数目要对得上那年月。
    - 这一场只写从车厂到天桥这一路，不许跳到几年后。
  places:
    - 名称: 人和车厂
      说明: 刘四爷开的车厂，院里停着几十辆车，晚上车夫在这儿睡大通铺
      方位: 西安门大街
      内里: [车棚, 账房, 大通铺, 院子]
    - 名称: 天桥
      说明: 卖艺的、算命的、卖吃食的都在这一片，人多声杂
      方位: 前门外
    - 名称: 西四牌楼
      说明: 拉车常走的路线，牌楼下总有人等活
      方位: 西四
  people:
    - 姓名: 祥子
      别称: [祥子]
      身份: 乡下进城的洋车夫，二十出头
      性格: 闷，倔，认死理；把力气当本钱，觉得只要肯拉就能出头
      口癖: 话少，急了只说"我拉"
      秘密: 攒了三年，九十六块，谁也没告诉
      目标: 买一辆自己的车，再也不交车份儿
      红线: 不许人说他拉不动
    - 姓名: 刘四爷
      别称: [刘四爷, 四爷]
      身份: 人和车厂厂主，六十来岁
      性格: 精明，剽悍，笑里带刀；把车厂当命
      口癖: 爱说"我这儿不养闲人"
      秘密: 年轻时也是混混出身，怕人提
      目标: 把车厂守住，把女儿嫁出去
      红线: 不许人欠车份儿
    - 姓名: 虎妞
      别称: [虎妞]
      身份: 刘四爷的女儿，管厂里的账
      性格: 泼，狠，心里有算计；看上谁就一定要到手
      口癖: 说话带刺，爱说"你当我不知道"
      秘密: 已经三十七八，怕自己嫁不出去
      目标: 把祥子攥在手里
      红线: 谁也别想把她赶出车厂
    - 姓名: 老程
      别称: [老程]
      身份: 车厂里的老车夫，五十多
      性格: 认命，爱说风凉话，也肯帮人
      口癖: 一句一个"兄弟"
      秘密: 拉了一辈子车，一辆也没攒下
      目标: 拉一天算一天
      红线: 不掺和别人的事
  relations:
    - 甲: '祥子'
      乙: '刘四爷'
      关系: '车夫与厂主，一个交车份儿一个收车份儿'
    - 甲: '虎妞'
      乙: '祥子'
      关系: '她看上了他，他躲着她'
    - 甲: '祥子'
      乙: '老程'
      关系: '同铺的师兄弟，一个还有念想，一个已经认命'
  foreshadows:
    - 编号: 'F1'
      内容: '九十六块钱缝在铺盖里，后来这笔钱救了他的命，也害了他'
    - 编号: 'F2'
      内容: '刘四爷说"我这儿不养闲人"，这句话日后把祥子逼到墙角'
    - 编号: 'F3'
      内容: '城外过兵的风声，报上没写，车夫们只当闲话'
  details:
    - 名称: '车份儿'
      说明: '拉车的一天要交给车厂的租钱'
    - 名称: '大通铺'
      说明: '车厂里车夫们睡的通铺，一夜几个铜子'
    - 名称: '洋车'
      说明: '两个胶皮轮、一副车把，好车亮得能照见人'
  style:
    pov: 第三人称限知
    era: modern
    sentence: 短句为主，一句一个动作，很少从句
    diction: 北平口语，儿化，动词密，形容词少
    dialogue: 中，话说得糙，理说得直
    taboos: [手机, 电话, 咖啡, 分钟, 情绪, 状态, 压力, 心理疏导]
cases:
  - id: ltxz-01
    cut: 开篇
    at: 第一章 祥子攒够了钱，去看车
    story_time: "上午"
    place: 人和车厂
    present: [祥子, 刘四爷, 虎妞, 老程]
    focus: [开篇建置, 口语质地, 欲望具体化]
    previously: ""
    scene_seed: |
      祥子蹲在车棚底下，把铺盖卷打开一条缝，手伸进去，摸到那卷票子。
      院里刘四爷正在骂人，虎妞靠在账房门口嗑瓜子。老程从大通铺里探出头来，
      看见祥子那个动作，笑了一声。
    ground_truth:
      hard:
        - 不许让祥子当场买到车（钱要数清楚，账要算得对）
        - 不许让刘四爷主动借钱给祥子
        - 不许用现代词（奋斗/阶层/命运 不许）
        - 不许让祥子说出成段的道理（他话少）
      beats:
        - 祥子数了三遍，九十六块，还差几块；他咬咬牙，决定去车行讲讲价。
        - 刘四爷看出他要买车，先说"你小子行啊"，又要他再等两个月，车份儿照交。
        - 祥子不吭声，转身出去，在天桥车行里看中一辆八成新的车，九十六块，成交。
        - 他把车推到院里，擦了一遍又一遍，晚上睡不着，起来又擦。
        - 第二天拉第一趟，他觉得车把是活的，跑起来脚下生风——这是全书唯一一次他真的高兴。
      excerpt: |
        祥子的手哆嗦得更厉害了，揣起保单，拉起车，几乎要哭出来。拉到个僻静地方，
        细细端详自己的车，在漆板上试着照照自己的脸！越看越可爱，就是那不尽合自己的理想的地方
        也都可以原谅了，因为已经是自己的车了。把车看得似乎暂时可以休息会儿了，
        他坐在了水簸箕的新脚垫儿上，看着车把上的发亮的黄铜喇叭。
      divergence_note: |
        这是开篇，没有前情。必须让读者在第一段就知道"这个人要什么、缺什么、肯付出什么"。
        若一上来就写北平风物、写时代背景，等于没开篇。
        ⚠ 数字口径：他攒的**九十六块正好够那辆车**（原文就是九十六块成交）。
        不要写成"还差几块"或"不够"——2026-10-18 两轮评测里模型都算错了这笔账，
        评委把它记成了设定冲突。
      alternatives:
        - stance: 祥子数完钱没去买车，先把钱又藏回去（舍不得）
          why_valid: 原著里他攒了三年才敢动；让他再等一等，是同一性格的另一种走法，也更符合'把钱缝在铺盖里'的人。
          beats:
            - 祥子把钱数了三遍，九十六块，够买一辆
            - 他把钱重新包好，塞回铺盖缝里
            - 老程问他蹲那儿干什么，他说没事
            - 他站起来，去院里擦车，擦得比平时久
