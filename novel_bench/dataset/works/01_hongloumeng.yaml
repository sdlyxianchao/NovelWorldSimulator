id: hongloumeng
title: 红楼梦
title_en: Dream of the Red Chamber
author: 曹雪芹
year: "1791"
country: 中国
language: zh
category: 古典
medium: 出版
genres: [世情, 家族, 群像, 悲剧]
representativeness: |
  中国古典小说的巅峰。以一家一族的日常细故写盛衰，人物声音的区分度、场面调度的层次感
  至今是中文小说的标尺。选它是因为它几乎全部由"一群人在一个院子里说话"构成——
  正是多智能体推演最该学、也最容易露怯的地方。
license: public_domain
bible:
  worldview: |
    贾府是开国功臣之后，如今靠元春在宫里撑着体面，外头早已入不敷出。
    荣宁二府同住一条街，规矩大、人口多、人情细：谁跟谁是一个月例，谁该坐哪一桌，
    哪句话是玩笑哪句话是刀子，都在日常里。府里上下几百口人，真正拿主意的只有贾母。
    这一房的年轻一辈都住在园子里，诗社、宴席、生日、丧事，一桩接一桩，热闹底下是亏空。
  rules:
    - 没有超自然力量。所谓"通灵"只是宝玉那块玉的来历，不许显灵、不许托梦。
    - 人物不知道的事，叙述与对白都不许知道；丫鬟不得越过主子先开口。
    - 称谓必须照府里的规矩：老太太、太太、二爷、姑娘、奶奶，不许混用。
    - 这一场只写一个时辰里的事，不许一句带过半年。
  places:
    - 名称: 荣国府·贾母院
      说明: 府里最体面的上房，老太太起居处，饭点最热闹
      方位: 荣国府中路，穿过穿堂即是
      内里: [上房, 碧纱橱, 耳房, 廊下, 后院]
    - 名称: 荣国府·荣禧堂
      说明: 正堂，接待外客、办大事的地方，平日冷清
      方位: 荣国府中路正厅
    - 名称: 大观园·潇湘馆
      说明: 黛玉住处，几竿竹子，院里比别处静
      方位: 大观园西路
      内里: [正房, 书房, 月洞窗, 竹径]
    - 名称: 大观园·蘅芜苑
      说明: 宝钗住处，屋里雪洞一般，没什么摆设
      方位: 大观园东路
  people:
    - 姓名: 贾母
      别称: [老太太, 老祖宗, 史太君]
      身份: 荣国府老祖宗，史太君，一家之主
      性格: 极疼孙辈，爱热闹，场面上的话滴水不漏；真动气时只说一句半句
      口癖: 常说"罢了罢了"，叫宝玉"我的儿"
      秘密: 早知道家里亏空，压着不说，怕小辈慌
      目标: 让这一家在她活着的时候别散
      红线: 不许有人在她面前作践黛玉
    - 姓名: 王熙凤
      别称: [凤姐, 凤辣子, 凤丫头, 奶奶]
      身份: 贾琏之妻，荣府当家奶奶
      性格: 泼辣爽利，最会看人下菜；笑着说话，话说得比刀子快
      口癖: 自称"凤辣子"，爱说"我来了迟了"
      秘密: 私下放利钱，账上有窟窿
      目标: 把差事办得漂亮，把权抓在手里
      红线: 谁也不能越过她直接回老太太
    - 姓名: 林黛玉
      别称: [黛玉, 林姑娘, 林妹妹]
      身份: 贾母的外孙女，丧母后寄居贾府
      性格: 敏感聪慧，话少而尖，心里想的比说出来的多十倍
      口癖: 心里自称"我"，嘴上常带"罢了"
      秘密: 从进府第一天就觉得自己是外人
      目标: 不叫人看轻，也不叫人可怜
      红线: 不许人拿她家里的事当笑话
    - 姓名: 贾宝玉
      别称: [宝玉, 宝二爷]
      身份: 贾母的孙子，衔玉而生
      性格: 对女孩儿敬重到痴，对仕途经济一窍不通；说话直，情绪来得快
      口癖: 常说"女儿是水做的"，急了就摔玉
      秘密: 厌恶读书做官，只想在园子里混一辈子
      目标: 跟姐妹们在一处，不散
      红线: 不许人说他那块玉是祸根
    - 姓名: 王夫人
      别称: [太太, 王氏]
      身份: 贾政之妻，宝玉之母
      性格: 面上木讷寡言，心里有成算；最怕儿子学坏
      口癖: 常念"阿弥陀佛"
      秘密: 已暗暗留意园子里"不干净"的丫头
      目标: 保住宝玉的名声
      红线: 不许谁在宝玉屋里生事
  relations:
    - 甲: '贾母'
      乙: '林黛玉'
      关系: '外祖母与外孙女，疼到骨子里'
    - 甲: '王熙凤'
      乙: '贾母'
      关系: '孙媳，最会讨老太太欢心，也最怕她'
    - 甲: '林黛玉'
      乙: '贾宝玉'
      关系: '初见即觉眼熟，此后一生纠缠'
    - 甲: '王夫人'
      乙: '王熙凤'
      关系: '姑侄兼婆媳，互相倚重也互相提防'
  foreshadows:
    - 编号: 'F1'
      内容: '宝玉的玉上刻着"莫失莫忘，仙寿恒昌"，与宝钗的金锁是一对'
    - 编号: 'F2'
      内容: '黛玉进府第一晚独自垂泪，说明她始终把自己当客'
    - 编号: 'F3'
      内容: '凤姐的利钱账目，日后是抄家的口子之一'
  details:
    - 名称: '通灵宝玉'
      说明: '宝玉落草时衔在嘴里的一块玉，府里人人当宝贝'
    - 名称: '月例银子'
      说明: '府里按月发的份例，各房数目不同，最见身份'
    - 名称: '碧纱橱'
      说明: '贾母房里隔出来的一间，黛玉初来就安置在这里'
  style:
    pov: 第三人称全知
    era: premodern
    sentence: 长短交错，白描为主，一句话里常藏两层意思
    diction: 明清白话，称谓严格，少用形容词，多用动作与器物
    dialogue: 高，七成戏在对话与眼神里
    taboos: [手机, 电话, 咖啡, 分钟, 情绪, 状态, 压力, 心理, 潜意识, 氛围]
cases:
  - id: hlm-01
    cut: 中段
    at: 第三回 林黛玉初进荣国府，见过贾母之后
    story_time: "午后"
    place: 荣国府·贾母院
    present: [贾母, 林黛玉, 王熙凤, 王夫人]
    focus: [人物声音, 场面调度, 关系张力]
    previously: |
      黛玉的母亲贾敏病故，父亲林如海托贾雨村送她进京，投奔外祖母。
      她一路小心，"步步留心，时时在意"，进了荣国府，先见贾母，祖孙抱头痛哭；
      又见过王夫人，被叮嘱"我有一个孽根祸胎，你别理他"。此刻她回到贾母房中，
      正听贾母说家常。
    scene_seed: |
      贾母拉着黛玉的手问读书、问吃药，正说着，院子里忽然传来一阵笑声和脚步，
      还没见人，话先到了。王夫人往门口看了一眼，低声说了句什么。
    ground_truth:
      hard:
        - 不许让黛玉事先知道来者是王熙凤（她此刻只是纳罕，不认识这个人）
        - 不许用现代称谓（小姐/女士/夫人一律不许，必须用姑娘/奶奶/太太/老太太）
        - 不许让宝玉在黛玉刚进屋时就已站在屋里（他此刻还在外面）
        - 不许出现超自然显灵（通灵宝玉只是块玉，不许发光、不许托梦）
        - 不许让丫鬟越过主子先开口
      beats:
        - 王熙凤未见其人先闻其声，笑着进来，说"我来迟了，不曾迎接远客"。
        - 她拉着黛玉上下细看，夸"天下真有这样标致的人物"，说着又想起姑妈，拿帕子拭泪。
        - 贾母笑骂她"凤辣子"，她立刻转笑，问黛玉几岁、读什么书、吃什么药，回头吩咐婆子收拾屋子。
        - 饭毕，宝玉从外面回来，一见黛玉便说"这个妹妹我曾见过的"。
        - 宝玉问黛玉有没有玉，听说没有，登时发作，摘下自己的玉往地上摔。
      excerpt: |
        一语未了，只听后院中有人笑声说："我来迟了，不曾迎接远客！"黛玉纳罕道：这些人个个皆敛声屏气，
        恭肃严整如此，这来者系谁，这样放诞无礼。心下想时，只见一群媳妇丫鬟围拥着一个人从后房门进来。
        这个人打扮与众姑娘不同，彩绣辉煌，恍若神妃仙子。黛玉连忙起身接见。贾母笑道："你不认得他，
        他是我们这里有名的一个泼皮破落户儿，南省俗谓作'辣子'，你只叫他'凤辣子'就是了。"
        这熙凤携着黛玉的手，上下细细打量了一回，仍送至贾母身边坐下，因笑道："天下真有这样标致的人物，
        我今儿才算见了！"说着，便用帕拭泪。贾母笑道："我才好了，你倒来招我。"
      divergence_note: |
        推演不必照抄原文的相貌铺陈与服饰清单；但凤姐"先声后人"、当众夸赞又转泪、
        贾母一句"凤辣子"定调，这三步是这一场的骨架，缺一步就算没接住。
      alternatives:
        - stance: 凤姐先问月例银子、不夸黛玉容貌（把她的算账脑摆到台面上）
          why_valid: 凤姐是当家人，她的第一反应可以是'这个人往后要吃穿用度'而不是'这人好看'；这与她'把差事办得漂亮、把权抓在手里'的目标一致，也没有踩任何硬约束。
          beats:
            - 王熙凤未见其人先闻其声，进来先向贾母请安，再回头问婆子月例发到哪一房
            - 她打量着黛玉，说的是'这姑娘的四季衣裳得照着姑娘们的例子添'，不是夸容貌
            - 贾母笑着骂她'凤辣子'，说'才来就惦记你的账'
            - 黛玉听她句句在算，心里觉得这人厉害，反倒不觉得被怠慢
        - stance: 全从黛玉的感受写，凤姐的排场只用她看见的一角带出
          why_valid: 原文是第三人称全知，但改用黛玉限知同样成立：读者跟着一个外人的眼睛看这座府邸，反而更接近'投奔亲戚'的处境，且不违背任何设定。
          beats:
            - 黛玉先听见笑声，再看见帘子动，只看见一角水红袄袖
            - 她被人拉住手翻看，只觉得那人的指甲修得极好、腕上有只金镯
            - 她听不清对方说了什么，只听见贾母笑，屋里人都跟着笑
            - 她跟着笑，心里想的是'我该不该也笑'
  - id: hlm-02
    cut: 转折
    at: 第四十回 史太君两宴大观园，刘姥姥入席
    story_time: "晌午"
    place: 大观园·藕香榭
    present: [贾母, 王熙凤, 林黛玉, 贾宝玉, 王夫人]
    focus: [群像, 喜剧节奏, 人物区分度]
    previously: |
      乡下亲戚刘姥姥因年成不好，二进荣国府打秋风。贾母正想找个积古的老人说话，
      留她住下，又带她逛园子。凤姐与鸳鸯私下商量，要拿她取笑一回，事先递了暗号，
      教她席上只管说笑。此刻宴席刚摆上，刘姥姥坐在下首，众人都在等她开口。
    scene_seed: |
      鸳鸯立在刘姥姥身后，悄悄扯她的袖子。满桌人都不动筷，眼角都瞟着她。
      刘姥姥站起身，清了清嗓子。
    ground_truth:
      hard:
        - 不许让刘姥姥自己先知道这是被安排好的玩笑（她是被递暗号的）
        - 不许写成众人齐声同一种笑法（各人的笑必须不同）
        - 不许用现代口语（搞笑/气氛/效果 一律不许）
        - 不许让贾母当场训斥凤姐鸳鸯（她自己也笑了）
      beats:
        - 刘姥姥起身高声念："老刘老刘，食量大似牛，吃一个老母猪不抬头。"自己鼓着腮不语。
        - 满桌哄堂：湘云一口饭喷出来，黛玉伏在桌上笑岔了气，宝玉滚到贾母怀里，王夫人笑得说不出话。
        - 贾母笑得叫"心肝"，让人扶住；凤姐与鸳鸯一边笑一边讨饶，说"都是凤丫头教的"。
        - 刘姥姥自己倒不笑，只说"我们乡下人吃饭，就是这个样子"。
        - 席后凤姐给她赔不是，又添了衣裳吃食，把人情做圆。
      excerpt: |
        刘姥姥便站起身来，高声说道："老刘，老刘，食量大似牛，吃一个老母猪不抬头。"自己却鼓着腮不语。
        众人先是发怔，后来一听，上上下下都哈哈大笑起来。史湘云撑不住，一口饭都喷了出来；
        林黛玉笑岔了气，伏着桌子只叫"嗳哟"；宝玉早滚到贾母怀里，贾母笑的搂着宝玉叫"心肝"；
        王夫人笑的用手指着凤姐儿，只说不出话来；薛姨妈也撑不住，口里茶喷了探春一裙子。
      divergence_note: |
        允许不用原句，但"一句粗话引爆满桌、各人笑法不同、始作俑者被当场点破"这条链不能断。
        若写成众人齐声大笑而无差别，这一场就算失败——它考的正是群像区分度。
      alternatives:
        - stance: 刘姥姥识破却不点破，反过来把凤姐也套进去（乡人的精明）
          why_valid: 刘姥姥二进荣国府是来打秋风的，她比谁都清楚自己在被取笑；让她顺着演、末了反将一军，既符合'久经世故的乡下老人'，也更有戏。
          beats:
            - 刘姥姥起身念了那句粗话，满桌哄堂
            - 笑过之后她不慌不忙添一句'我们乡下人不会说笑话，倒是听说府里的奶奶最会逗人'
            - 众人转向凤姐，凤姐一时接不上，自己先笑倒了
            - 贾母笑得直摆手，说'这婆子倒把你治住了'
