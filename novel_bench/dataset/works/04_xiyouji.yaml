id: xiyouji
title: 西游记
title_en: Journey to the West
author: 吴承恩
year: "1592"
country: 中国
language: zh
category: 古典
medium: 出版
genres: [神魔, 冒险, 讽刺, 师徒]
representativeness: |
  神魔小说的集大成者。一个师父、三个徒弟、一匹马的四人组，是中文叙事里最著名的"团队配置"：
  每个人的功能、脾气、说话方式都清清楚楚，冲突天天发生又天天和解。
  它是检验"多个角色能不能各说各话"的最好样本。
license: public_domain
bible:
  worldview: |
    大唐贞观年间，僧人玄奘奉旨西行取经，路上收了三个徒弟：孙悟空、猪八戒、沙僧，
    外加白龙马。师徒四人一路向西，妖魔鬼怪多半是天上神佛的坐骑童子下界。
    取经要经九九八十一难，少一难都不成。唐僧肉眼凡胎，认不得妖；悟空火眼金睛，
    却生性急燥，一棒下去常被师父当成行凶。
  rules:
    - 有神有妖，但都要守自己的规矩：妖要吃人得先起风、先变化，不能凭空出现。
    - 悟空一个筋斗十万八千里，但背不动师父——取经必须一步步走。
    - 紧箍咒只对悟空有效，念起来疼得打滚，这是师父唯一的实权。
    - 这一场只写山路上这一顿饭的工夫，不许一句"行了几日"跳过去。
  places:
    - 名称: 白虎岭·山路
      说明: 荒山野岭，前后无人烟，只有一条羊肠小路
      方位: 白虎岭西坡
      内里: [山路, 乱石, 枯树, 崖边]
    - 名称: 白虎岭·石屋
      说明: 妖精幻化的宅院，远看是青瓦白墙
      方位: 白虎岭深处
    - 名称: 山神庙
      说明: 岭下废弃的小庙，师徒歇脚处
      方位: 白虎岭东麓
  people:
    - 姓名: 唐僧
      身份: 取经人，唐僧师父
      性格: 心善到不辨真假，认死理，最重"不杀生"三字
      口癖: 常念"阿弥陀佛"，训人时叫"悟空"
      秘密: 心里其实怕自己管不住这个徒弟
      目标: 平安到西天，一寸路都不肯绕
      红线: 见不得杀生，尤其见不得杀人
    - 姓名: 孙悟空
      身份: 齐天大圣，唐僧大徒弟
      性格: 火眼金睛，眼里揉不得沙子；急躁，被冤枉就要走
      口癖: 自称"老孙"，急了一叠声"师父"
      秘密: 头上的紧箍是他唯一的软肋
      目标: 保师父过岭，一个妖都不留
      红线: 不许人说他滥杀
    - 姓名: 猪八戒
      身份: 天蓬元帅贬下凡，唐僧二徒弟
      性格: 贪吃懒做，最会挑拨，也最会打圆场
      口癖: 爱说"师父"，动不动就"散伙分行李"
      秘密: 早看出那女子不对，但懒得说
      目标: 少走路，多吃饭
      红线: 别叫他去探路
    - 姓名: 沙僧
      身份: 卷帘大将贬下凡，唐僧三徒弟
      性格: 沉默，挑担，谁的话都听，关键时说一句实话
      口癖: 只叫"师父""大师兄"
      秘密: 知道大师兄委屈，但不敢多嘴
      目标: 平平安安走完
      红线: 不许散伙
    - 姓名: 白骨精
      身份: 白虎岭上的尸魔，善变化
      性格: 阴狠，耐心极好，一次不成再变一次
      口癖: 说话细声细气，专挑软处说
      秘密: 吃了唐僧肉可长生，她已等了百年
      目标: 骗过唐僧，把悟空逼走
      红线: 绝不在唐僧面前现原形
  relations:
    - 甲: '孙悟空'
      乙: '唐僧'
      关系: '师徒，一个要杀一个要救，谁也离不开谁'
    - 甲: '猪八戒'
      乙: '孙悟空'
      关系: '师兄弟，明里帮衬暗里拆台'
    - 甲: '白骨精'
      乙: '唐僧'
      关系: '猎人与猎物，专攻唐僧的善心'
    - 甲: '沙僧'
      乙: '唐僧'
      关系: '最不说话的那个，往往看得最清'
  foreshadows:
    - 编号: 'F1'
      内容: '悟空临走前说"我去去就来"，一句话埋下三次打杀的伏笔'
    - 编号: 'F2'
      内容: '紧箍咒这一回第一次被当真用来惩罚，师徒的裂缝从这里开始'
    - 编号: 'F3'
      内容: '妖精每次留下的"尸身"都不一样：少女、老妇、老翁'
  details:
    - 名称: '紧箍'
      说明: '观音给的金箍，念咒即收紧，嵌在悟空头上'
    - 名称: '金箍棒'
      说明: '悟空的兵器，可大可小，藏于耳中'
    - 名称: '斋饭'
      说明: '妖精变作送饭的村女，篮里是"香米饭""炒面筋"'
  style:
    pov: 第三人称全知
    era: premodern
    sentence: 明快，多四字与口语，动作句连着走
    diction: 明代白话，神魔称谓（妖怪、师父、老孙、呆子）
    dialogue: 很高，师徒斗嘴占大半
    taboos: [手机, 电话, 咖啡, 分钟, 情绪, 状态, 压力, 氛围]
cases:
  - id: xyj-01
    cut: 转折
    at: 第二十七回 尸魔三戏唐三藏
    story_time: "晌午"
    place: 白虎岭·山路
    present: [唐僧, 孙悟空, 猪八戒, 沙僧, 白骨精]
    focus: [人物声音, 冲突升级, 信息边界]
    previously: |
      师徒四人过了白虎岭，山高路险，唐僧腹中饥饿，叫悟空去化斋。悟空纵云去了，
      临走画了个圈把师父师弟护在中间。八戒嫌闷，撺掇师父往前走，走出圈子。
      不多时，山坳里转出一个提着篮子的女子，说是给地里丈夫送饭的。
    scene_seed: |
      女子走到近前，把篮子放下，掀开盖布，饭香散开。八戒先凑上去。
      唐僧合掌道谢，问她家在哪里、为何独自走山路。悟空这时从云头落下，
      火眼金睛一照，脸色就变了。
    ground_truth:
      hard:
        - 不许让唐僧识破妖精（他是肉眼凡胎）
        - 不许让悟空一次就打死妖精（必须三次）
        - 不许让八戒真心帮悟空（他必须挑拨）
        - 不许出现现代词汇（妖怪可用，'生物''伪装'不许）
      beats:
        - 悟空喝道"妖怪"，举棒便打；女子留下假尸，真身化风逃走。
        - 唐僧大怒，说悟空无故伤人性命；八戒在旁添油加醋，说师兄是使障眼法。
        - 二次妖精变作寻女的老妇，悟空又打，唐僧念起紧箍咒，疼得悟空满地滚。
        - 三次变作老翁，悟空唤来土地山神在半空作证，一棒打死，白骨现形，脊梁上刻着"白骨夫人"。
        - 唐僧仍不信，写下贬书，悟空拜了三拜，含泪回花果山。
      excerpt: |
        好大圣，念动咒语，叫当坊土地、本处山神道："这妖精三番来戏弄我师父，这一番却要打杀他。
        你与我在半空中作证，不许走了。"众神听令，谁敢不从，都在云端里照应。那大圣棍起处，
        打倒妖魔，才断绝了灵光。唐僧在马上又唬得战战兢兢，口不能言。
      divergence_note: |
        三次"变—打—被冤"必须是递进的：第一次师父只是责备，第二次动咒，第三次才写贬书。
        若一次就赶走悟空，冲突的层次就没了。
      alternatives:
        - stance: 悟空第三次不打死妖精，而是把它押到唐僧面前现形（让师父自己看见）
          why_valid: 原著里他是打死后才现出白骨；改成押来现形，同样是'证明自己没滥杀'，人物目标一致。
          beats:
            - 悟空唤来土地山神，把妖精定在原地
            - 他把唐僧请到跟前，让妖精当场现出白骨原形
            - 唐僧见了，半天说不出话
            - 八戒还想说什么，被沙僧拉住
