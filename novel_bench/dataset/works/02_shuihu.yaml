id: shuihu
title: 水浒传
title_en: Water Margin
author: 施耐庵
year: "1600"
country: 中国
language: zh
category: 古典
medium: 出版
genres: [侠义, 群像, 冒险, 悲剧]
representativeness: |
  中国白话长篇的开山之作。写"逼上梁山"的链式因果，一个人如何被一步步推到无路可走，
  以及一群草莽如何排座次、讲义气。它的群戏与动作场面是武侠、黑帮、群像叙事的共同祖本。
license: public_domain
bible:
  worldview: |
    北宋末年，官场贪墨，豪强横行，江湖上讲的是"义气"二字，官府讲的是"拿人"。
    好汉们各有来路：军汉、教头、吏员、渔户、店家。一旦犯了事，轻则刺配，
    重则落草。梁山泊八百里水泊，是最后一条退路，进去的人都要交"投名状"。
    银子、酒、刀，是这个世界最硬的三种东西。
  rules:
    - 没有法术，没有内力。武艺都有出处，力气有上限，一个人打不过十个。
    - 官府办事讲程序：文书、押解、刺配、验尸，一步不能省。
    - 好汉说话粗直，但各有各的腔口；不许人人都是一副"洒家"口气。
    - 这一场只写眼前这一顿酒、这一条路，不许用"按下不表"跳到别处。
  places:
    - 名称: 景阳冈·山脚酒店
      说明: 冈下唯一一家酒铺，挂着"三碗不过冈"的招旗
      方位: 阳谷县往西二十里
      内里: [店堂, 灶间, 后院, 冈口]
    - 名称: 景阳冈·乱树林
      说明: 冈上一片乱树林，有块大青石，日落之后没人敢走
      方位: 景阳冈半山
    - 名称: 黄泥冈
      说明: 岗上无树无水的土冈，日头毒，是押货必歇之处
      方位: 济州往东京的官道旁
    - 名称: 梁山泊·聚义厅
      说明: 山上议事的地方，座次分明
      方位: 八百里水泊中央
  people:
    - 姓名: 武松
      身份: 清河县人氏，在柴进庄上避过祸，正要回阳谷县寻兄
      性格: 吃软不吃硬，最受不了人激；喝醉了更不肯认输；对兄长极孝
      口癖: 自称"我"，急了说"你道我敢不敢"
      秘密: 身上没钱，回家一半是为投奔兄长
      目标: 找到哥哥武大，安身立命
      红线: 谁提"景阳冈有虎"他就偏要走
    - 姓名: 店主人
      身份: 景阳冈下酒店掌柜
      性格: 精明胆小，做的是过路生意，最怕出人命
      口癖: 一句一个"客官"
      秘密: 冈上确实死了人，他报过官，没人管
      目标: 别让客人死在自家店门口
      红线: 酒可以赊，话不能不说
    - 姓名: 杨志
      身份: 杨家将后人，现任殿司制使，押送生辰纲
      性格: 谨慎多疑，急躁时打人；一心想靠这趟差事复职
      口癖: 说话带"在下"
      秘密: 先前押花石纲失了官，这趟再失就再无出头之日
      目标: 把十万贯金珠平安送到东京
      红线: 绝不许手下人碰酒
    - 姓名: 吴用
      身份: 东溪村教书先生，绰号"智多星"
      性格: 慢条斯理，算计极深，从不亲自动手
      口癖: 说话爱绕一个弯子，末了才点破
      秘密: 早已与晁盖定下劫生辰纲的计
      目标: 不伤人命地把货取走
      红线: 计策不能被自己人先说破
    - 姓名: 晁盖
      身份: 东溪村保正，一方富户
      性格: 仗义疏财，粗中有细，肯担事
      口癖: 常说"兄弟"
      秘密: 已把庄上壮丁编了队，只等动手
      目标: 取这不义之财，分给弟兄
      红线: 不许伤押送军汉的性命
  relations:
    - 甲: '吴用'
      乙: '晁盖'
      关系: '多年至交，一动一静，计出自吴用，事由晁盖担'
    - 甲: '杨志'
      乙: '吴用'
      关系: '猎人与猎物，互相不知道对方是谁'
    - 甲: '武松'
      乙: '店主人'
      关系: '过客与店家，一个要劝，一个不听'
  foreshadows:
    - 编号: 'F1'
      内容: '武松的哨棒，一路上不离手，断在景阳冈上'
    - 编号: 'F2'
      内容: '杨志脸上有一块青记，日后梁山认人靠它'
    - 编号: 'F3'
      内容: '白胜挑的两桶酒，一桶好酒一桶下了药'
  details:
    - 名称: '三碗不过冈'
      说明: '酒店招旗上的字，说这酒喝三碗就过不去冈'
    - 名称: '生辰纲'
      说明: '梁中书送给蔡京的十万贯金珠宝贝，分作十一担'
    - 名称: '哨棒'
      说明: '武松随身的一根木棒，防身用'
  style:
    pov: 第三人称限知
    era: premodern
    sentence: 句子短，动作密，一段里连着几个"便""只""却"
    diction: 宋元白话，多用市井语与兵器名，少比喻
    dialogue: 高，冲突全靠对话与动作推进
    taboos: [手机, 电话, 咖啡, 分钟, 情绪, 状态, 压力, 气氛, 镜头]
cases:
  - id: shz-01
    cut: 转折
    at: 第二十三回 景阳冈武松打虎（上冈之前）
    story_time: "傍晚"
    place: 景阳冈·山脚酒店
    present: [武松, 店主人]
    focus: [动作段, 节奏, 人物脾气]
    previously: |
      武松在柴进庄上住了一年多，病好之后要回清河县找哥哥武大。路过阳谷县，进了景阳冈下这家酒店，
      前后喝了十八碗"透瓶香"，又要添酒。店主人说三碗不过冈，冈上有虎，日落之后结伴才敢过。
      武松只当是店家吓人，起身提了哨棒就走。
    scene_seed: |
      武松把哨棒往肩上一担，脚已经跨出门槛。店主人追出来两步，还在喊。
      日头已经压到冈子后头，路上一个人也没有。
    ground_truth:
      hard:
        - 不许让武松一开始就相信冈上有虎（他是见了官府榜文才信的）
        - 不许用现代词汇（野生动物/保护区/麻醉 一律不许）
        - 不许让老虎像人一样思考或用计
        - 不许写成武松一招制胜（必须写成苦战）
      beats:
        - 武松不听劝，独自上冈；走了一程看见庙门上贴的官府榜文，才信真有虎。
        - 他想回头，又怕店家笑话，硬着头皮继续走；酒力上来，浑身燥热，把毡笠掀在脊梁上。
        - 走到乱树林，见一块大青石，把哨棒倚了，倒身要睡。
        - 一阵狂风过后，吊睛白额大虫从树后跳出，先是一扑，再是一掀，又是一剪。
        - 武松三次闪开，哨棒打在枯树上折断；只得赤手按住虎头，用脚乱踢，打到七窍流血。
        - 下冈时遇上猎户，众人抬虎回阳谷县，知县赏钱，武松做了都头。
      excerpt: |
        那一阵风过处，只听得乱树背后扑地一声响，跳出一只吊睛白额大虫来。武松见了，叫声"呵呀"，
        从青石上翻将下来，便拿那条哨棒在手里，闪在青石边。那大虫又饥又渴，把两只爪在地下略按一按，
        和身望上一扑，从半空里撺将下来。武松被那一惊，酒都做冷汗出了。说时迟，那时快，
        武松见大虫扑来，只一闪，闪在大虫背后。
      divergence_note: |
        不必复刻原文的招式名，但"先不信、见了榜文才怕、怕了又不肯回头"这条心理链要写出来；
        打虎要写成一扑一掀一剪三次落空，不能一拳打死。
      alternatives:
        - stance: 武松见榜文后转身回店，第二天结伴过冈（把'硬气'写成'认理'）
          why_valid: 原著里他确实犹豫过、也怕人笑话；让他真的折返，是对同一性格的另一条演绎，不违背任何设定。
          beats:
            - 武松在庙门前读完榜文，站了很久
            - 他往回走了几步，又停下，最后还是回了酒店
            - 店主人见他回来，没有取笑，只给他添了酒
            - 第二天他与一伙客商结伴过冈，老虎照样出现
  - id: shz-02
    cut: 高潮前
    at: 第十六回 杨志押送金银担 吴用智取生辰纲
    story_time: "正午"
    place: 黄泥冈
    present: [杨志, 吴用, 晁盖, 店主人]
    focus: [群像, 计谋, 信息边界]
    previously: |
      梁中书备下十万贯金珠，差杨志押送东京，扮作客商，不许走漏消息。杨志一路上催得极紧，
      天热也不许歇，军汉们怨声载道。到了黄泥冈，众人实在走不动，扔下担子躺在树荫里。
      晁盖、吴用等七人扮作贩枣客人，早一步在冈上歇着；白胜挑着两桶酒，从冈下上来。
    scene_seed: |
      杨志提着朴刀喝骂，军汉们只是不动。那边七个枣客凑钱买酒，白胜放下担子，揭开桶盖，
      酒气一下子散开。军汉们吞口水的声音都听得见。
    ground_truth:
      hard:
        - 不许让杨志一开始就同意买酒（他必须先立起'谨慎'）
        - 不许让晁盖一方有人露出破绽被识破
        - 不许用现代词汇（麻醉药/迷药 可用，'药物''成分'不许）
        - 不许让军汉们主动抢酒喝（必须是求杨志允许）
      beats:
        - 杨志先不许买，说"多少好汉被蒙汗药麻翻了"，枣客们先买一桶，当众喝干，杨志才松口。
        - 第二桶也卖，枣客借瓢来舀，另一人从桶里舀一瓢倒回，实际下了药。
        - 军汉们买酒，杨志也喝了两口；枣客又送枣子下酒。
        - 不多时众人头晕眼花，一个个倒地；杨志挣扎不起，眼睁睁看着金珠被装上车推走。
        - 杨志醒来，自知无路，后来上了二龙山。
      excerpt: |
        只见这十五个人头重脚轻，一个个面面厮觑，都软倒了。那七个客人从松树林里推出这七辆江州车儿，
        把车子上的枣子丢在地上，将这十一担金珠宝贝都装在车子内，遮盖好了，叫声"聒噪"，
        一直望黄泥冈下推去了。杨志口里只是叫苦，软了身体，挣扎不起。
      divergence_note: |
        计谋的每一步都要让读者看见过程（谁舀的酒、瓢怎么转手），不许用"如此这般"一句带过；
        杨志的谨慎必须先立起来，才谈得上被骗。
      alternatives:
        - stance: 杨志到最后也没喝，只因手下全倒了才失手（他的谨慎贯彻到底）
          why_valid: 原著里杨志确实喝了半瓢，但让他始终坚持不喝、却因手下尽倒而无法押送，同样成立，且更突出他'再谨慎也架不住人心'的处境。
          beats:
            - 杨志始终不许买酒，自己也不喝，只在一旁看着
            - 枣客当众喝干一桶，军汉们越看越熬不住，跪下求他
            - 杨志松口让军汉买，自己一口未沾
            - 不多时军汉尽倒，他提刀要拼命，却连站都站不稳
