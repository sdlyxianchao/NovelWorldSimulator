cases:
  - id: cien-01
    cut: 开篇
    at: 第一章 吉普赛人带来冰块
    story_time: "下午"
    place: 马孔多·吉普赛人帐篷
    present: [何塞·阿尔卡蒂奥·布恩迪亚, 乌尔苏拉, 梅尔基亚德斯, 奥雷里亚诺]
    focus: [开篇建置, 叙述语调, 魔幻现实]
    previously: ""
    scene_seed: |
      帐篷门口收钱的人掀开帆布。何塞·阿尔卡蒂奥·布恩迪亚带着两个孩子走进去，
      看见台子上放着一只木箱，箱盖开着，里面冒白气。
      梅尔基亚德斯站在箱边，一只手按在箱沿上。
    ground_truth:
      hard:
        - 不许用'神奇''不可思议'一类惊叹词（语气必须平）
        - 不许让叙述者解释冰块的原理
        - 不许让乌尔苏拉相信这是奇迹
        - 不许出现现代科学名词（凝固点/制冷 不许）
      beats:
        - 梅尔基亚德斯说这是"世界上最大的钻石"，收十雷亚尔让人摸一次。
        - 布恩迪亚摸了摸，缩回手，说"它在烧"；又摸，付了钱再摸。
        - 他忘了自己是来带路找海口的，宣布要买下这块冰，用来盖冰厂。
        - 乌尔苏拉在帐篷外等得不耐烦，说他"又疯了"，拽着孩子要走。
        - 奥雷里亚诺站在原地不动，伸手碰了冰，觉得像被火烫了一下。
      excerpt: |
        何塞·阿尔卡蒂奥·布恩迪亚把手按在冰块上，又缩回来。"它在烧。"他说。
        他又付了十雷亚尔，把手放上去，像是要把这个奇迹记在手心里。
        "这是我们这个时代最伟大的发明。"他宣布。
        乌尔苏拉在帐篷外面喊他，说他又疯了。
      divergence_note: |
        不许用"奇异""神秘""不可思议"这类词。冰块要写得像一件普通的商品，
        它的奇迹感全靠人物的反应撑起来——这就是魔幻现实的全部秘密。
      alternatives:
        - stance: 布恩迪亚不买冰，而是把吉普赛人请回家，要他们教他做冰
          why_valid: 他的性格是'为了一个念头能毁掉全家'；把奇迹搬回家研究，比买一块更符合他。
          beats:
            - 布恩迪亚问梅尔基亚德斯，这东西怎么做出来
            - 梅尔基亚德斯说做不出来，只能从远方运来
            - 布恩迪亚说那我去运
            - 乌尔苏拉在门口听见，转身就走
