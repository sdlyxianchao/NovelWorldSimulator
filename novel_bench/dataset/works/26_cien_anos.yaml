id: cien_anos
title: 百年孤独
title_en: One Hundred Years of Solitude
author: 加西亚·马尔克斯
year: "1967"
country: 哥伦比亚
language: es
category: 现代
medium: 出版
genres: [魔幻现实, 家族, 史诗, 长篇]
representativeness: |
  拉美魔幻现实主义的代表作，也是"叙述语调"的极限样本：荒诞的事用最平静的语气说出来，
  读者于是相信。它检验的是"语气统一"——一旦叙述者开始大惊小怪，魔幻就变成了奇幻。
license: in_copyright_short_quote
bible:
  worldview: |
    马孔多，一个由何塞·阿尔卡蒂奥·布恩迪亚带着二十几户人家建立的村子。
    吉普赛人每年三月来，带来磁铁、放大镜、冰块这些"新发明"。
    布恩迪亚家族的人名字反复重复：何塞·阿尔卡蒂奥、奥雷里亚诺、阿玛兰妲、乌尔苏拉。
    这里的雨可以下四年十一个月零两天，死人会回来，飞毯真的能飞。
    但叙述者从不大惊小怪。
  rules:
    - 魔幻的事要用最平常的语气讲，不许惊叹、不许解释。
    - 家族人名重复使用，辈分要能对上。
    - 时间常打乱，但每一句内部必须清楚。
    - 这一场只写吉普赛人帐篷里这一小段时间。
  places:
    - 名称: 马孔多·吉普赛人帐篷
      说明: 帆布搭的大帐，里面摆满稀奇东西，收钱才让看
      方位: 马孔多村外空地
      内里: [帐篷, 展台, 冰块箱, 出口]
    - 名称: 布恩迪亚家·实验室
      说明: 一间小屋，摆着炼金炉与试管
      方位: 马孔多村内
    - 名称: 马孔多·广场
      说明: 村子中心，后来建了教堂
      方位: 马孔多
  people:
    - 姓名: 何塞·阿尔卡蒂奥·布恩迪亚
      身份: 马孔多的建立者，布恩迪亚家族第一代
      性格: 狂热，好奇，为了一个念头能毁掉全家
      口癖: 说话像在宣布真理
      秘密: 他一直在找一条通往外界的路
      目标: 见识世上一切奇妙的东西
      红线: 不许人说他疯了
    - 姓名: 乌尔苏拉
      身份: 布恩迪亚的妻子
      性格: 务实，强硬，撑起整个家
      口癖: 说话直，爱说"活见鬼"
      秘密: 她靠做小生意攒下了家底
      目标: 让这个家传下去
      红线: 不许人动她的孩子
    - 姓名: 梅尔基亚德斯
      身份: 吉普赛人首领，带来各种发明
      性格: 神秘，热情，像个先知
      口癖: 说话带预言口气
      秘密: 他写下的羊皮纸预言了整个家族的命运
      目标: 把知识带给马孔多
      红线: 不许人碰他的羊皮纸
    - 姓名: 奥雷里亚诺
      身份: 布恩迪亚的次子，沉默寡言
      性格: 孤僻，有预知能力，日后成为上校
      口癖: 几乎不说话
      秘密: 他从小就能预感事情
      目标: 跟着父亲看世界
      红线: 不许人碰他的小金鱼
  relations:
    - 甲: 何塞·阿尔卡蒂奥·布恩迪亚
      乙: 乌尔苏拉
      关系: 夫妻，一个疯一个撑
    - 甲: 梅尔基亚德斯
      乙: 何塞·阿尔卡蒂奥·布恩迪亚
      关系: 带来奇迹的人与被奇迹迷住的人
    - 甲: 奥雷里亚诺
      乙: 何塞·阿尔卡蒂奥·布恩迪亚
      关系: 父子，一个沉默一个狂热
  foreshadows:
