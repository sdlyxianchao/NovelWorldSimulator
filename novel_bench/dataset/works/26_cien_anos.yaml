    - 名称: 磁铁
      说明: 吉普赛人带来的铁石，能吸起锅碗
    - 名称: 羊皮纸
      说明: 写满梵文的旧纸，梅尔基亚德斯随身带着
  style:
    pov: 第三人称全知
    era: historical
    sentence: 长句，从句层叠，语气平缓得像在念账本
    diction: 拉美小说的中文译笔：具体、郑重、不惊叹
    dialogue: 中，对话短，常被叙述打断
