id: zhifou
title: 知否知否应是绿肥红瘦
title_en: The Story of Minglan
author: 关心则乱
year: "2012"
country: 中国
language: zh
category: 网络
medium: 网络
genres: [古代言情, 宅斗, 家庭, 长篇]
representativeness: |
  网络古代宅斗的开创性作品之一。全书的冲突不在刀剑，而在一句闲话、一份份例、
  一次请安里。它很适合检验推演系统能否维持"低烈度、高密度"的日常冲突，
  而不是每隔三句就安排一次生死危机。
license: in_copyright_short_quote
bible:
  worldview: |
    北宋官宦人家盛家，老爷盛紘官居五品，家中有正妻王氏、妾室林小娘，
    以及几个庶出嫡出的儿女。盛老太太是盛紘的嫡母，住在寿安堂，不管家事多年。
    规矩大：晨昏定省、份例月钱、嫡庶尊卑，一样都不能错。
    盛明兰是庶出 sixth 姑娘，生母早亡，被老太太收养。
  rules:
    - 没有武功，没有超自然。所有胜负都在礼数、话术、人情里分。
    - 称谓严格：老太太、太太、小娘、姑娘、哥儿，不可混。
    - 明兰表面憨钝，心里明白；不许把她写成爽文女主，当场打脸。
    - 这一场只写寿安堂里这一盏茶的工夫。
  places:
    - 名称: 盛家·寿安堂
      说明: 老太太的院子，清静，佛堂里常年点香
      方位: 盛家东路
      内里: [正屋, 佛堂, 廊下, 小书房]
    - 名称: 盛家·正院
      说明: 王氏住的院子，人来人往，账房在侧
      方位: 盛家中路
    - 名称: 盛家·后花园
      说明: 姑娘们常在这里玩，也是消息传得最快的地方
      方位: 盛家后院
  people:
    - 姓名: 盛明兰
      别称: [明兰, 六姑娘, 明丫头]
      身份: 盛家六姑娘，庶出，养在老太太名下
      性格: 外表温吞，心里极清楚；惯会装傻，从不争先
      口癖: 说话慢，爱说"我不知道呀"
      秘密: 她是穿越来的，早知道这家里谁靠不住
      目标: 平平安安长大，不给祖母添麻烦
      红线: 不许人算计到老太太头上
    - 姓名: 盛老太太
      别称: [老太太, 祖母]
      身份: 盛紘的嫡母，盛家辈分最高的人
      性格: 慈和里有锋芒，看得透，懒得多说
      口癖: 叫明兰"明丫头"
      秘密: 当年也是从宅斗里活下来的
      目标: 把这个孙女教成能自保的人
      红线: 不许谁在她院里立规矩
    - 姓名: 盛墨兰
      别称: [墨兰, 四姑娘]
      身份: 盛家四姑娘，林小娘所出
      性格: 好强，爱出风头，受了委屈立刻哭
      口癖: 爱说"我也是父亲的女儿"
      秘密: 她母亲教她争，她其实是怕
      目标: 嫁得比谁都好
      红线: 不许人提她是庶出
    - 姓名: 盛如兰
      别称: [如兰, 五姑娘]
      身份: 盛家五姑娘，王氏所出，嫡女
      性格: 直，娇，嘴上不饶人，心里没坏水
      口癖: 说话大声，爱说"凭什么"
      秘密: 她知道母亲偏心，也知道自己不如姐姐会来事
      目标: 不受气
      红线: 不许人抢她的东西
    - 姓名: 林小娘
      别称: [林小娘, 小娘]
      身份: 盛紘的妾室，墨兰的生母
      性格: 柔声细语，最会在老爷面前示弱
      口癖: 一句一个"老爷"
      秘密: 手上管着一部分公中的银子
      目标: 让女儿压过嫡女
      红线: 不许人查她的账
  relations:
    - 甲: '盛明兰'
      乙: '盛老太太'
      关系: '祖孙，一个教一个学，最亲'
    - 甲: '盛墨兰'
      乙: '盛如兰'
      关系: '庶嫡之争，见面就掐'
    - 甲: '林小娘'
      乙: '盛墨兰'
      关系: '母女，一个教争一个学争'
  foreshadows:
    - 编号: 'F1'
      内容: '老太太说"藏拙"，这两个字明兰记了一辈子'
    - 编号: 'F2'
      内容: '林小娘管的那些银子，日后是盛家的一场大乱'
    - 编号: 'F3'
      内容: '明兰腕上那只旧镯子，是她生母留下的'
  details:
    - 名称: '份例'
      说明: '各房按月领的银钱衣料，多少有定数'
    - 名称: '晨昏定省'
      说明: '晚辈每日早晚到长辈跟前问安'
    - 名称: '缠足'
      说明: '当时的习俗，姑娘们比脚'
  style:
    pov: 第三人称限知
    era: premodern
    sentence: 中长句，叙事从容，对话夹叙夹议
    diction: 明清白话味的现代文，称谓讲究
    dialogue: 高，全靠话里有话
    taboos: [手机, 电话, 咖啡, 分钟, 情绪, 状态, 压力, 心理阴影]
cases:
  - id: zf-01
    cut: 中段
    at: 寿安堂里，墨兰与如兰为一只镯子起了争执
    story_time: "上午"
    place: 盛家·寿安堂
    present: [盛明兰, 盛老太太, 盛墨兰, 盛如兰]
    focus: [话里有话, 人物区分, 日常冲突]
    previously: |
      明兰刚被老太太收养不久，在寿安堂里学着规矩。这天墨兰与如兰来给老太太请安，
      如兰腕上戴着一只新打的赤金镯子，墨兰看了几眼，说这镯子的样式是自己先看中的。
      两人你一句我一句，声音渐渐高起来。
    scene_seed: |
      老太太靠在榻上闭着眼，手里的佛珠没停。明兰坐在下首绣一只荷包，
      针脚歪了一处。墨兰的眼圈已经红了，如兰把袖子一捋，把镯子亮出来。
    ground_truth:
      hard:
        - 不许让明兰当场驳倒墨兰
        - 不许让老太太当众责骂林小娘
        - 不许出现现代词（原生家庭/边界感 不许）
        - 不许让如兰说出有分寸的话（她嘴直）
      beats:
        - 如兰说"这是母亲给我打的"，墨兰说"前儿我还跟太太提过这个花样"。
        - 两人都要老太太评理；老太太不睁眼，只问明兰"你说呢"。
        - 明兰装作不懂，说"这镯子好看，给四姐姐戴也好看"，把话头推回去。
        - 墨兰得意，如兰气得跺脚；老太太这才开口，罚墨兰抄《女戒》十遍。
        - 事后老太太对明兰说：你今天这句"我不知道"，比十句明白话都管用。
      excerpt: |
        老太太睁开眼，看了看明兰，说："你说呢？"明兰低头道："我不知道呀。"
        老太太笑了一声，对墨兰道："你去把那十遍抄了。"墨兰脸涨得通红，
        一句话也不敢辩。出了院子，如兰拉着明兰的手，说："你倒是会躲。"
      divergence_note: |
        明兰绝不能赢在嘴上。她的本事是让别人去争、自己退半步；
        若写成她伶牙俐齿地把墨兰驳倒，这个人物就毁了。
      alternatives:
        - stance: 明兰不装不懂，而是把自己那只旧镯子递出去（用物挡事）
          why_valid: 她的本事是'退半步'，但退法可以不止装傻；拿自己的东西平事，同样是退，且更显她的处境。
          beats:
            - 墨兰与如兰争得面红，明兰把自己的旧镯子褪下来
            - 她说这镯子给四姐姐，样式旧，别嫌弃
            - 墨兰一时接不下去，如兰也不好再争
            - 老太太睁眼看了明兰一眼，没说话
