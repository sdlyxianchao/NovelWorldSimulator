id: pride_prejudice
title: 傲慢与偏见
title_en: Pride and Prejudice
author: 简·奥斯汀
year: "1813"
country: 英国
language: en
category: 古典
medium: 出版
genres: [世情, 婚恋, 讽刺, 长篇]
representativeness: |
  英语小说里"客厅喜剧"的原型。全书几乎没有外部事件，全靠舞会、拜访、信件和闲话推动，
  人物的愚蠢与体面同时成立。它是检验"低事件密度下对话能不能扛住"的最佳样本之一。
license: public_domain
bible:
  worldview: |
    英格兰乡郡，十九世纪初。乡绅家庭的女儿没有继承权，嫁人是唯一的出路。
    班纳特家有五个女儿，母亲最大的心事是把她们嫁出去。附近的内瑟菲德庄园
    新搬来一位有钱的单身青年彬格莱，舞会是乡间社交的全部舞台。
    体面、年收入、亲戚的职业，都能决定一桩婚事的成败。
  rules:
    - 没有巧合与奇迹。所有误会都由性格与信息差造成。
    - 语言必须体面：再刻薄的话也要裹在礼貌里。
    - 伊丽莎白机敏爱笑，达西寡言傲慢，班纳特太太聒噪短视。
    - 这一场只写舞厅里这一支舞的工夫，不许跳到几周后。
  places:
    - 名称: 麦里屯·公共舞厅
      说明: 乡间舞会租的厅，灯烛通明，两侧有牌桌
      方位: 麦里屯镇上
      内里: [舞池, 牌桌, 休息室, 门厅]
    - 名称: 内瑟菲德庄园
      说明: 彬格莱租下的宅子，有长廊与书房
      方位: 浪搏恩村附近
    - 名称: 浪搏恩·班纳特家
      说明: 乡绅住宅，起居室不大，母亲的声音传得远
      方位: 浪搏恩村
  people:
    - 姓名: 伊丽莎白
      身份: 班纳特家二女儿
      性格: 机敏，爱笑，看人准而自信；受了轻慢一定记住
      口癖: 说话带俏皮的转折，爱用反话
      秘密: 她并不像自己以为的那样公正
      目标: 嫁一个她真正敬重的人
      红线: 不许人拿她家的亲戚取笑
    - 姓名: 达西
      身份: 彭伯里庄园的主人，年入一万镑
      性格: 寡言，骄傲，不善交际；一旦认定便极固执
      口癖: 说话短，常用"我不认为"
      秘密: 他在舞会上确实看了伊丽莎白很久
      目标: 维持家族体面
      红线: 不许人提他父亲的旧事
    - 姓名: 彬格莱
      身份: 达西的挚友，内瑟菲德的新主人
      性格: 温和，易受影响，真心喜欢简
      口癖: 爱说"再好不过了"
      秘密: 他知道达西看不起这门亲事
      目标: 娶简
      红线: 不与朋友反目
    - 姓名: 班纳特太太
      身份: 班纳特家的女主人
      性格: 聒噪，短视，一心嫁女儿；不觉得自己失礼
      口癖: 爱说"我早说过了"
      秘密: 家里没有儿子，产业要传给远亲
      目标: 把五个女儿都嫁出去
      红线: 不许人说她女儿不好看
  relations:
    - 甲: 伊丽莎白
      乙: 达西
      关系: 初见他拒绝与她跳舞，她从此把他归为最讨厌的人
    - 甲: 彬格莱
      乙: 达西
      关系: 挚友，一个随和一个固执
    - 甲: 班纳特太太
      乙: 伊丽莎白
      关系: 母女，母亲的心思女儿最受不了
  foreshadows:
    - 编号: F1
      内容: 达西那句"她还可以，但还没到让我动心的地步"，伊丽莎白听得一字不落
    - 编号: F2
      内容: 彬格莱与简跳了两支舞，达西说"你该收敛些"
    - 编号: F3
      内容: 班纳特家没有男嗣，产业将由柯林斯继承
  details:
    - 名称: 一支舞
      说明: 乡间舞会的一支舞约半小时，连着跳两支便是失礼的示好
    - 名称: 年入一万镑
      说明: 衡量乡绅身价的说法，达西的数目令人侧目
    - 名称: 马车
      说明: 家有马车是体面的一部分，班纳特家只有一辆
  style:
    pov: 第三人称限知
    era: premodern
    sentence: 长句，从句套从句，反讽藏在形容词的选择里
    diction: 十九世纪英国乡绅英语的中文对应：礼貌、克制、少形容词
    dialogue: 很高，几乎全靠对话
    taboos: [手机, 电话, 咖啡, 分钟, 情绪, 状态, 压力, 心理分析]
cases:
  - id: pp-01
    cut: 开篇
    at: 第一卷 内瑟菲德舞会，伊丽莎白与达西初次相遇
    story_time: "晚上"
    place: 麦里屯·公共舞厅
    present: [伊丽莎白, 达西, 彬格莱, 班纳特太太]
    focus: [开篇建置, 对话机锋, 第一印象]
    previously: ""
    scene_seed: |
      舞厅里人已经满了。彬格莱一进门就请简跳舞，达西站在墙边，抱着手臂，
      一晚上只跳了两支。伊丽莎白坐在近处，听见彬格莱劝他请人跳舞，
      也听见他回答的那句话。
    ground_truth:
      hard:
        - 不许让伊丽莎白当场反驳达西（她只是记住了这句话）
        - 不许让达西主动示好
        - 不许用现代口语（社交/高冷/心动 不许）
        - 不许让班纳特太太意识到自己失礼
      beats:
        - 达西说"她还可以，但还没到让我动心的地步"，伊丽莎白听得清楚，笑了一声。
        - 她转身把这话当笑话讲给夏洛特听，说"他倒有资格挑剔"。
        - 达西听见她笑，回头看了她一眼，第一次觉得这张脸有种说不出的机灵。
        - 班纳特太太在旁高声议论达西的财产与傲慢，伊丽莎白替母亲脸红。
        - 舞会散场，彬格莱说简"是这屋里最漂亮的姑娘"，达西不置可否。
      excerpt: |
        "她还可以，但还没到让我动心的地步。"达西说。伊丽莎白听了，并不生气，
        反倒把这话当笑话讲给旁人听。她性情活泼，凡事爱开玩笑，
        这一晚她便拿这位先生取乐了好几回。
      divergence_note: |
        不要写成两人一见倾心。这一场的任务是让"偏见"成立：
        读者必须相信伊丽莎白为什么讨厌他，也必须看见达西那一瞬的动心。
      alternatives:
        - stance: 伊丽莎白把达西那句话转述给夏洛特，两人一起取笑（不当面顶）
          why_valid: 她的机敏更多是背后说笑；当面顶撞反而不合当时的礼节。
          beats:
            - 达西说完那句，伊丽莎白不动声色
            - 她走到夏洛特身边，低声把话学了一遍
            - 两人笑了一阵，夏洛特说'他倒有资格挑剔'
            - 达西远远看见她们笑，不明所以
