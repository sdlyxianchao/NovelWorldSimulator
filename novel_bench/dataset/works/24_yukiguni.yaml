id: yukiguni
title: 雪国
title_en: Snow Country
author: 川端康成
year: "1948"
country: 日本
language: ja
category: 现代
medium: 出版
genres: [抒情, 爱情, 中篇, 唯美]
representativeness: |
  日本近代文学的顶点之一，也是"以景写情"的极端样本：整本书几乎没有情节，
  全靠雪、镜、火、声音与一句话之间的空白。用它来测，是因为 AI 写作最容易在"无事发生"时
  堆砌形容词——而川端的写法恰恰相反。
license: in_copyright_short_quote
bible:
  worldview: |
    日本越后汤泽的温泉旅馆。岛村是从东京来的客人，靠祖产过活，研究舞蹈，也无所事事。
    驹子是这里的艺伎，十九岁上下，学过三味线，性子烈；叶子是另一个姑娘，声音清亮，
    在厨房帮忙，照顾一个生病的年轻人。冬天雪深及膝，火车穿过长长的隧道进入雪国，
    车窗上映出人的脸。这里的人不把心事说破。
  rules:
    - 几乎不写情节，只写物与声音；情绪藏在景的后面。
    - 句子要短，意象要干净：雪、镜、火、皮肤、隧道。
    - 驹子说话快而急，岛村说话慢而含混。
    - 这一场只写夜里这一间屋子，不许切到东京。
  places:
    - 名称: 温泉旅馆·岛村的房间
      说明: 榻榻米房，纸门，窗外是雪
      方位: 越后汤泽
      内里: [榻榻米, 火钵, 纸门, 窗]
    - 名称: 温泉旅馆·浴室
      说明: 木桶，热气，镜子蒙着雾
      方位: 旅馆后侧
    - 名称: 雪国·车站
      说明: 一个小站，冬天只有雪与灯
      方位: 越后汤泽
  people:
    - 姓名: 岛村
      身份: 东京来的客人，靠家产生活
      性格: 疏懒，敏感，习惯把别人当作风景来看
      口癖: 说话含混，常用"是啊"
      秘密: 他已婚，且并不打算为驹子做任何事
      目标: 在这里消磨几天
      红线: 不许人逼他承诺
    - 姓名: 驹子
      身份: 温泉旅馆的艺伎
      性格: 直，急，爱笑也爱恼；读过些书，记日记
      口癖: 说话快，爱说"你这个人哪"
      秘密: 她靠当艺伎供一个病人吃药
      目标: 活得像个正经人
      红线: 不许人可怜她
    - 姓名: 叶子
      身份: 旅馆帮工的姑娘
      性格: 安静，声音清亮，几乎不与人来往
      口癖: 说话像唱歌，只叫"先生"
      秘密: 她照顾的那个病人，是她心上人
      目标: 守着那个人
      红线: 不许人打扰病人
  relations:
    - 甲: 岛村
      乙: 驹子
      关系: 客人与艺伎，她认真，他敷衍
    - 甲: 驹子
      乙: 叶子
      关系: 同乡，彼此心里都有数，却很少说话
    - 甲: 岛村
      乙: 叶子
      关系: 只听过她的声音，没见过几次面
  foreshadows:
    - 编号: F1
      内容: 火车车窗上映出的那张脸，岛村看了很久
    - 编号: F2
      内容: 驹子的日记，记的都是琐事，却一本本留着
    - 编号: F3
      内容: 叶子清亮的声音，日后在火里响起
  details:
    - 名称: 火钵
      说明: 榻榻米上的炭火盆，冬天不离人
    - 名称: 三味线
      说明: 驹子练的乐器，琴箱旧了
    - 名称: 雪
      说明: 越后的雪能积到一人高，早上要挖路
  style:
    pov: 第三人称限知
    era: modern
    sentence: 短句，句与句之间留白，少用连词
    diction: 清淡的现代汉语，意象具体，不堆形容词
    dialogue: 中，对话常常答非所问
    taboos: [手机, 电话, 咖啡, 分钟, 情绪, 状态, 压力, 氛围感]
    # ★ 这本书实测出来的写法约束（2026-10-21 真跑）：只对《雪国》生效。
    notes:
      - >-
        岛村的沉默不许只有两种形态（整章只有「不说话」和「嗯」）；
        每次沉默给一样**具体的东西**：一个身体动作、一处他注意到却没说出口的细节、或者他想起的旧事。
      - >-
        雪、火钵、酒、发丝这类物象，出现之后**必须有人接**：
        它要改变某个人的情绪或行动（她因此停下、他因此开口、谁因此换了坐姿），
        不许只作为环境音出现过就算。
cases:
  - id: ykg-01
    cut: 中段
    at: 驹子醉后夜里来到岛村的房间
    story_time: "深夜"
    place: 温泉旅馆·岛村的房间
    present: [岛村, 驹子, 叶子]
    focus: [留白, 意象, 情感克制]
    previously: |
      岛村第二次来雪国，驹子已经做了艺伎。这一夜她陪客喝了酒，
      醉得厉害，却还是跑到岛村的房间来。她把纸门拉开一半，
      雪光一下子照进来。
    scene_seed: |
      驹子伏在火钵边上，头发散了，脸上还带着酒气。她抬头看他，
      忽然说了一句什么，声音很轻，被窗外的雪吸掉了。走廊上传来脚步声。
    ground_truth:
      hard:
        - 不许让岛村明确说出自己的心意（他只是'看着'，不说破）
        - 不许让驹子哭诉身世或长篇自白（她的话总是半句）
        - 不许让叶子开口说成句的对话（她的声音只用来唤人、传话）
        - 不许写明确的心理分析（'他心里想''她感到'一类不许出现）
      beats:
        - 驹子说"你这个人哪"，又说"我是个好人吧"，自己先笑了。
        - 她起身去拿三味线，说很久没弹了，弹得不好；弹了两句就停下。
        - 叶子在门外叫了一声"驹子姐"，送进来一壶酒，低头退出去。
        - 驹子忽然安静，说"她恨我"，又笑着说"算了"。
        - 天快亮时她走了，纸门没关严，雪光一直照到岛村的枕边。
      excerpt: |
        "你这个人哪。"驹子说，声音很轻，像被雪吸掉了。
        她起身去拿三味线，弹了两句，停下来，说："很久没弹了。"
        走廊上有脚步声。叶子在门外叫了一声"驹子姐"。
        驹子忽然不说话了。天快亮的时候她走了，纸门没有关严。
      divergence_note: |
        不许写"她爱他"或"他不动心"。所有情绪都要落在手上、声音上、纸门的缝上。
        如果出现一句明确的心里话，这一篇的味道就散了。
      alternatives:
        - stance: 驹子弹三味线，用琴声代替那半句话
          why_valid: 原著里驹子本就学过三味线、也弹给岛村听过；让她把说不出口的话弹出来，比说出来更贴川端的写法，也不踩任何硬约束。
          beats:
            - 驹子起身去拿三味线，说手生了，弹得不好
            - 琴声起了两句就断，她笑着说不弹了
            - 岛村看着她的手停在弦上，没有说话
            - 雪光从纸门缝里照进来，落在琴箱上
        - stance: 叶子送酒进来，驹子把话咽回去，两人之间只交换一个眼神
          why_valid: 原文里叶子确实在旅馆帮工、也确实送过东西；用她的进出来打断驹子，是原著的手法之一，与设定完全相容。
          beats:
            - 驹子说到一半，走廊上有脚步声
            - 叶子在门外唤了一声，送进一壶酒，低头退出
            - 驹子不说话了，看着门的方向
            - 岛村把酒斟上，两人都没有再提方才那句话
