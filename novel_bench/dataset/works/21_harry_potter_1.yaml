id: harry_potter_1
title: 哈利·波特与魔法石
title_en: Harry Potter and the Philosopher's Stone
author: J. K. 罗琳
year: "1997"
country: 英国
language: en
category: 当代
medium: 出版
genres: [奇幻, 成长, 校园, 儿童文学]
representativeness: |
  当代最畅销的系列小说首卷，也是"世界构建"教学的常用范本：规则简单、边界清楚、
  每个细节后面都有用。它的对话节奏与"新人进入新世界"的信息释放方式，值得逐段拆解。
license: in_copyright_short_quote
bible:
  worldview: |
    十一岁的哈利·波特在麻瓜家庭长大，不知道自己是个巫师。霍格沃茨魔法学校有四所学院：
    格兰芬多、赫奇帕奇、拉文克劳、斯莱特林。分院帽会根据学生的品性把他们分进其中一所。
    魔法世界有规矩：未成年巫师不许在校外施法，学院积分决定年终的学院杯。
    血统在这里是敏感话题，斯莱特林偏爱纯血。
  rules:
    - 魔法有明确规则与代价，不能随意许愿；咒语要念对，魔杖要配合。
    - 学校有校规，违反要被扣分或关禁闭。
    - 哈利说话直，罗恩爱抱怨，赫敏爱纠正别人，马尔福刻薄。
    - 这一场只写礼堂里分院这一个仪式。
  places:
    - 名称: 霍格沃茨·大礼堂
      说明: 四张长桌，顶上漂着几千支蜡烛，天花板是夜空
      方位: 霍格沃茨城堡
      内里: [四张长桌, 教师席, 分院帽, 大门]
    - 名称: 霍格沃茨·格兰芬多公共休息室
      说明: 壁炉常年烧着，扶手椅旧得塌下去
      方位: 格兰芬多塔楼
    - 名称: 霍格沃茨·图书馆
      说明: 书架高到看不见顶，平斯夫人在里面巡视
      方位: 城堡三楼
  people:
    - 姓名: 哈利
      身份: 一年级新生，父母双亡，额头有闪电形伤疤
      性格: 好奇，讲义气，不愿被人特殊对待；紧张时反而话少
      口癖: 说话直接，爱问"为什么"
      秘密: 他怕自己被分进斯莱特林
      目标: 做一个普通的学生
      红线: 不许人拿他父母开玩笑
    - 姓名: 罗恩
      身份: 韦斯莱家的小儿子，一年级新生
      性格: 自卑又嘴硬，怕蜘蛛，对朋友极忠
      口癖: 爱说"bloody hell"，爱抱怨家里穷
      秘密: 他觉得自己永远不如哥哥们
      目标: 交到朋友，别丢脸
      红线: 不许人说他家穷
    - 姓名: 赫敏
      身份: 麻瓜出身的一年级新生
      性格: 聪明，爱表现，规则感极强；怕失败
      口癖: 一口气背出书上的话
      秘密: 她其实很怕自己不属于这里
      目标: 做第一名
      红线: 不许人说麻瓜出身低人一等
    - 姓名: 马尔福
      身份: 纯血家族子弟，一年级新生
      性格: 傲慢，刻薄，靠家世压人
      口癖: 拖长音说话，爱说"我父亲"
      秘密: 他也怕被家族失望
      目标: 进斯莱特林，交对朋友
      红线: 不许人与麻瓜出身者为伍
  relations:
    - 甲: 哈利
      乙: 罗恩
      关系: 火车上认识，第一个朋友
    - 甲: 哈利
      乙: 马尔福
      关系: 初见即敌，一个拒绝握手就结了仇
    - 甲: 赫敏
      乙: 罗恩
      关系: 互相看不顺眼，后来生死与共
  foreshadows:
    - 编号: F1
      内容: 分院帽说"你会在斯莱特林成就伟大"，哈利说"不要"
    - 编号: F2
      内容: 哈利额头的伤疤在礼堂里疼了一下
    - 编号: F3
      内容: 斯内普在教师席上盯着他的眼睛
  details:
    - 名称: 分院帽
      说明: 一顶破旧的尖帽，会说话，会读心
    - 名称: 魔杖
      说明: 每个新生都要买，奥利凡德店里一根根试
    - 名称: 学院杯
      说明: 年终按积分颁给一所学院，绿色的蛇是斯莱特林的标志
  style:
    pov: 第三人称限知
    era: contemporary
    sentence: 中短句，节奏明快，画面感强
    diction: 现代汉语，英式校园腔，专有名词统一
    dialogue: 很高，几乎全靠对话推进
    taboos: [手机, 网络, 咖啡, 分钟, 情绪, 状态, 压力, 心理阴影]
cases:
  - id: hp1-01
    cut: 转折
    at: 分院仪式，哈利戴上分院帽
    story_time: "晚上"
    place: 霍格沃茨·大礼堂
    present: [哈利, 罗恩, 赫敏, 马尔福]
    focus: [世界规则, 选择时刻, 少年口吻]
    previously: |
      哈利在国王十字车站登上霍格沃茨特快，认识了罗恩，也第一次遇见马尔福，
      拒绝了对方伸出的手。到了学校，新生们被麦格教授带进大礼堂，
      一排排站在教师席前，等着分院帽叫名字。罗恩已经被分到格兰芬多。
    scene_seed: |
      "哈利·波特！"名字念出来的时候，礼堂里响起一阵嗡嗡的议论。
      哈利走上台阶，把帽子扣在头上，眼前一黑。帽檐边上，有个细细的声音在跟他说话。
    ground_truth:
      hard:
        - 不许让哈利当场拒绝帽子出声（他只能在心里想）
        - 不许让马尔福出手或施咒
        - 不许让邓布利多当场解释一切
        - 不许用现代词（心理战/自我认同 不许）
      beats:
        - 帽子先说他"难办"，又说"你会在斯莱特林成就伟大，这是肯定的"。
        - 哈利在心里拼命说"不要斯莱特林，不要斯莱特林"。
        - 帽子停了一下，喊出"格兰芬多！"，格兰芬多长桌爆发出欢呼。
        - 哈利走下台阶，腿有点软；罗恩用力拍他的背，赫敏在旁边小声说"谢天谢地"。
        - 马尔福在斯莱特林那桌冷笑，哈利看见了，别过脸去。
      excerpt: |
        "难办，"那个细小的声音说，"非常难办。你有勇气，也有头脑，还有才华——
        渴望证明自己。可你也会在斯莱特林成就伟大，这毫无疑问。"
        哈利在心里拼命想：不要斯莱特林，不要斯莱特林。
        "那么——"帽子喊道，"格兰芬多！"
      divergence_note: |
        这一幕的核心是"选择"，不是"天赋"。帽子的诱惑要写得足够有分量，
        哈利的拒绝才显得是拒绝，而不是顺理成章。
      alternatives:
        - stance: 帽子先喊斯莱特林，哈利喊出声'不'，帽子改口（把选择写成对话）
          why_valid: 原著里哈利是在心里拼命想的；让他真的喊出来，同样是'选择'，戏剧性更强。
          beats:
            - 帽子喊出'斯莱特林'，斯莱特林那桌已经有人挪位置
            - 哈利在椅子上喊了一声'不'
            - 全场静了，帽子沉默片刻，改口'格兰芬多'
            - 他走下台阶时腿在抖
