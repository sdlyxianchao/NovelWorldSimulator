id: zhuxian
title: 诛仙
title_en: Zhu Xian
author: 萧鼎
year: "2003"
country: 中国
language: zh
category: 网络
medium: 网络
genres: [仙侠, 成长, 言情, 悲剧]
representativeness: |
  中文网络仙侠的早期标杆，"凡人流"情感结构的源头之一：一个资质平庸的少年被正道收留，
  在门派规矩与私情之间被撕开。它的读者记忆点几乎全在人物关系上，
  正好检验推演系统能不能把"关系"当作推动力，而不是背景板。
license: in_copyright_short_quote
bible:
  worldview: |
    青云门、天音寺、焚香谷为正道三大派，魔教鬼王宗、合欢派等盘踞南方。
    青云门有七脉，大竹峰最弱，掌门道玄真人执掌诛仙剑。修仙者以真气御物，
    法宝有品级，境界分玉清、上清、太清。正道讲"除魔卫道"，魔教讲"随心所欲"，
    两边都有好人坏人。
  rules:
    - 有仙法有法宝，但都要耗真气；受伤会虚弱，不能无限放大招。
    - 门派规矩森严：师徒、辈分、戒律，犯戒要受罚。
    - 张小凡说话木、慢；碧瑶说话轻、俏，带一点任性。
    - 这一场只写通天峰这一处，不许切去别的战场。
  places:
    - 名称: 青云山·通天峰
      说明: 青云门主峰，殿宇连云，诛仙剑插在峰顶
      方位: 青云山正中
      内里: [玉清殿, 峰顶, 石阶, 云海]
    - 名称: 青云山·大竹峰
      说明: 七脉中最冷清的一脉，只有几间竹屋
      方位: 青云山西麓
    - 名称: 滴血洞
      说明: 魔教旧地，洞中有痴情咒的刻文
      方位: 空桑山
  people:
    - 姓名: 张小凡
      别称: [张小凡, 小凡]
      身份: 青云门大竹峰弟子，资质平庸
      性格: 木讷，认死理，念旧；被逼到极处反而安静
      口癖: 说话慢，常只说半句
      秘密: 他身怀佛道两家功法，还带着噬血珠
      目标: 守住自己认定的那几个人
      红线: 不许人伤害田不易一家
    - 姓名: 碧瑶
      别称: [碧瑶]
      身份: 鬼王宗宗主之女
      性格: 任性，直率，爱上就什么都不顾
      口癖: 爱叫他"小凡"，说话带笑
      秘密: 她早知道痴情咒的代价
      目标: 带张小凡离开正道的是非
      红线: 不许人逼张小凡选边
    - 姓名: 道玄真人
      别称: [道玄, 掌门, 道玄真人]
      身份: 青云门掌门
      性格: 威严，护短，凡事以门派为先
      口癖: 说话不容置疑
      秘密: 他催动诛仙剑已伤及自身
      目标: 保住青云门
      红线: 不许魔教中人踏上通天峰
    - 姓名: 田不易
      别称: [田不易, 田师叔]
      身份: 大竹峰首座，张小凡的师父
      性格: 面冷心热，骂得凶护得紧
      口癖: 骂徒弟"蠢材"
      秘密: 早看出徒弟身上的功法不对，一直替他瞒着
      目标: 保住这个徒弟
      红线: 不许外人动他门下的人
  relations:
    - 甲: '张小凡'
      乙: '碧瑶'
      关系: '正魔两立，偏偏最信彼此'
    - 甲: '田不易'
      乙: '张小凡'
      关系: '师徒，骂得最狠也护得最紧'
    - 甲: '道玄真人'
      乙: '张小凡'
      关系: '掌门与弟子，法度面前没有私情'
  foreshadows:
    - 编号: 'F1'
      内容: '痴情咒的刻文写着"以命换命"，碧瑶在滴血洞看过'
    - 编号: 'F2'
      内容: '诛仙剑出鞘一次，道玄真人就老一分'
    - 编号: 'F3'
      内容: '张小凡怀里那串铃铛，是碧瑶给他的'
  details:
    - 名称: '噬血珠'
      说明: '一颗暗红的珠子，能吸人精血'
    - 名称: '诛仙剑'
      说明: '青云门镇派之宝，剑成而人损'
    - 名称: '合欢铃'
      说明: '碧瑶的法宝，铃声能乱人心神'
  style:
    pov: 第三人称限知
    era: fantasy
    sentence: 中长句，情绪句多，短句用于爆发
    diction: 现代白话夹古语，仙侠术语固定
    dialogue: 高，情感全靠对白推
    taboos: [手机, 电话, 咖啡, 分钟, 情绪管理, 心理建设]
cases:
  - id: zx-01
    cut: 高潮前
    at: 通天峰上，张小凡身份败露，碧瑶现身
    story_time: "正午"
    place: 青云山·通天峰
    present: [张小凡, 碧瑶, 道玄真人, 田不易]
    focus: [情感张力, 立场冲突, 爆发节奏]
    previously: |
      张小凡身怀佛道两家功法、又与魔教有牵连的事被揭出。正道各派齐聚通天峰，
      要掌门道玄真人给个交代。田不易护着徒弟，被众人逼问。张小凡跪在玉清殿前，
      一句话也不辩。就在这时，一道青光从云海里掠上来。
    scene_seed: |
      碧瑶落在石阶上，衣角还带着云气。她看都没看周围的人，先走到张小凡面前，
      蹲下去，问他疼不疼。道玄真人的手已经按在剑柄上。
    ground_truth:
      hard:
        - 不许让张小凡当场反击道玄真人
        - 不许让碧瑶活着离开（痴情咒的代价必须付出）
        - 不许让田不易弃徒自保
        - 不许用现代词（虐心/催泪/高能 不许）
      beats:
        - 道玄真人喝令拿下魔教妖女，田不易拦在前面，说"要杀先杀我"。
        - 碧瑶拉起张小凡要走，张小凡不动，说"我不能连累师父"。
        - 道玄真人催动诛仙剑，剑光罩下；碧瑶推开张小凡，念动痴情咒。
        - 咒成，她的魂魄散作青光，只留下一串铃铛落地。
        - 张小凡抱住她，一声没哭出来；十年后，他成了鬼王宗的鬼厉。
      excerpt: |
        碧瑶推开他，念动了那段咒文。青光从她身上升起来，像一层薄薄的雾。
        她回头看了他一眼，笑了一下，说："小凡，我不后悔。"
        铃铛落在地上，滚了两圈，停住了。
      divergence_note: |
        这一段不许写成长篇抒情。真正的重量在"她笑了一下"和"铃铛滚了两圈"这种小动作上；
        若写成两人抱头痛哭、长篇告白，力量反而散了。
      alternatives:
        - stance: 碧瑶不念痴情咒，而是把张小凡推下云海、自己挡剑
          why_valid: 她要的是'让他活'；用身体挡和用命换，目的相同，代价相当，不违背任何设定。
          beats:
            - 道玄真人剑光罩下，碧瑶一把推开张小凡
            - 她把他往崖下推，自己转过身迎着剑光
            - 张小凡在下坠中看见她的衣角被剑光吞掉
            - 铃铛从崖上落下来，掉在他手边
