id: guimi
title: 诡秘之主
title_en: Lord of the Mysteries
author: 爱潜水的乌贼
year: "2018"
country: 中国
language: zh
category: 网络
medium: 网络
genres: [克苏鲁, 蒸汽朋克, 悬疑, 序列]
representativeness: |
  中文网络文学"设定流"的代表作，也是近年最成功的海外输出之一。它把"序列—途径—扮演法"
  做成了一套可推理的系统，同时要求人物在迷雾中保持警惕。
  它考的是"信息差"和"神秘感"：写透了就没味道，写漏了读者看不懂。
license: in_copyright_short_quote
bible:
  worldview: |
    维多利亚风格的鲁恩王国，蒸汽与齿轮的年代。世界之上有"灰雾"，之下有"灵界"。
    非凡者分二十二条途径，每条途径九个序列，越往上越接近神，也越容易失控。
    教会、军方、秘密组织都在争夺非凡特性。普通人不知道这些，只在雾天里莫名发冷。
    克莱恩·莫雷蒂死而复生，发现自己能登上灰雾之上的古老宫殿。
  rules:
    - 非凡能力有代价，用得越多越接近失控；不许无代价地变强。
    - 神秘学知识必须"残缺"：谁也不能一次说清全部的真相。
    - 克莱恩说话谨慎，凡事先想后果；奥黛丽好奇，阿尔杰阴沉。
    - 这一场只写灰雾之上这一次聚会，不许切到现实的巷战。
  places:
    - 名称: 灰雾之上·古老宫殿
      说明: 一张长桌，十几把高背椅，窗外是无边的灰雾
      方位: 灰雾深处
      内里: [长桌, 高背椅, 窗, 祭坛]
    - 名称: 廷根市·明斯克街
      说明: 中产住宅区，雾天路灯昏黄
      方位: 鲁恩王国廷根市
    - 名称: 占卜俱乐部
      说明: 上流人士玩通灵的地方，会员非富即贵
      方位: 廷根市西区
  people:
    - 姓名: 克莱恩
      身份: 穿越者，值夜者小队成员，代号"愚者"
      性格: 谨慎到多疑，习惯先算最坏结果；心里爱吐槽，面上不动
      口癖: 心里叫自己"我"，说话慢半拍
      秘密: 他其实什么都不懂，全靠装
      目标: 活下去，弄清灰雾的来历
      红线: 绝不让成员知道他的真实身份
    - 姓名: 奥黛丽
      身份: 霍尔伯爵之女，代号"正义"
      性格: 天真，好奇，胆子却大；从小被保护得太好
      口癖: 爱说"这真是太奇妙了"
      秘密: 她把这当成一场游戏，还没意识到危险
      目标: 见识更广阔的世界
      红线: 不许人伤害她的家人
    - 姓名: 阿尔杰
      身份: 风暴教会的神职人员，代号"倒吊人"
      性格: 阴沉，务实，凡事讲交换
      口癖: 说话简短，爱用"可以"
      秘密: 他手上不干净，急需非凡材料
      目标: 往上爬，摆脱现在的处境
      红线: 不做亏本买卖
  relations:
    - 甲: '克莱恩'
      乙: '奥黛丽'
      关系: '主持者与第一个成员，一个装神一个真信'
    - 甲: '克莱恩'
      乙: '阿尔杰'
      关系: '互相试探，谁都不肯先交底'
    - 甲: '奥黛丽'
      乙: '阿尔杰'
      关系: '同席的陌生人，出身天差地别'
  foreshadows:
    - 编号: 'F1'
      内容: '灰雾之上的宫殿，其实是克莱恩唯一的主场'
    - 编号: 'F2'
      内容: '"愚者"这个代号，日后成了整个世界的传说'
    - 编号: 'F3'
      内容: '塔罗牌有二十二张，正好对上二十二条途径'
  details:
    - 名称: '塔罗牌'
      说明: '用来给成员定代号的牌，背面有花纹'
    - 名称: '灵界'
      说明: '与现世重叠的另一层世界，占卜与通灵都从这里取信息'
    - 名称: '非凡特性'
      说明: '非凡者死后遗留的力量结晶，可以被人吸收'
  style:
    pov: 第三人称限知
    era: steampunk
    sentence: 中长句，描写克制，心理独白穿插
    diction: 翻译腔的欧式语感，术语精确，少成语
    dialogue: 中，礼貌而疏离
    taboos: [手机, 电话, 网络, 咖啡(可), 分钟, 情绪, 状态, 氛围]
cases:
  - id: gm-01
    cut: 中段
    at: 克莱恩第一次从灰雾之上拉人
    story_time: "深夜"
    place: 灰雾之上·古老宫殿
    present: [克莱恩, 奥黛丽, 阿尔杰]
    focus: [神秘感, 信息差, 人物初遇]
    previously: |
      克莱恩死后复生，发现自己能在梦中登上灰雾之上的一座古老宫殿。
      他试过很多次，确认这里只有他一个人。这一次，他决定按仪式上看到的办法，
      把两个与自己有微弱联系的人拉上来。
    scene_seed: |
      长桌两端各有一道模糊的人影正在凝实。克莱恩坐在主位，把脸藏在灰雾里，
      手指在桌下攥紧。那两道人影睁开了眼睛。
    ground_truth:
      hard:
        - 不许让克莱恩露出慌乱或自认是新人（他必须镇得住场面）
        - 不许让成员当场看穿他的真实身份
        - 不许把灰雾的来历一次说清（神秘感必须保留）
        - 不许写出'系统提示''面板'这类游戏化用语
      beats:
        - 奥黛丽先开口，声音发抖，问这是哪里；阿尔杰立刻戒备，手按向腰侧。
        - 克莱恩压低声音，自称"愚者"，说这是一次交易，不是绑架。
        - 阿尔杰试探着问"你能给我什么"，奥黛丽则问"我能不能再来"。
        - 克莱恩定下规矩：每周一次，以代号相称，不得追问彼此身份。
        - 奥黛丽给自己取名"正义"，阿尔杰沉默片刻，说"倒吊人"。
      excerpt: |
        "愚者。"那个声音说，"你可以这样称呼我。"
        奥黛丽怔了一下，随即笑了："那我叫'正义'。"
        另一边的人影沉默了很久，才说："倒吊人。"
        灰雾在窗外缓缓流动，像一片没有边际的海。
      divergence_note: |
        克莱恩绝不能露怯。他的每一句话都要留出解释空间——
        这一场写得好不好，就看读者信不信"这个人真的镇得住场面"。
      alternatives:
        - stance: 克莱恩只给规矩、不给承诺，用沉默逼成员自己开价
          why_valid: 他是靠'装'立足的，越少说越安全；让对方先报价也符合'愚者'这个身份，且不违背任何设定。
          beats:
            - 奥黛丽先问这是哪里，克莱恩不答，只让她自己看窗外
            - 阿尔杰问'你能给我什么'，克莱恩反问'你愿意拿什么换'
            - 两边沉默了一阵，奥黛丽先开口报了名字
            - 克莱恩定下规矩，说下一次聚会在一周后
