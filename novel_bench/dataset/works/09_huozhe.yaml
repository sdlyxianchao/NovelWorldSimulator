id: huozhe
title: 活着
title_en: To Live
author: 余华
year: "1993"
country: 中国
language: zh
category: 当代
medium: 出版
genres: [苦难, 家族, 第一人称回忆]
representativeness: |
  当代中国最广为流传的长篇之一。用一个人一生的死亡串起半个世纪，语言却极简、极平，
  几乎不抒情。它检验的是"克制"：同样的悲惨材料，写成哭天抢地就废了。
license: in_copyright_short_quote
bible:
  worldview: |
    江南小镇，从民国末年讲到八十年代。徐家曾是镇上首富，有百亩田、一进院子。
    福贵是独子，娶了米行老板的女儿家珍，吃喝嫖赌，把家业败光。
    镇上还有龙二这样的赌场中人，靠放局吃饭。土改、大跃进、饥荒、文革，
    一波一波压过来，谁家也躲不开。这里的人不谈道理，只谈怎么活下去。
  rules:
    - 第一人称，由福贵老年时对"我"讲；语言必须是农民的口语，短、平、不修饰。
    - 不写景，不写心理分析；悲伤用动作和沉默承担。
    - 时代要落地：法币、银元、合作社、工分、粮票，用对年月。
    - 这一场只写一夜到天亮，不许一句"后来"带过十年。
  places:
    - 名称: 镇上·赌场
      说明: 后街一间大屋，白天也点灯，烟雾腾腾
      方位: 镇后街
      内里: [赌桌, 里间, 后门, 天井]
    - 名称: 徐家老宅
      说明: 一进院子，门前有两棵槐树
      方位: 镇东头
    - 名称: 龙二家的院子
      说明: 赢来的宅子，院墙比别家高
      方位: 镇中心
  people:
    - 姓名: 福贵
      别称: [福贵, 少爷]
      身份: 徐家独子，败家子
      性格: 混，赌起来不要命；输了也不服，心里其实怕父亲
      口癖: 爱说"再来一把"
      秘密: 他已经把田契抵了一半，家里不知道
      目标: 把输的赢回来
      红线: 不许人说他爹的坏话
    - 姓名: 龙二
      别称: [龙二]
      身份: 赌场放局的人
      性格: 笑面虎，从不急，等的就是人急
      口癖: 一句一个"福贵少爷"
      秘密: 这一局是他做的套
      目标: 把徐家的田和宅子赢过来
      红线: 不许人赖账
    - 姓名: 家珍
      别称: [家珍]
      身份: 福贵的妻子，米行老板的女儿
      性格: 温顺里有硬气，劝不动就走
      口癖: 叫"福贵"，从不叫少爷
      秘密: 怀着第二个孩子，还没告诉福贵
      目标: 把丈夫从赌桌上拉回来
      红线: 不许人碰她的孩子
    - 姓名: 徐老爷
      别称: [老爷, 徐老爷]
      身份: 福贵的父亲，徐家当家人
      性格: 要脸，暴躁，打儿子下得去手
      口癖: 骂人只骂"畜生"
      秘密: 早知道儿子在赌，舍不得下狠手管
      目标: 保住祖上的田
      红线: 不许人提徐家败了
  relations:
    - 甲: '福贵'
      乙: '龙二'
      关系: '赌徒与放局的，一个急一个等'
    - 甲: '福贵'
      乙: '家珍'
      关系: '夫妻，她劝了无数次，他一次没听'
    - 甲: '福贵'
      乙: '徐老爷'
      关系: '父子，打归打，田还是要留给他'
  foreshadows:
    - 编号: 'F1'
      内容: '福贵说"再来一把"，这句话把一个家推下了坡'
    - 编号: 'F2'
      内容: '家珍肚子里的孩子，就是后来的有庆'
    - 编号: 'F3'
      内容: '龙二赢来的宅子，土改时成了他的催命符'
  details:
    - 名称: '田契'
      说明: '徐家百亩田的契纸，锁在柜子里'
    - 名称: '骰子'
      说明: '赌场用的瓷骰，掷在碗里响'
    - 名称: '银元'
      说明: '那时候还用银元，一块能买几斗米'
  style:
    poven: ""
    pov: 第一人称
    era: modern
    sentence: 短句，几乎不用形容词，一句一件事
    diction: 江南农民口语，平白，不抒情
    dialogue: 中，话说得直，少客套
    taboos: [手机, 电话, 咖啡, 分钟, 情绪, 状态, 压力, 心理创伤]
cases:
  - id: hz-01
    cut: 转折
    at: 福贵输光家产的那一夜
    story_time: "深夜"
    place: 镇上·赌场
    present: [福贵, 龙二, 家珍]
    focus: [第一人称, 克制, 因果链条]
    previously: |
      徐家到福贵这一代只剩他一个独子。他娶了米行老板的女儿家珍，有了一女一子，
      却天天泡在赌场。父亲打也打了，骂也骂了，他照旧去。这一夜他又坐上赌桌，
      手气先是好的，后来一把比一把大。
    scene_seed: |
      屋里只点两盏灯，烟把人脸熏得发黄。福贵把面前的银元全推出去，
      手在抖。龙二笑着替他把牌翻开，屋里一下静了。家珍站在门口，怀里抱着孩子，
      已经站了半个时辰，没人理她。
    ground_truth:
      hard:
        - 不许让福贵当场嚎哭（他必须先是木的）
        - 不许让龙二狞笑或威胁
        - 不许出现现代词（心理创伤/崩溃/情绪 不许）
        - 不许让家珍说长句子（她话少）
      beats:
        - 龙二把账本推过来，说"福贵少爷，房子和地，都归我了"，语气像在道喜。
        - 福贵说"再来一把"，龙二收起账本，说今天不赌了，转身进了里间。
        - 家珍走过来，什么也没说，拉着他的袖子往外走；走到街上才哭出声。
        - 回家后徐老爷一口气没上来，从粪缸边上栽下去，几天后就没了。
        - 家珍被娘家接走；福贵租了五亩地，第一次自己下田。
      excerpt: |
        龙二把我送到门口，说："福贵少爷，你回去歇着吧。"我说："我还没输完。"
        龙二笑了，说："你已经输完了。"我站在街上，天黑得看不见路，
        家珍拉着我的袖子，一句话不说。走到家门口，我才晓得哭。
      divergence_note: |
        这一段的力量全在"不哭"上：输的那一刻人是木的，哭要等到回了家。
        若让福贵当场嚎啕、让龙二狞笑，味道就全变了。
      alternatives:
        - stance: 福贵输光后不回家，在街上坐到天亮
          why_valid: 原著里他确实是走回去的；让他在街上坐一夜，是同一个'不敢进门'的延长，不违背任何设定。
          beats:
            - 龙二把账本收起来，说今天不赌了
            - 福贵站在门口，没有动
            - 他在街边的石阶上坐下来，一直坐到天发白
            - 回家时家珍已经把东西收拾好了
