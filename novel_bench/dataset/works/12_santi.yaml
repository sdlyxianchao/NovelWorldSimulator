id: santi
title: 三体
title_en: The Three-Body Problem
author: 刘慈欣
year: "2006"
country: 中国
language: zh
category: 当代
medium: 出版
genres: [硬科幻, 悬疑, 文明, 长篇]
representativeness: |
  中国科幻走向世界的标志。它的力量不在文笔，而在"设定一旦成立，人就只能按它行事"的硬度：
  三颗太阳、乱纪元、脱水、文明重启。它最适合检验推演系统会不会在硬约束面前随便编造。
license: in_copyright_short_quote
bible:
  worldview: |
    一款名为《三体》的虚拟现实游戏在科学界流传。玩家戴上 V 装具，进入一个被三颗太阳统治的世界：
    恒星运行毫无规律，恒纪元与乱纪元交替，文明一次次被毁灭又一次次重建。
    游戏里的 NPC 都以中国历史人物命名，他们用阴阳、卦象、礼制来解释天象。
    现实世界里，纳米材料专家汪淼被卷入一场科学家连环自杀的谜团。
  rules:
    - 游戏世界的物理必须自洽：三日凌空、大撕裂、极寒，都有明确后果。
    - NPC 不知道自己是 NPC，用古代观念解释天文现象。
    - 汪淼是现代科学家，心里始终在换算温度、轨道、辐射。
    - 这一场只写游戏里这一天，不许切回现实开会。
  places:
    - 名称: 三体游戏·荒原
      说明: 一望无际的荒原，地平线上有三颗太阳的残影
      方位: 游戏初始场景
    - 名称: 三体游戏·朝歌
      说明: 用巨石垒成的都城，城中有干仓与脱水场
      方位: 荒原中央
      内里: [城门, 广场, 干仓, 祭台]
    - 名称: 三体游戏·金字塔
      说明: 人列计算机的所在，由三千万士兵组成
      方位: 朝歌城外
  people:
    - 姓名: 汪淼
      身份: 纳米材料研究者，第一次进入游戏
      性格: 冷静，习惯用数据判断；对不合物理的现象会本能地抗拒
      口癖: 心里常默算数字，说话克制
      秘密: 他眼前已经开始出现倒计时
      目标: 弄清这款游戏到底想告诉他什么
      红线: 不接受"神迹"这种解释
    - 姓名: 周文王
      身份: 游戏中的学者，背着一个巨大的木箱
      性格: 迂执，笃信卦象，讲起道理来滔滔不绝
      口癖: 爱说"依卦象看"，动辄引《易》
      秘密: 他的预测从来没准过
      目标: 推算出下一次恒纪元
      红线: 不许人侮辱先王之道
    - 姓名: 纣王
      身份: 朝歌的君主
      性格: 暴戾，怕死，遇事先想自己
      口癖: 自称"寡人"
      秘密: 他早已备好脱水的药，只够自己用
      目标: 让都城熬过乱纪元
      红线: 不许人提"亡国"二字
    - 姓名: 伏羲
      身份: 游戏中的祭司，周文王的对手
      性格: 神秘，善蛊惑，说话像预言
      口癖: 爱说"太阳要出来了"
      秘密: 他的"法术"只是对恒星运行的一种误读
      目标: 让纣王信他而不是周文王
      红线: 不许人拆穿他的仪式
  relations:
    - 甲: '周文王'
      乙: '伏羲'
      关系: '两种解释世界的办法，争的是君王的信任'
    - 甲: '纣王'
      乙: '周文王'
      关系: '君王与学者，用得着就听，用不着就杀'
    - 甲: '汪淼'
      乙: '周文王'
      关系: '外来者与 NPC，一个要问真相，一个只会算卦'
  foreshadows:
    - 编号: 'F1'
      内容: '周文王木箱里的沙漏，是游戏里唯一可信的计时器'
    - 编号: 'F2'
      内容: '脱水者薄得像纸，堆在干仓里，等恒纪元泡水复活'
    - 编号: 'F3'
      内容: '三颗太阳同时出现的那一天，文明会被烤成琉璃'
  details:
    - 名称: '干仓'
      说明: '存放脱水人体的巨大仓库，阴冷干燥'
    - 名称: '脱水'
      说明: '把身体里的水挤干，卷起来存放，恒纪元再泡开'
    - 名称: 'V 装具'
      说明: '全息虚拟现实头盔与感应服'
  style:
    pov: 第三人称限知
    era: contemporary
    sentence: 中长句，说明性文字多，数字与单位精确
    diction: 现代书面语，术语准确，少抒情
    dialogue: 中，NPC 说话文白夹杂，汪淼说话简短
    taboos: [魔法, 修仙, 内力, 情绪化, 氛围感]
cases:
  - id: st-01
    cut: 中段
    at: 汪淼第一次登录《三体》，落在荒原上
    story_time: "夜晚"
    place: 三体游戏·荒原
    present: [汪淼, 周文王, 纣王]
    focus: [硬设定, 陌生化, 信息释放节奏]
    previously: |
      汪淼被邀请进入一款名为《三体》的游戏。他戴上 V 装具，眼前一黑，
      再睁眼时已站在一片荒原上。天上有三个太阳的残影，地面干裂，远处有石砌的城。
      一个背着大木箱的老人正朝他走来。
    scene_seed: |
      老人走到近前，把木箱放下，先抬头看天，又低头掐指。
      城门那边传来号角，一队人抬着一卷东西往城里走。汪淼发现自己身上穿着麻布衣服，
      手里多了一只沙漏。
    ground_truth:
      hard:
        - 不许让汪淼在游戏里使用现代仪器（他身上只有麻布衣和沙漏）
        - 不许让 NPC 知道自己是 NPC
        - 不许用'魔法''神迹'解释天象（必须有物理解释或明确的无解）
        - 不许让汪淼当场见到三体人
      beats:
        - 周文王自称能推算恒纪元，说依卦象三日之内太阳将正常升起，请汪淼同去朝歌见纣王。
        - 城里正在脱水：人们把自己卷成薄片，由兵士抬进干仓。
        - 纣王半信半疑，伏羲在旁唱反调；周文王以性命作保。
        - 三日之后太阳没有正常升起，反而出现了三颗飞星，气温骤降，全城冻毙。
        - 画面一黑，浮现一行字："第 137 号文明毁灭于严寒，文明种子仍在，将重新启动。"
      excerpt: |
        周文王说："依卦象，三日之内，恒纪元将至。"纣王问："若不准呢？"周文王说："臣愿以性命担保。"
        三日后，天空出现了三颗飞星，气温骤降。城里的人来不及脱水，一个接一个冻死。
        汪淼最后看见的是周文王跪在雪地里，抱着那只木箱。
      divergence_note: |
        这一场的关键不是"谁对谁错"，而是让读者（和汪淼）第一次意识到：
        这个世界的规律本身就不稳定。若写成一次普通的自然灾害，设定就没立起来。
      alternatives:
        - stance: 周文王不带汪淼进城，只在荒原上教他看沙漏计时
          why_valid: 游戏的核心是让玩家理解'这个世界没有周期'；用一个老人的计时法来演示，比进城见君王更直接。
          beats:
            - 周文王把沙漏倒过来，说这一漏是多久
            - 他让汪淼数，数到一半沙漏停了——沙结成了块
            - 他脸色变了，说'乱纪元来了'
            - 远处传来号角，城门方向开始有人脱水
