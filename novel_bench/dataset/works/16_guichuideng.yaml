    diction: 北京口语，行话术语混着用
    dialogue: 高，靠贫嘴调节恐怖
    taboos: [手机, 电话, 咖啡, 分钟, 情绪, 状态, 压力, 心理阴影]
cases:
  - id: gcd-01
    cut: 转折
    at: 精绝古城主墓室，点烛开棺之前
    story_time: "深夜"
    place: 精绝古城·主墓室
    present: [胡八一, 王胖子, Shirley 杨]
    focus: [恐怖节奏, 规矩, 第一人称腔调]
    previously: |
      我们三个人从沙漠底下摸进精绝古城的墓道，走了大半夜，才到主墓室。
      穹顶上画着星图，中央一口石棺，棺盖上刻着看不懂的字。胖子已经伸手去推了，
      我拦住他，从包里摸出蜡烛。
    scene_seed: |
      我把蜡烛点在东南角，火苗稳稳的。胖子蹲在石棺边上，手电照着棺缝，
      嘴里念叨着"这里头得有多少好东西"。Shirley 杨蹲在星图下面，拿本子描。
      忽然，火苗往下一矮。
    ground_truth:
      hard:
        - 不许出现真正的鬼（所有怪事最后都要有解释）
        - 不许让胡八一破'灯灭必退'的规矩
        - 不许让三人组有人死在这一段
        - 不许用现代词（心理暗示/幻觉 可作解释但不许当结论先说）
      beats:
        - 烛火由黄转绿，缩成一豆；胡八一脸色一变，喊"撤"。
        - 石棺盖自己滑开一条缝，一股土腥气涌出来；胖子腿都软了。
        - 棺中尸体并未腐坏，指甲长得离谱；胡八一掏出黑驴蹄子塞进它嘴里。
        - 三人退到甬道，身后传来指甲刮石头的声音；暗河的水忽然涨了。
        - 逃出墓道时，蜡烛已经灭了；胡八一说，这趟东西一件都不能拿。
      excerpt: |
        那火苗"噗"地一下，绿了。我心里咯噔一声，喊了句"撤"。
        胖子还不信，说风大。话音没落，石棺盖"嘎"地响了一声，自己滑开一条缝。
        我这辈子没闻过那么冲的土腥味，当时就知道，这趟要出事。
      divergence_note: |
        恐怖不能靠"阴森恐怖"这类形容词，要靠规矩被打破的那一下：
        灯绿、棺开、气味出来。三段之内必须有一件具体的坏事发生。
      alternatives:
        - stance: 蜡烛没灭，但胡八一还是决定撤（他看出棺缝里的土是新的）
          why_valid: 他守的是'该退就退'这条规矩，不只是看灯；凭经验判断同样成立。
          beats:
            - 胡八一蹲下摸了摸棺缝，土是湿的、新的
            - 他没等灯灭就喊撤
            - 胖子不服，说灯还亮着
            - 三人退到甬道，身后棺盖响了一声
