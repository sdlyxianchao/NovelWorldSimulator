id: guichuideng
title: 鬼吹灯
title_en: Ghost Blows Out the Light
author: 天下霸唱
year: "2006"
country: 中国
language: zh
category: 网络
medium: 网络
genres: [探险, 悬疑, 恐怖, 民俗]
representativeness: |
  中文网络"盗墓"类型的开山之作。它把民间禁忌、风水术语和第一人称吹牛腔揉成一种独特的腔调：
  半真半假，越说越玄，却始终有一个"规矩"在约束人物。
  它检验的是"恐怖氛围靠什么成立"——是靠形容词，还是靠规矩与细节。
license: in_copyright_short_quote
bible:
  worldview: |
    八十年代，胡八一从部队复员，靠祖传的《十六字阴阳风水秘术》看穴。
    他与发小王胖子、古董商大金牙搭伙，后来遇上美籍华人 Shirley 杨。
    摸金校尉有规矩：人点烛，鬼吹灯；灯灭即退，不可强取。
    古墓里有机关、有毒虫、有"粽子"，但一切都有解释，只是解释得晚。
  rules:
    - 没有真正的鬼。所有怪事最后都要落到机关、毒气、生物或心理上。
    - 摸金校尉的规矩必须遵守，违反就有代价。
    - 胡八一说话带京腔，爱自嘲；胖子贫嘴；Shirley 杨冷静专业。
    - 这一场只写墓道到墓室这一段，不许一句"后来我们出来了"。
  places:
    - 名称: 精绝古城·墓道
      说明: 夯土墓道，壁上彩绘已剥落，空气里有股土腥
      方位: 塔克拉玛干沙漠深处
      内里: [甬道, 石门, 壁龛, 台阶]
    - 名称: 精绝古城·主墓室
      说明: 穹顶画着星图，中央一口石棺
      方位: 墓道尽头
      内里: [石棺, 星图, 烛台, 暗河]
    - 名称: 北京·潘家园
      说明: 古董摊子挤成一片，真假掺着卖
      方位: 北京
  people:
    - 姓名: 胡八一
      身份: 复员军人，摸金校尉后人
      性格: 胆大心细，嘴上贫，关键时刻守规矩
      口癖: 爱说"我跟你说"，自称"老胡"
      秘密: 他其实怕黑，从小怕
      目标: 活着出去，把东西弄清楚
      红线: 灯灭必退，这条规矩不能破
    - 姓名: 王胖子
      身份: 胡八一的发小，倒腾过服装
      性格: 贪财，嘴碎，真出事时靠得住
      口癖: 爱说"发了"，一急就喊"老胡"
      秘密: 他欠了一屁股债
      目标: 捞点值钱的
      红线: 不丢下兄弟
    - 姓名: Shirley 杨
      身份: 美籍华人，考古学者
      性格: 冷静，专业，不信鬼神只信证据
      口癖: 说话简洁，爱说"根据资料"
      秘密: 她外祖父当年来过这座墓
      目标: 找到外祖父留下的记录
      红线: 不许人乱动文物
  relations:
    - 甲: '胡八一'
      乙: '王胖子'
      关系: '发小，一个拿主意一个起哄'
    - 甲: '胡八一'
      乙: 'Shirley 杨'
      关系: '互相看不上又互相倚重'
    - 甲: '王胖子'
      乙: 'Shirley 杨'
      关系: '一个贪一个拦，天天拌嘴'
  foreshadows:
    - 编号: 'F1'
      内容: '蜡烛放在墓室东南角，是摸金校尉的规矩'
    - 编号: 'F2'
      内容: '石棺上的星图，与精绝国的灭亡有关'
    - 编号: 'F3'
      内容: '暗河的水声，一直没停过'
  details:
    - 名称: '蜡烛'
      说明: '下墓必点的一根白蜡，放在东南角'
    - 名称: '黑驴蹄子'
      说明: '用来对付"粽子"的老物件'
    - 名称: '洛阳铲'
      说明: '探土用的铲子，看土色便知地下有没有东西'
  style:
    pov: 第一人称
