id: mowenlou
title: 望江楼·聊斋夜客
title_en: Mowen Tower
author: 本机原创项目
year: "2026"
country: 中国
language: zh
category: 当代
medium: 网络
genres: [古典志怪, 明清白话, 单元剧, 悬疑]
representativeness: |
  **本项目自有的原创世界**，不是公版书 —— 收它是因为它跟其余 28 个用例的性质不同：
  那些考的是"能不能接住别人写好的世界"，这一个考的是"能不能接住**作者自己设定里的规矩**"。
  它的设定写得比多数出版书都细：掌柜台词一章不超过十句、每句不超过十二字，
  阿九不说话、只能用动作回答，账本只用干支不写年号，第一部完结前不许出现「轮回」两个字。
  这类"人物级写作约束"是通用模型最容易塌的地方 —— 它们会在第三章开始讲道理、开始抒情、
  开始把掌柜写成说书人。所以它是最好的压力测试：**规矩越多，越容易看出模型有没有在听。**
license: in_copyright_short_quote
bible:
  worldview: |
    清初山东淄川，官道与小路交叉的桥头，开着一座两层木楼，叫望江楼。
    白日卖茶，接的是行旅客商；夜里戌时挂起白灯笼，是「两界驿」，接的是另一边的人。
    楼不等人上门。它追着「未了之事」走 —— 停在悲剧发生之前截胡、停在残局之后收拾、
    或在因果收口时把双方请上楼对质。每停一处，楼身就旧一分：它不因岁月老，只因因果老。
    楼里连掌柜一共五个人。规矩只有两个字：沈砚。不问来路，不问去处。
    阿九是七世轮回的归来者，第八世没有今生来处；他自己不知道，只当自己是逃荒的。
    柳氏是三百年前被镇在后院井底的司命女吏，雨夜上门，全楼唯一喝茶不记账的人。
  rules:
    - 第一部完结前，正文不许出现「转世」「轮回」「前世」，也不许出现其他神话体系的专名。
    - 不许解释楼内名字的来历；不许出现「讲故事抵茶钱」；不许有战力升级、境界突破、打怪爽点。
    - 掌柜不知道的事，叙述与对白都不许知道；他一章台词不超过十句，每句不超过十二字。
    - 他一旦说了「喝茶」「坐」「沈砚」中任何一句，本章不再解释任何事。
    - 这一场只写一个时辰里的事，不许一句带过几天。
  places:
    - 名称: 望江楼·前厅
      说明: 柜台、茶桌、门口的灯笼都在这儿；夜里换白灯，白灯一亮就是另一边的生意
      方位: 一楼正中，门朝桥头
      内里: [柜台, 账台小柜, 茶桌, 门口, 灯下]
    - 名称: 望江楼·后院井台
      说明: 一口井在院子正中，井台石沿冰凉；井不可窥，是楼里没人明说的忌讳
      方位: 前厅后门出去
      内里: [井台, 辘轳, 柴堆, 灶房门口]
    - 名称: 望江楼·门口台阶
      说明: 阿九当初醒来的地方；白天有挑担的、卖豆腐脑的，墙根下蹲着逃荒人喝舍粥
      方位: 楼门外
  people:
    - 姓名: 阿九
      别称: [陈兄弟, 傻子]
      身份: 楼里的杂役，茶楼门口白日醒来的失忆者
      性格: 谨慎、老实、有点小聪明但不多；一次只看见一件事，不抒情，不总结
      口癖: 常说「我记得。」
      秘密: 他记得一些自己不该记得的事（别的城、别的庙），说出口才发觉不对
      目标: 把活干好，别叫人看出自己没有来处
      # ★ 需求（want vs need）：「结尾不可逆」的实质就在这里 ——
      #   他可以做到目标（活得像个正常人），代价是必须想起自己是谁。
      需求: 想有一个来处，又怕知道那个来处是什么
      红线: 不许替他破谜，不许让他解释自己
    - 姓名: 沈砚
      别称: [掌柜, 莫掌柜]
      身份: 望江楼掌柜，六十来岁，永远在擦一只紫砂壶
      性格: 话不多，每句都在点上；看似温和，实则不容置疑
      口癖: 招牌三句「喝茶。」「坐。」「沈砚。」
      秘密: 他等一个轮回了七世的人，等了很多年
      # ★ 柳氏三百年前就认得他（关系表里写着），所以她算知道；别人都不知道。
      #   这条「谁知道」决定了 blind_spots 给谁挂「有人在瞒事」，也决定了
      #   leak_check 拦不拦得住「替他说破」。空着 = 所有人都不知道 → 机制空转。
      知情者: [柳氏]
      目标: 让这个人自己想起来 —— 但不能由他说破
      # 他要的是「他自己想起来」；他真正缺的是「被原谅」——
      # 每逼进一步，欠下的就多一分，而他不能开口要。
      需求: 想被这个人原谅，但不能自己开口讨
      红线: 一章不超过十句台词，每句不超过十二字；不许讲道理、不许交代背景
    - 姓名: 阿贵
      别称: [六子]
      身份: 跑堂丫头，十五六岁，对外说是掌柜的闺女
      性格: 嘴比算盘快，一惊一乍，淄川腔，爱盘问新来的人
      口癖: 爱说「掌柜的，你捡回来个傻子！」
      秘密: 从不说「我梦见」，从不过生辰，从不说从前
      目标: 把客人伺候明白，顺便把新来的人问个底掉
    - 姓名: 老陈
      别称: [账房]
      身份: 账房先生，瘦得像根竹竿，算盘打得飞快
      性格: 认死理，一句顶人一句，冷下来的幽默都在他嘴上
      口癖: 「傻子账上不糊涂」
      秘密: 账本记因果两栏，左栏人欠楼、右栏楼欠人；只用干支，不写年号
      # 只有掌柜知道账本怎么记（账房归掌柜管），这是这栋楼的核心机密。
      知情者: [沈砚]
    - 姓名: 阿九
      别称: []
      身份: 后厨杂役，脸上一道疤
      性格: 不说话；你喊他，他抬眼看你一下，用动作回答
      口癖: 无（不许给对白）
      秘密: 疤的来历与「哑」的真相是全书最重的刀之一
    - 姓名: 柳氏
      别称: [白衣女人, 白衣客]
      身份: 雨夜上门的白衣女客，全楼唯一喝茶不记账的人
      性格: 台词永远是碎片：井、雨、白绫、水底看不见月亮；从不与人对答
      口癖: 只说自己的，说完就走
      秘密: 三百年前被镇在后院井底的司命女吏
      # 沈砚知道她的来历（他为她斟茶不记账），别人都不知道 ——
      # 所以只有沈砚能替她说破，而他恰好是那个「什么都知道却不说」的人。
      知情者: [沈砚]
      目标: 她要的不是活，是一个了结
      # 她要的是了结（可以是结束）；她真正缺的是一个「有人记得她」的证据。
      需求: 想有人替她记得，而不是替她了断
  relations:
    - { 甲: 沈砚, 乙: 阿九, 关系: 掌柜与杂役；他看阿九的眼神像看一个等了很久的人 }
    - { 甲: 沈砚, 乙: 柳氏, 关系: 三百年前就认得；他给她斟茶不记账 }
    - { 甲: 阿贵, 乙: 阿九, 关系: 跑堂与杂役；她最爱盘问他，也最先替他说话 }
  foreshadows:
    - { 编号: F1, 内容: 白衣客坐在灯下没有影子 }
    - { 编号: F2, 内容: 后院那口井，井不可窥 }
    - { 编号: F3, 内容: 账台小柜里横放着一排旧签、一格里还混着一支空白签 }
    - { 编号: F4, 内容: 掌柜看阿九的那个眼神 }
  details:
    - { 名称: 白灯笼, 说明: 戌时换上，就是另一边的生意开始了；鸡鸣收盏逐客 }
    - { 名称: 紫砂壶, 说明: 掌柜永远在擦它，擦壶就是他不说话的时候 }
    - { 名称: 账台小柜, 说明: 一格立着指头长的木签，一格横放旧的；立着那格里混着一支空白签 }
  # ★★★ 进度节点（2026-10-21 加）。这是"揭秘后移""结尾要有反转"的**唯一机关**。
  #   产品侧 `_nodes_text` 只把**当前节点**交给作家，并明说"后面的路还没走到、不许提前揭"
  #   （2026-10-14 为「第一天就想把谜底解开」修的）。但它依赖这张表：
  #   表里只有一步，就没有"层"可揭 —— 那正是望江楼之前的状况。
  #
  #   ⚠ 节点名**本身就是剧透**（`_nodes_text` 的注释里记着这条）：
  #     只给当前节点、不给后面节点的名字。所以这里写得克制，别在名字里写"真相"。
  #   ⚠ 每个节点的完成判据都必须含**一处不可逆的变化** —— 反转就是从这里长出来的，
  #     不是在文字上硬加一个转折（那在导出层就是"新增情节"）。
  progress:
    - id: N01
      名称: 白灯下的第一碗茶
      概要: >
        阿九在楼里干活，发现几样说不通的事（添不满的壶、没有影子的客人），
        但什么都问不出来；他手里还攥着一件不属于自己的东西。
      完成判据: >
        阿九至少主动试过一次（问、跟、或者偷偷验证），并且失败了；
        这一天结束时他知道了一件开场时不知道的事（哪怕只是「这楼里的人都在瞒我」）。
      状态: 进行中
    - id: N02
      名称: 后院的规矩
      概要: >
        楼里的人各自用不同的方式拦着他往后院去，拦法互相矛盾；
        他开始怀疑「不让去」这件事本身才是要紧的。
      完成判据: >
        他越过了一次界线（进了后院、碰了井台、偷看了账本，其中一样），
        并且付了代价（被发现、被罚、或者看见了不该看见的东西）。
      状态: 未开始
    - id: N03
      名称: 客人要的东西
      概要: >
        那位不记账的客人第一次开口要一样**具体的东西**（不是碎片，是一个要求），
        而这个要求只有阿九能办到 —— 别人都办不了。
      完成判据: >
        阿九答应了（或者明确拒绝了），从此他欠下或结下了一件未了的事；
        这一天的结尾，他的处境和早上不一样了。
      状态: 未开始
    - id: N04
      名称: 井台上的一句话
      概要: >
        关于那口井，第一次有人说出一整句话（此前只有碎片）；
        说的人为此付出了什么。
      完成判据: >
        阿九听到了那句完整的话，并且听懂了其中一半、误解了另一半；
        读者这时能猜到「他和这口井有关」，但他自己还不知道。
      状态: 未开始

  style:
    pov: 第一人称
    era: premodern
    sentence: >-
      明清白话底子（《水浒》《金瓶梅》那一路的说书人口气），**不是文言**，也不是现代书面语。
      句子短、动词多、形容词少；段长 15–35 字为主。
      短要靠在砍掉多余的话，不许靠砍虚词 —— 「在/着/了/的」省掉就成文言了（设定原文：
      "底子是明清白话，不是现代汉语，也不是文言"）。
      也不许用现代翻译腔（「被…勾出…轮廓」「一种…的存在」）充数。
    diction: 名词用当时的名字（银子、行李、时辰、去处、营生、事由）；山东味只做口音不做腔调
    dialogue: 中（每千字 12–17 句引号）；掌柜每句不超过十二字
    taboos: [轮回, 转世, 前世, 系统, 等级, 修为, 灵气, 情绪, 心理, 状态, 氛围, 空间, 维度]
    # ★ 这本书实测出来的写法约束（2026-10-21 真跑）：只对望江楼生效。
    #   以前它们混在通用提示词里，别的书也会读到「壶」「井台」这类无关道具。
    # ★ 这本书实测出来的写法约束（2026-10-21 真跑），分成两类。
    #   判据只有一句：**这是演员在一拍里能做/能不做的事吗？**
    #     · 能 → `actor_notes`（演员也读）；
    #     · 不能（是成品读起来该是什么样）→ `notes`（只有写作层读）。
    #   ⚠ 分这一刀的原因：`notes` 进「写作层规则.md」，演员读不到；
    #     而「每样最多复位三次」就算给了演员，他一拍里也数不出来，
    #     只会学会绕开那件东西 —— 那是把灵活性压掉，不是提高质量。
    # [EN] ★ This book's measured writing constraints (2026-10-21), split in two.
    # [EN] One test: **can an actor do or not do this inside one beat?**
    # [EN]   · yes -> `actor_notes` (actors read it)
    # [EN]   · no (it describes the finished prose) -> `notes` (writing layer only)
    # [EN] ⚠ `notes` goes into 写作层规则.md which actors never see; a per-beat rule like
    # [EN] "each prop resets at most three times" cannot be counted inside one beat anyway --
    # [EN] it just teaches the actor to avoid the prop.
    actor_notes:
      - >-
        掌柜的沉默不能只有一种形态：不许整章只会「不答」或「敲柜」，
        他的拒绝要换个方式给（推壶 / 抬下巴 / 看灯 / 换话题）。
    notes:
      - >-
        茶、水、壶、灯 这几样东西，同一章里每样最多复位三次（添上—喝掉—再添上算一回）；
        每次都必须是新信息：第一次读者发现不对，第二次有人试图对抗并失败，第三次它变了形。
      - >-
        这一章的异常必须都指向同一条线（井 / 影子 / 未了之事 三者之一），
        不许一件像鬼打墙、一件像物品有灵、一件像非人，各自指向不同解释。
cases:
  - id: mwl-01
    cut: 转折
    at: 第一部·第 1 章《沈砚》，第七夜
    story_time: "21:30"
    place: 望江楼·前厅
    present: [阿九, 沈砚, 柳氏]
    focus: [人物级写作约束, 细思极恐, 信息只给一半, 白描]
    previously: |
      阿九在楼门口台阶下醒来，没有包袱、没有干粮袋、鞋底也没磨穿，想不起任何一张亲人的脸，
      只有「阿九」两个字挂得住。他对照墙根下喝舍粥的逃荒人，给自己安了个逃荒的身份。
      掌柜沈砚端出一碗苦茶收留了他，说「阿九。忘得好。」
      他学着烧水、抹桌、认茶叶，认下了楼里几个人：账房老陈、后厨阿九、跑堂的阿贵。
      第三天他给一个金华府来的客商续茶，顺口说了句「金华北门外是不是有个兰若寺」，
      说完自己后背发毛 —— 他根本没去过金华。
      今夜是第七夜。
    scene_seed: |
      他起夜，从后院回屋，路过前厅。门还开着，掌柜正跟一个客人说话。
      那客人一身白衣，背对着他，看不清脸，也看不出是男是女。
      他这才发觉，门口挂的灯笼不知什么时候换成了白的。
    ground_truth:
      hard:
        - 不许出现「转世」「轮回」「前世」这三个词，也不许出现其他神话体系的专名（阎王、地府、阴间等）
        - 不许让阿九在这一场里弄明白自己是谁；他只能"说不出为什么"，不许"我明白了"
        - 不许解释白灯笼、井、空白签的来历；只许写看见，不许点破
        - 掌柜这一场台词不超过五句、每句不超过十二字；说了「喝茶」「坐」「沈砚」之后不再解释任何事
        - 不许让白衣客与阿九对答；她只说自己的碎片，说完就走
        - 不许用「我感到一阵恐惧」「瞬间」「这一刻」这类收束句，情绪只能落在动作与物件上
      beats:
        - 阿九看见门口灯笼换成了白的，愣了一下，没敢问。
        - 掌柜叫他去后院打壶新水；他应声，经过白衣客身边时瞟了一眼 —— 客人坐在灯下，没有影子。
        - 他手一抖，壶差点摔了；到后院井台摇辘轳，蹲在井边定了定神。
        - 他本想探头看一眼井，脖子伸到一半又缩回来 —— 说不出为什么，就是觉得不该看。
        - 白衣客起身走了，出门往桥那头去，听不见脚步声。
        - 掌柜收壶，忽然开口：「白天，是人间的生意。夜里，是另一边的。」放壶，说「喝茶。坐。」
        - 阿九问这到底是个什么地方；掌柜擦着壶顿了顿：「茶楼。也有人，管它叫两界驿。」再问，只两个字：「沈砚。」
      alternatives:
        - stance: 不写"没有影子"，只让井水晃出两张脸
          beats:
            - 阿九看见白灯笼，没敢问，掌柜叫他去打水
            - 经过白衣客身边时他什么都没看出来，只是觉得灯下的地太干净
            - 后院打水，水面晃，晃出两张脸——一张是他的
            - 他脖子伸到一半缩回来
            - 白衣客走了，掌柜给「两界驿」和「沈砚」
          excerpt: |
            井水上来，水面还在晃。他低头看，水里有两张脸。
            一张是他的。另一张，他抬眼看了一圈院子，院里没有人。
            他把水桶提得很稳，一步一步走回前厅，没敢再低头。
          why_valid: |
            把"没有影子"换成"水里多一张脸"，是同一件事的另一种写法：
            都做到了「看见一件不对劲的事、不解释、往下走」。
            它比原文更隐，但没多给信息，也没点破 —— 硬约束一条没踩。
        - stance: 白衣客先给一句碎片，信息分两次给
          beats:
            - 白灯笼、打水的吩咐照旧
            - 白衣客起身时留下一句碎片：「井底的月亮，是看不见的。」
            - 她走了，听不见脚步声
            - 阿九听不懂，但记住了这句话
            - 次日阿贵顺口说"那位客人从来不记账"，他才知道自己昨夜见的是什么
          excerpt: |
            白衣客站起来，衣袖从桌沿扫过。她走过他身边时停了一步。
            「井底的月亮，是看不见的。」
            说完就出门去了，往桥那头走。听不见脚步。
            他站在原地，把这句话在心里过了一遍，没懂。
          why_valid: |
            信息仍然只给一半：碎片本身不解释任何事，只是把"井"这条线埋得更实。
            它没有让白衣客与阿九对答（她说完就走），也没让阿九弄明白自己是谁 —— 硬约束全过。
      excerpt: |
        他应了一声，提着壶往后院去。经过那客人身边，眼角瞟了一下。
        客人坐在灯下。灯是白的。桌上、地上、椅背上，都铺着灯影。
        只有客人坐的那一块，干干净净，没有影子。
        他手一抖，壶盖磕在壶身上，响了一声。
        掌柜没抬头，还在擦他的壶。
        后院井台冰凉。他摇辘轳，绳子一圈一圈往上收，水桶上来，水面晃。
        他蹲在井边定了定神。月亮很好，井口黑洞洞的。
        他脖子伸到一半，又缩回来。说不出为什么，就是觉得，不该看。
        回前厅时白衣客已经起身。她出门往桥那头去，脚步很轻，轻到他听着听着就听不见了。
        掌柜把壶收进柜台，忽然开口：「白天，是人间的生意。夜里，是另一边的。」
        他把壶放下。「喝茶。坐。」
        阿九站着没坐。他问，这到底是个什么地方。
        掌柜擦着壶，顿了顿：「茶楼。也有人，管它叫两界驿。」
        阿九还想再问。掌柜抬起眼。
        「沈砚。」
      divergence_note: |
        这一场**必须接住的只有一条**：白灯 + 没有影子 + 「两界驿」+「沈砚」这四个信息，
        要按"看见 → 不说破 → 掌柜给一半"的顺序出来。
        其余都放开：白衣客说不说话、井边写多细、阿贵要不要在这时候插一句、阿九是站着还是坐下，
        都可以自由。**判断标准不是"像不像这段原文"，而是"有没有踩上面那六条硬约束"**。
