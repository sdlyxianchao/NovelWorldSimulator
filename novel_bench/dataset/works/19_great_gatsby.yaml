id: great_gatsby
title: 了不起的盖茨比
title_en: The Great Gatsby
author: F. S. 菲茨杰拉德
year: "1925"
country: 美国
language: en
category: 现代
medium: 出版
genres: [现代主义, 爱情, 阶层, 中篇]
representativeness: |
  美国现代文学的标杆。叙述者尼克既是旁观者又是参与者，所有情感都隔着一层玻璃去看；
  意象（绿光、衬衫、雨）承担了大部分意义。它检验的是"叙事距离"能不能被维持。
license: public_domain
bible:
  worldview: |
    一九二二年的长岛。西卵村住着新富，东卵村住着旧钱，中间隔着一道海湾。
    盖茨比在西卵的豪宅里每周末开派对，没人知道他从哪来；尼克是他的邻居，
    在纽约做债券生意，是黛西的表兄。黛西嫁给了汤姆·布坎南，
    一个从耶鲁毕业、有马球马和情妇的旧钱子弟。
  rules:
    - 第一人称，尼克叙述；他不评价，只记录，评价藏在细节的挑选里。
    - 物质要具体：车的颜色、衣服的料子、酒的种类，都要对得上年代。
    - 盖茨比说话有刻意的书面腔；汤姆说话粗鲁；黛西说话像在唱歌。
    - 这一场只写尼克家客厅这一个下午。
  places:
    - 名称: 西卵·尼克的小屋
      说明: 一栋小木屋，客厅里只有一张沙发和几把椅子
      方位: 长岛西卵
      内里: [客厅, 门廊, 厨房, 草坪]
    - 名称: 西卵·盖茨比的豪宅
      说明: 仿法式市政厅的建筑，草坪大得能办派对
      方位: 长岛西卵
    - 名称: 东卵·布坎南家
      说明: 红白相间的乔治式宅子，窗帘被风吹得鼓起
      方位: 长岛东卵
  people:
    - 姓名: 尼克
      身份: 叙述者，债券经纪人，黛西的表兄
      性格: 克制，观察细，习惯站在门口看别人
      口癖: 说话留有余地，爱说"我倾向于"
      秘密: 他也被这个阶层吸引，只是不肯承认
      目标: 过自己的日子，不欠人情
      红线: 不替人撒谎
    - 姓名: 盖茨比
      身份: 西卵的神秘富豪
      性格: 极度自律，也极度天真；为一个人重建了整个人生
      口癖: 叫她"old sport"，说话有一种排练过的从容
      秘密: 他的钱来路不正，他的名字也不是本名
      目标: 让黛西亲口说"我从没爱过汤姆"
      红线: 不许人说他配不上她
    - 姓名: 黛西
      身份: 汤姆的妻子，盖茨比旧日的恋人
      性格: 轻盈，悦耳，遇事就退；声音里有让人原谅她的东西
      口癖: 说话带笑，爱用"亲爱的"
      秘密: 她知道自己在逃什么
      目标: 保住现有的生活
      红线: 不许人逼她做选择
    - 姓名: 汤姆
      身份: 黛西的丈夫，旧钱子弟
      性格: 傲慢，粗暴，理直气壮地不忠
      口癖: 说话大声，爱说"我告诉你"
      秘密: 他在纽约有情人，车是黄色的
      目标: 保住自己的体面
      红线: 不许人碰他的家庭
  relations:
    - 甲: 尼克
      乙: 盖茨比
      关系: 邻居，也是唯一被盖茨比当作朋友的人
    - 甲: 盖茨比
      乙: 黛西
      关系: 五年前的情人，他等了她五年
    - 甲: 汤姆
      乙: 盖茨比
      关系: 丈夫与旧情人，见面即敌
  foreshadows:
    - 编号: F1
      内容: 海湾对岸的那盏绿灯，盖茨比每夜伸手去够
    - 编号: F2
      内容: 盖茨比堆起来的衬衫，是他向黛西展示的全部积蓄
    - 编号: F3
      内容: 汤姆那辆黄色的车，后来撞死了人
  details:
    - 名称: 绿灯
      说明: 东卵码头尽头的绿灯，隔着海湾看得见
    - 名称: 衬衫
      说明: 盖茨比从英国定做的衬衫，各种颜色堆成小山
    - 名称: 派对
      说明: 每周末的豪宴，乐队、香槟、几百个不请自来的人
  style:
    pov: 第一人称
    era: modern
    sentence: 长句，意象密集，句尾常留一个轻微的转折
    diction: 二十年代美语的中文对应：华丽而不油滑，物质名词具体
    dialogue: 高，对话短，留白多
    taboos: [手机, 电话, 咖啡(可), 分钟, 情绪, 状态, 压力, 心理创伤]
cases:
  - id: gg-01
    cut: 中段
    at: 第五章 尼克家客厅，盖茨比与黛西重逢
    story_time: "下午"
    place: 西卵·尼克的小屋
    present: [尼克, 盖茨比, 黛西]
    focus: [叙事距离, 意象, 尴尬的张力]
    previously: |
      尼克帮盖茨比约了黛西来家里喝茶，条件是不要剪他家的草坪。那天下午下着雨，
      盖茨比提前一小时到，穿着一身白法兰绒西装，紧张得把尼克的钟碰倒了。
      门铃响的时候，他几乎要夺门而出。
    scene_seed: |
      黛西站在门廊下，雨水从伞沿滴下来。盖茨比在客厅里，背对着门，
      两只手插在口袋里，装作在看窗外。尼克去开门。
    ground_truth:
      hard:
        - 不许让尼克在场目睹两人私语（他必须走开）
        - 不许让盖茨比直接说出'我等了你五年'
        - 不许让黛西当场决定离开汤姆
        - 不许用现代词（执念/破镜重圆 不许）
      beats:
        - 三人坐在客厅，谁都不说话；盖茨比说了一句关于天气的废话，脸涨得通红。
        - 尼克借口去拿茶，走到院子里站了半小时；回来时两人已经在笑。
        - 黛西脸上有泪痕，嗓音却比平时更轻快；盖茨比整个人亮了起来。
        - 他带她去看自己的房子，把一叠衬衫从柜子里扔到床上，一件接一件。
        - 黛西把脸埋进衬衫里哭，说"我从没见过这么美的衬衫"。
      excerpt: |
        我走了出去，在雨里站了半个钟头。回来的时候，他们已经不说话了，
        黛西脸上有泪痕，可她的声音比平时还要轻快。盖茨比站起来，
        整个人像换了一个人。他带她去看他的房子，把衬衫一件件往床上扔——
        薄的、厚的、条纹的、珊瑚色的。黛西把脸埋进去，哭了。
      divergence_note: |
        尼克必须始终在门外。这场戏的力量来自"他没看见的那半小时"；
        若让他坐在旁边看两人互诉衷肠，叙述距离就没了。
      alternatives:
        - stance: 盖茨比不带黛西看房子，只在尼克家把怀表拿出来（用时间代替排场）
          why_valid: 他要证明的是'时间没走'；一块表比一屋子衬衫更直接，也不违背他的性格。
          beats:
            - 盖茨比从口袋里摸出一块表，说这是他走那年买的
            - 黛西看着表，没有说话
            - 他说表还在走
            - 雨停了，窗外亮起来
