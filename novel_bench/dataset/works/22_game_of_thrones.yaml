id: game_of_thrones
title: 冰与火之歌·权力的游戏
title_en: A Game of Thrones
author: 乔治·R. R. 马丁
year: "1996"
country: 美国
language: en
category: 当代
medium: 出版
genres: [奇幻, 群像, 政治, 长篇]
representativeness: |
  当代群像史诗奇幻的代表。它用"视角人物"轮流叙述，每个人只知道一部分真相，
  读者比人物知道得多一点、又永远不够。它最适合检验"多视角下的信息边界"。
license: in_copyright_short_quote
bible:
  worldview: |
    维斯特洛大陆，七国。国王劳勃·拜拉席恩坐铁王座，王后瑟曦出身兰尼斯特家族。
    北境的临冬城由史塔克家族镇守，公爵奈德·史塔克是国王的老友。
    贵族之间联姻、结盟、背叛；冬天可能持续十年。七岁的布兰·史塔克喜欢爬墙，
    母亲凯特琳从不许他爬，他照爬不误。
  rules:
    - 没有绝对的主角光环。人会死，死得突然，且后果一直延续。
    - 每个视角人物只知道自己的那一部分，不许全知。
    - 语言要落到具体的物：皮毛、铁器、马匹、酒。
    - 这一场只写塔楼顶上这一小段时间。
  places:
    - 名称: 临冬城·残塔
      说明: 一座废弃的塔楼，外墙有裂缝，可以攀着石缝往上爬
      方位: 临冬城东北角
      内里: [塔顶, 破窗, 石阶, 屋檐]
    - 名称: 临冬城·大厅
      说明: 长桌、石墙、狼皮，家族议事的地方
      方位: 临冬城中央
    - 名称: 临冬城·神木林
      说明: 一片古老的鱼梁木，树叶暗红
      方位: 临冬城北侧
  people:
    - 姓名: 布兰
      身份: 临冬城公爵次子，七岁
      性格: 好奇，好动，爬墙时什么都不怕
      口癖: 说话直，爱问"为什么不能"
      秘密: 他梦见一只三眼乌鸦
      目标: 爬到最高的地方看一看
      红线: 不许人把他当小孩关起来
    - 姓名: 詹姆
      身份: 御林铁卫，王后的孪生兄弟
      性格: 傲慢，轻佻，出手极快；不在乎别人怎么看他
      口癖: 说话带笑，爱说"看看这个"
      秘密: 他与王后的关系
      目标: 保住家族与自己的位置
      红线: 不许人伤害瑟曦
    - 姓名: 瑟曦
      身份: 七国王后，兰尼斯特家的女儿
      性格: 骄傲，狠，护短；把家族看得比什么都重
      口癖: 说话低而慢
      秘密: 她的三个孩子都不是国王的
      目标: 让儿子坐上铁王座
      红线: 不许人碰她的孩子
    - 姓名: 奈德
      身份: 临冬城公爵，国王的老友
      性格: 正直，固执，重承诺
      口癖: 说话简短，爱说"冬天快来了"
      秘密: 他藏着关于一个孩子的承诺
      目标: 守住北境，护住家人
      红线: 不许人侮辱史塔克家的名誉
  relations:
    - 甲: 布兰
      乙: 詹姆
      关系: 孩子与王后的兄弟，一场意外把两人绑在一起
    - 甲: 詹姆
      乙: 瑟曦
      关系: 孪生姐弟，也是情人
    - 甲: 奈德
      乙: 瑟曦
      关系: 北境公爵与王后，互不信任
  foreshadows:
    - 编号: F1
      内容: 布兰爬墙时听见的声音，改变了整个维斯特洛
    - 编号: F2
      内容: 三眼乌鸦的梦，与北境的旧神有关
    - 编号: F3
      内容: 冰原狼的数目与史塔克孩子的数目一样
  details:
    - 名称: 冰原狼
      说明: 北境巨狼，史塔克家的家徽
    - 名称: 鱼梁木
      说明: 白树干、红叶子的古树，树上有脸
    - 名称: 铁王座
      说明: 上千把剑熔成的王座，坐着不舒服
  style:
    pov: 第三人称限知
    era: fantasy
    sentence: 中长句，细节密，动作写得实
    diction: 现代汉语，中世纪质感词（学士、铁卫、封臣）
    dialogue: 高，对话短促，各怀心思
    taboos: [手机, 电话, 咖啡, 分钟, 情绪, 状态, 压力, 心理阴影]
cases:
  - id: got-01
    cut: 高潮前
    at: 布兰爬上残塔，听见塔顶有人说话
    story_time: "午后"
    place: 临冬城·残塔
    present: [布兰, 詹姆, 瑟曦]
    focus: [信息边界, 视角限制, 危险逼近]
    previously: |
      国王一家到临冬城做客，城堡里到处是人。布兰照旧到处爬，
      母亲越是禁止，他越要爬到最高的地方。这一天他爬上东北角的残塔，
      从破窗翻进塔顶，忽然听见下面有人说话。
    scene_seed: |
      塔顶积着灰，风从破窗灌进来。布兰趴在楼板上，从缝隙往下看，
      看见两个人站在下一层的窗边。他认得其中一个的金头发。
    ground_truth:
      hard:
        - 不许让布兰听懂大人在说什么（他只有七岁）
        - 不许让詹姆表现出犹豫或悔意
        - 不许让布兰当场死去
        - 不许写超自然显灵（三眼乌鸦只能是梦）
      beats:
        - 布兰认出那是王后和她的孪生兄弟，两人靠得极近，说的话他听不太懂。
        - 他动了一下，瓦片响了一声；詹姆抬头，正好看见他的脸。
        - 詹姆走上楼来，一把抓住他的衣领，把他提起来，语气轻松得像在聊天气。
        - 瑟曦说"他看见了"，詹姆说"你把孩子宠坏了"，然后松手。
        - 布兰从塔上坠下，之后的事他都不记得了。
      excerpt: |
        詹姆一把抓住他的衣领，把他提了起来。"你在这儿做什么，小子？"
        他笑着，声音很轻。瑟曦在下面说："他看见了。"詹姆低头看了看布兰，
        说："你把孩子宠坏了。"然后他松开了手。
      divergence_note: |
        这一场必须从布兰的视角写：他听不懂大人在说什么，只看见动作和表情。
        若切到詹姆的内心解释动机，整段的恐怖就泄了。
      alternatives:
        - stance: 布兰没被发现，自己爬下去，之后几天一直在想那两个人的话
          why_valid: 原著里他被发现并推下塔；让他躲过去，是另一条同样成立的走法，后续张力来自'他知道了一个秘密'。
          beats:
            - 布兰趴在楼板上不敢动，听见下面的人走了
            - 他爬下塔，腿软得站不住
            - 晚饭时他盯着王后看，王后也看了他一眼
            - 他什么也没说，夜里睡不着
