id: crime_punishment
title: 罪与罚
title_en: Crime and Punishment
author: 陀思妥耶夫斯基
year: "1866"
country: 俄国
language: ru
category: 古典
medium: 出版
genres: [心理, 犯罪, 宗教, 长篇]
representativeness: |
  心理小说的源头之一。它把一次谋杀的"前因"写成几百页的自我辩论，
  把"行动"写成几页的慌乱。它检验的是一件事：能不能写出"一个人在说服自己"，
  而不是"一个作者在解释人物"。
license: public_domain
bible:
  worldview: |
    十九世纪六十年代的彼得堡。闷热、狭窄、租金昂贵；大学生住在阁楼般的出租屋里，
    靠典当度日。拉斯柯尼科夫是个穷大学生，自视甚高，写文章主张"非凡的人"有权越过道德。
    放高利贷的老太婆阿廖娜刻薄、多疑，她的妹妹丽扎维塔老实、受人欺负。
    城市里到处是酒馆、醉汉与争吵。
  rules:
    - 心理活动是主体，但必须写成"念头"，不是作者的评断。
    - 所有细节要落到物：斧头、门铃、典当的怀表、墙纸的颜色。
    - 人物说话时容易被自己的念头打断；句子常常说一半。
    - 这一场只写从楼梯口到血流出这一段。
  places:
    - 名称: 彼得堡·老太婆的公寓
      说明: 四层，走廊暗，门上包着铁皮
      方位: 干草市场附近
      内里: [楼梯, 走廊, 门厅, 客厅, 卧室]
    - 名称: 拉斯柯尼科夫的阁楼
      说明: 一间像棺材一样的屋子，斜顶，墙纸发黄
      方位: 一栋临街的旧楼顶层
    - 名称: 酒馆
      说明: 闷热，烟雾腾腾，有人在此醉倒
      方位: 干草市场街角
  people:
    - 姓名: 拉斯柯尼科夫
      身份: 穷困的大学生，前法律系学生
      性格: 聪明，骄傲，越想越极端的自我辩论者；行动时反而迟钝
      口癖: 内心反复自问"我敢不敢"
      秘密: 他已经把斧头准备好了
      目标: 证明自己属于"非凡的人"
      红线: 不许人把他归入"普通人"
    - 姓名: 阿廖娜
      身份: 放高利贷的老太婆
      性格: 刻薄，多疑，算得极精
      口癖: 说话带刺，爱说"年轻人"
      秘密: 她把钱藏在卧室墙后
      目标: 守住自己的钱
      红线: 不许人赖账
    - 姓名: 丽扎维塔
      身份: 阿廖娜的妹妹，替她干活
      性格: 老实，迟钝，逆来顺受
      口癖: 说话吞吞吐吐
      秘密: 她每天下午三点会出门一趟
      目标: 平平安安过日子
      红线: 不敢违抗姐姐
  relations:
    - 甲: 拉斯柯尼科夫
      乙: 阿廖娜
      关系: 典当者与债主，他恨她，也恨自己
    - 甲: 阿廖娜
      乙: 丽扎维塔
      关系: 姐妹，一个支使一个被支使
    - 甲: 拉斯柯尼科夫
      乙: 丽扎维塔
      关系: 他原本没打算杀人，她是意外
  foreshadows:
    - 编号: F1
      内容: 他梦见一匹被抽打的老马，醒后仍觉得有人在哭
    - 编号: F2
      内容: 门铃的声音，后来在他脑子里响了几百遍
    - 编号: F3
      内容: 他听见别人说丽扎维塔三点会出门，这句话改了时间表
  details:
    - 名称: 斧头
      说明: 从厨房偷的斧头，藏在门房的大衣底下
    - 名称: 怀表
      说明: 他父亲的旧怀表，拿去典当
    - 名称: 门铃
      说明: 门上包铁皮，按铃的声音很响
  style:
    pov: 第三人称限知
    era: premodern
    sentence: 长句，状语叠着状语，念头一句接一句，句尾常断
    diction: 十九世纪俄国小说的中文译笔：具体、拥挤、少比喻
    dialogue: 中，对话常被打断或答非所问
    taboos: [手机, 电话, 咖啡, 分钟, 情绪, 状态, 压力, 心理创伤]
cases:
  - id: cp-01
    cut: 高潮前
    at: 第一部 拉斯柯尼科夫站在老太婆门前
    story_time: "傍晚"
    place: 彼得堡·老太婆的公寓
    present: [拉斯柯尼科夫, 阿廖娜, 丽扎维塔]
    focus: [心理独白, 行动细节, 悬念]
    previously: |
      拉斯柯尼科夫交不起学费，靠典当过日子，恨透了那个放高利贷的老太婆。
      他在酒馆里听见有人说，老太婆的妹妹丽扎维塔每天下午三点会出门。
      此后几天，他吃不下睡不着，脑子里反复出现同一个念头。
      这一天傍晚，他从门房的大衣底下摸出斧头，上了楼。
    scene_seed: |
      四层。走廊暗得看不清墙纸的花。他站在门前，听见里面有人在哼歌。
      他按了铃。铃声在里面响起来，很久没有人应。他又按了一次。
    ground_truth:
      hard:
        - 不许让拉斯柯尼科夫行凶时从容利落（他必须慌乱）
        - 不许让丽扎维塔不在场（她提前回来是必然）
        - 不许让他在现场被抓住
        - 不许写现代法医细节
      beats:
        - 门开了一条缝，老太婆先看他的脸，再看他手里有没有东西。
        - 他说要典当，把怀表递进去；她侧身让他进门，转身去拉窗帘借光。
        - 他忽然意识到此刻背对着他的就是机会，身体却动不了。
        - 斧头落下的时候，他听见的不是叫声，而是自己心跳的声音。
        - 丽扎维塔提前回来了，站在门口；他连她也杀了，然后开始翻箱倒柜，越翻越慌。
      excerpt: |
        他等她转过身去。老太婆拉开窗帘，凑着光看那块怀表。就在这一刻，
        他从口袋里掏出斧头，几乎是机械地、用尽全身力气劈了下去。
        他没有听见叫声，只听见自己的心跳。后来他站在一摊血里，
        想起丽扎维塔提前回来了——那件事不在计划里。
      divergence_note: |
        重点不是血腥，而是"他以为自己准备好了，其实没有"。
        若写成冷静利落的行凶，人物就成了一台机器，小说也就没有了。
      alternatives:
        - stance: 他在门外站了很久，最后没有敲门，转身下楼（念头没能变成行动）
          why_valid: 整部小说的前半就是'他敢不敢'；让他这次不敢，是同一心理的另一条路，且更贴'他以为自己准备好了，其实没有'。
          beats:
            - 他站在门前，听见里面有人在哼歌
            - 他抬起手，又放下
            - 他转身下楼，走到街上才发现自己在发抖
            - 回到阁楼，他躺下，一夜没睡
