id: weicheng
title: 围城
title_en: Fortress Besieged
author: 钱锺书
year: "1947"
country: 中国
language: zh
category: 现代
medium: 出版
genres: [讽刺, 婚恋, 知识分子, 长篇]
representativeness: |
  中国现代讽刺小说的代表作，也是"比喻"这项手艺的极限样本。写一群留洋回来的知识分子
  在客厅里互相掂量，句句是机锋。它考的是一句话里能不能同时装下客气、试探和挖苦。
license: in_copyright_short_quote
bible:
  worldview: |
    民国二十六年前后，上海、北平一带。留洋回来的年轻人挤在客厅与大学里，
    文凭是真的假的都算资历，谈吐比学问要紧。苏文纨是大家闺秀，留法回来，家里客厅夜夜有客；
    赵辛楣在美国留过学，自视甚高，一心要娶苏文纨；方鸿渐从欧洲回来，
    揣着一张来路说不清的文凭，嘴皮子利，心里虚。
  rules:
    - 全篇靠对话与比喻推进，不许写大段心理分析。
    - 讽刺要藏在礼貌里：话越客气，刀越快。
    - 人物各有腔调：苏文纨拿腔、赵辛楣逞才、方鸿渐油滑、唐晓芙直白。
    - 这一场只写客厅里这一壶茶，不许切到别处。
  places:
    - 名称: 苏家·客厅
      说明: 法式沙发，一架钢琴，晚上总有人来吃茶
      方位: 上海法租界
      内里: [沙发, 钢琴, 茶几, 阳台]
    - 名称: 三闾大学·教职员宿舍
      说明: 战时后方的简易宿舍，墙薄得能听见隔壁说话
      方位: 湖南平成
    - 名称: 咖啡馆
      说明: 上海的小咖啡馆，留学生在这里碰头
      方位: 霞飞路
  people:
    - 姓名: 方鸿渐
      别称: [鸿渐, 方先生, 方鸿渐]
      身份: 留洋归国的青年，靠岳家资助出的国
      性格: 聪明而不肯用功，嘴上有本事，心里没主张；怕得罪人，又忍不住刻薄
      口癖: 爱说"不瞒你说"，说话爱绕
      秘密: 他的博士文凭是买的，从没跟人提过
      目标: 在这些人里混得体面
      红线: 不许人问他的论文写的是什么
    - 姓名: 苏文纨
      别称: [文纨, 苏小姐, 苏文纨]
      身份: 苏家大小姐，留法归来
      性格: 矜持，拿腔作势，喜欢被围绕；心里算得极清
      口癖: 说话带"我们法国"，爱用法文词
      秘密: 她真正中意的是方鸿渐，却不肯先说
      目标: 让方鸿渐先开口
      红线: 不许人在她的客厅里失了体统
    - 姓名: 赵辛楣
      别称: [辛楣, 赵先生, 赵辛楣]
      身份: 留美学生，苏文纨的追求者
      性格: 自负，爱逞才，见了情敌就忍不住要压一头
      口癖: 爱说"敝国""在美国的时候"
      秘密: 他其实没拿到学位，只读完了硕士课程
      目标: 把方鸿渐比下去
      红线: 不许人抢他的话头
    - 姓名: 唐晓芙
      别称: [晓芙, 唐小姐, 唐晓芙]
      身份: 苏文纨的表妹，还在读书
      性格: 天真直率，想到什么说什么，最不耐烦虚伪
      口癖: 爱说"真的呀"
      秘密: 她一眼看出方鸿渐在装
      目标: 玩得开心，不想被安排
      红线: 不许人拿她当小孩哄
  relations:
    - 甲: '赵辛楣'
      乙: '方鸿渐'
      关系: '情敌，一个明着来一个暗着躲'
    - 甲: '苏文纨'
      乙: '方鸿渐'
      关系: '她等他开口，他装不懂'
    - 甲: '唐晓芙'
      乙: '方鸿渐'
      关系: '他一见就喜欢，她一眼看穿'
  foreshadows:
    - 编号: 'F1'
      内容: '那张"克莱登大学"的文凭，是方鸿渐一生的软肋'
    - 编号: 'F2'
      内容: '苏文纨客厅里的钢琴，谁弹谁就欠她一份人情'
    - 编号: 'F3'
      内容: '赵辛楣说"敝国"，日后成了众人背后的笑柄'
  details:
    - 名称: '文凭'
      说明: '一张烫金的证书，来路说不清'
    - 名称: '法文诗'
      说明: '苏文纨抄在扇面上的几行诗'
    - 名称: '茶'
      说明: '苏家客厅里的下午茶，点心是洋行的'
  style:
    pov: 第三人称限知
    era: modern
    sentence: 长句套短句，比喻密集而刁钻
    diction: 三十年代书面语夹欧化句法，雅俗混用
    dialogue: 很高，几乎全靠对白
    taboos: [手机, 电话, 咖啡(可), 分钟, 情绪, 状态, 压力, 心理建设]
cases:
  - id: wc-01
    cut: 中段
    at: 苏家客厅的茶会，赵辛楣初见方鸿渐
    story_time: "下午"
    place: 苏家·客厅
    present: [方鸿渐, 苏文纨, 赵辛楣, 唐晓芙]
    focus: [对话机锋, 人物腔调, 潜台词]
    previously: |
      方鸿渐从欧洲回国，在苏文纨家里认识了她。苏文纨对他有意，常请他来吃茶。
      这天她又请了表妹唐晓芙，还有刚从美国回来的赵辛楣。赵辛楣一直以为方鸿渐是情敌，
      进门时脸色就不大好。
    scene_seed: |
      茶刚沏上。赵辛楣把帽子放在沙发扶手上，眼睛在方鸿渐身上转了一圈，
      忽然问他在欧洲哪一所大学。苏文纨低头拨茶盖，唐晓芙咬着点心看他们。
    ground_truth:
      hard:
        - 不许让方鸿渐承认文凭是买的
        - 不许让苏文纨当场表白
        - 不许出现现代词（社交/情商/内卷 不许）
        - 不许让赵辛楣动手或拍桌子
      beats:
        - 方鸿渐含糊说了个地名，赵辛楣立刻用法文接了一句，问他的导师是谁。
        - 方鸿渐听不懂，笑着把话岔到天气上；苏文纨替他圆了一句，说"方先生是学哲学的"。
        - 赵辛楣不肯放，转而大谈美国的学风，句句都在暗示"欧洲那些野鸡大学"。
        - 唐晓芙忽然说"赵先生讲了半天，倒像在背履历"，众人一笑，赵辛楣脸上挂不住。
        - 散场时方鸿渐送唐晓芙到门口，心里发热，回头看见苏文纨在窗后看着他。
      excerpt: |
        赵辛楣道："方先生在巴黎哪一系？"鸿渐道："我是随便听听的。"辛楣道："那么导师是谁？"
        鸿渐一时答不上来，笑道："天气倒热起来了。"苏文纨忙道："方先生是研究哲学的。"
        唐晓芙忽然道："赵先生说了半天，倒像是背履历。"辛楣脸上一红。
      divergence_note: |
        这一场不许有人拍桌子。所有的敌意都要裹在客气话里；
        唐晓芙那一句之所以有效，正因为它太直，破了这屋子的规矩。
      alternatives:
        - stance: 赵辛楣不追问学历，转而大谈美国校园生活，把方鸿渐晾在一边
          why_valid: 他的目的是压人一头，不一定要抓住把柄；用'说自己的事'来压人，更像他这种自负的人。
          beats:
            - 赵辛楣问了一句，见方鸿渐含糊，就不再问
            - 他开始讲美国的宿舍、橄榄球、教授的怪癖
            - 满座只能听他说，方鸿渐插不上嘴
            - 唐晓芙听得打哈欠，苏文纨替她圆了一句
