# 影视剧集案例库

琅琊榜:
  媒介: 电视剧
  类型标签: 权谋、复仇、古装
  可学点:
    - 权谋布局精妙
    - 人物关系复杂但清晰
    - 节奏把控精准
  playbook映射:
    - 权谋布局
    - 草蛇灰线
  备注: 权谋剧的标杆

庆余年:
  媒介: 小说/电视剧
  类型标签: 穿越、权谋、喜剧
  可学点:
    - 穿越设定的现代视角
    - 权谋与喜剧的平衡
    - 世界观宏大但不混乱
  playbook映射:
    - 期望鸿沟
    - 换地图节奏
  备注: 穿越文的典范

三体:
  媒介: 小说
  类型标签: 科幻、硬核、末日
  可学点:
    - 硬科幻设定
    - 宏大叙事
    - 人性探讨
  playbook映射:
    - 世界观构建
    - 伦理探讨
  备注: 中国科幻的里程碑