# 古典文学案例库（设计稿 §8.3）

聊斋志异:
  媒介: 小说集
  类型标签: 志怪、灵异、世情
  可学点:
    - '记异如记常"的笔法'
    - 短篇结构精悍
    - 人物刻画传神
  playbook映射:
    - 志怪笔法
    - 起承转合
  备注: 灵异题材的典范

红楼梦:
  媒介: 长篇小说
  类型标签: 世情、言情、家族
  可学点:
    - 草蛇灰线的伏笔技巧
    - 人物众多但个性鲜明
    - 日常细节中的戏剧张力
  playbook映射:
    - 草蛇灰线
    - 立主脑减头绪
  备注: 世情小说的巅峰

水浒传:
  媒介: 长篇小说
  类型标签: 英雄、武侠、群像
  可学点:
    - 群像塑造技巧
    - 单元剧结构
    - 动作描写
  playbook映射:
    - 英雄之旅
    - 单元剧节奏
  备注: 群像小说的典范

三国演义:
  媒介: 长篇小说
  类型标签: 历史、权谋、战争
  可学点:
    - 权谋布局
    - 战争场面
    - 人物对比
  playbook映射:
    - 三幕结构
    - 权谋布局
  备注: 历史小说的典范