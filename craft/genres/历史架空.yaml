# 历史架空类型档案

类型: 历史架空
冲突偏好:
  主引擎: 权力斗争
  副引擎: 家国情怀
  禁用引擎: 现代价值观强行植入
节奏模板:
  张力曲线: medium
  单元长度: [5, 10]
  高潮间隔: 7
钩子库:
  - 朝堂风云
  - 边关告急
  - 宫廷秘闻
  - 民间疾苦
爽点模式:
  - 运筹帷幄
  - 力挽狂澜
  - 权倾朝野
  - 名留青史
背景呈现:
  世界展开: 宏大叙事
  设定密度: 中-高
人物原型库:
  - 帝王
  - 谋臣
  - 将军
  - 民间奇人
毒点红线:
  - 历史常识错误
  - 现代词汇穿越
  - 逻辑漏洞
playbook映射:
  - 三幕结构
  - 权谋布局
  - 草蛇灰线
案例参照:
  - 琅琊榜
  - 庆余年
  - 雍正王朝
风格建议:
  句长: 中长句为主
  叙事距离: 第三人称全知
  文言适度: 增加古韵
  对话占比: 约四成