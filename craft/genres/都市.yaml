# 都市类型档案

类型: 都市
冲突偏好:
  主引擎: 现实困境 vs 理想
  副引擎: 人际关系/职场
  禁用引擎: 超自然力量（除非都市异能流派）
节奏模板:
  张力曲线: medium
  单元长度: [3, 7]
  高潮间隔: 5
钩子库:
  - 职场危机
  - 感情纠葛
  - 家庭矛盾
  - 意外机遇
爽点模式:
  - 打脸装逼
  - 事业成功
  - 感情圆满
  - 逆袭翻身
背景呈现:
  世界展开: 贴近现实
  设定密度: 低
人物原型库:
  - 草根逆袭者
  - 商界精英
  - 青梅竹马
  - 贵人相助
毒点红线:
  - 三观不正
  - 过度YY
  - 逻辑硬伤
playbook映射:
  - 现实主义笔法
  - 人物弧光
  - 期望鸿沟
案例参照:
  - 欢乐颂
  - 都挺好
  - 我的前半生
风格建议:
  句长: 短句为主
  叙事距离: 贴近人物
  生活细节: 真实可感
  对话占比: 约五成