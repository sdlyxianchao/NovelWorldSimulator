# 科幻类型档案

类型: 科幻
冲突偏好:
  主引擎: 科技与人性冲突
  副引擎: 生存危机
  禁用引擎: 魔法/超自然（需科学解释）
节奏模板:
  张力曲线: medium
  单元长度: [4, 8]
  高潮间隔: 6
钩子库:
  - 科技突破
  - 未知威胁
  - 伦理困境
  - 时间悖论
爽点模式:
  - 科技碾压
  - 智慧解题
  - 绝境求生
  - 真相揭露
背景呈现:
  世界展开: 硬核设定
  设定密度: 高
人物原型库:
  - 科学家
  - 军人
  - 普通人视角
  - AI/异星生命
毒点红线:
  - 科学常识错误
  - 设定前后矛盾
  - 伪科学解释
playbook映射:
  - 世界观构建
  - 悬念引擎
  - 伦理探讨
案例参照:
  - 三体
  - 流浪地球
  - 基地
风格建议:
  句长: 中句为主
  叙事距离: 第三人称
  技术描写: 精确但不堆砌
  对话占比: 约三成