# 言情类型档案

类型: 言情
冲突偏好:
  主引擎: 感情障碍
  副引擎: 家庭/社会压力
  禁用引擎: 纯粹外部冲突（需与感情线挂钩）
节奏模板:
  张力曲线: flat → medium → roller
  单元长度: [3, 6]
  高潮间隔: 4
钩子库:
  - 误会错过
  - 身份秘密
  - 情敌出现
  - 生死考验
爽点模式:
  - 甜蜜互动
  - 误会解除
  - 表白成功
  - 圆满结局
背景呈现:
  世界展开: 以感情线为中心
  设定密度: 低
人物原型库:
  - 男女主角
  - 情敌
  - 闺蜜/兄弟
  - 长辈阻挠
毒点红线:
  - 三观不正
  - 圣母/渣男
  - 无脑恋爱
playbook映射:
  - 感情曲线
  - 误会制造
  - 甜蜜暴击
案例参照:
  - 何以笙箫默
  - 致我们终将逝去的青春
  - 东宫
风格建议:
  句长: 短句为主
  叙事距离: 贴近人物内心
  情感细腻: 心理描写丰富
  对话占比: 约五成