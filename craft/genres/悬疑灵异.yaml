# 悬疑灵异类型档案（设计稿 §8.2）

类型: 悬疑灵异
冲突偏好:
  主引擎: 未知 vs 秩序
  副引擎: 人心
  禁用引擎: 升格神魔大战
节奏模板:
  张力曲线: medium
  单元长度: [3, 6]
  高潮间隔: 5
钩子库:
  - 反常细节
  - 未解之谜
  - 时限压力
  - 知情人不语
爽点模式:
  - 解谜揭晓
  - 伏笔回收
  - 对照反转
  - 细思极恐
背景呈现:
  世界展开: 渗透式
  设定密度: 低-中
人物原型库:
  - 守秘人
  - 闯入者
  - 知情人
  - 将信将疑者
毒点红线:
  - Jump scare 堆砌
  - 大段设定独白
  - 鬼怪全知全能
playbook映射:
  - 草蛇灰线
  - 志怪笔法
  - 悬念引擎
  - 突转与发现
案例参照:
  - 聊斋志异
  - 深夜书屋
  - 隐秘的角落
风格建议:
  句长: 中短句为主
  叙事距离: 贴近人物限知视角
  氛围营造: 冷笔白描，留白多于渲染
  对话占比: 约四成