# 玄幻修仙类型档案

类型: 玄幻修仙
冲突偏好:
  主引擎: 力量层级冲突
  副引擎: 宗门/家族利益
  禁用引擎: 纯粹感情纠纷（需与力量体系挂钩）
节奏模板:
  张力曲线: roller
  单元长度: [5, 10]
  高潮间隔: 8
钩子库:
  - 境界突破
  - 秘境开启
  - 天材地宝现世
  - 强敌来袭
爽点模式:
  - 打脸逆袭
  - 宝物到手
  - 境界突破
  - 以弱胜强
背景呈现:
  世界展开: 层层递进（换地图）
  设定密度: 中-高
人物原型库:
  - 天才主角
  - 落魄前辈
  - 世家公子
  - 神秘女子
毒点红线:
  - 升级过快无铺垫
  - 配角智商下线
  - 无脑开后宫
playbook映射:
  - 英雄之旅
  - 升级反馈环
  - 换地图节奏
  - 黄金三章
案例参照:
  - 凡人修仙传
  - 遮天
  - 一念永恒
风格建议:
  句长: 中句为主
  叙事距离: 第三人称限知
  战斗描写: 动态+环境互动
  对话占比: 约三成