# 人物与对话 playbook（第五架：把「人物」当成可操作的手艺）
#
# 为什么单开这一架
# --------------
# 另外四架管"故事怎么讲"（章法 / 网文方法论 / 编剧正典 / 剧作与舞台），
# 但**没有一架专讲"人怎么立起来、话怎么说"** —— 而本项目每天要产出的是
# 大量的**台词**（演员决策输出的就是台词）。
# 前面几轮报的"所有人自说自话""每个人都在做自己的小事""台词像念设定"，
# 缺的正是这一架。
#
# 来源
# ----
# ① 对一部**番茄连载的年代奇幻作品**（群像 + 反差人设路线）做的**手法拆解** ——
#    它的长处不在文笔而在**人物辨识度**：一院子人都能被一眼区分，靠的是
#    "表层身份 × 真实本事"的反差、"说话方式即身份"、以及"弱者用对方的逻辑反打"。
#    ⚠ 本项目的老规矩：**程序与具体作品解耦** —— 所以这里不写书名、不写作者，
#      只留"这类作品的做法"（`verify_generic_project` 查的就是这件事）。
# ② 台词理论：斯坦尼（规定情境 / 行动线）、贝克《剧作技巧》的"对白是行动"、
#    麦基"对白是冰山一角"、老舍"人物一句话立起来"。这些是**公开的理论**，
#    与 ① 那份拆解互为印证。
#
# ⚠ 版权红线（与其它 playbook 同一条，而且这里更要紧）
# --------------------------------------------------
#   这一架写的是**方法**，不是台词。全篇**不含任何原著句子**，
#   只有"这门手艺怎么做"的描述性文字。判据 `verify_craft` 有一条专门查这件事
#   （书架上不许出现连着的长句引用）。**运行时也绝不把原文喂给模型。**
#
# 这一架的读者
# ------------
#   演员（说话的人）· 小说作家（写人）· 剧作者（写进剧本）·
#   语言审校（查"像不像这个人说的话"）· 复盘（看人物弧光）

名称: 人物与对话
来源: 对一部番茄连载作品的手法拆解（反差人设 / 说话即身份 / 弱者反打）+ 斯坦尼·贝克·麦基·老舍的台词论
适用类型: 全部（这是"人"那一层的手艺，与题材无关）

反差要撞给读者看:
  原理: >
    一个让人记住的人物，写法是"表层给一个印象、真实给一个意外"，但这个意外
    不能只写在人物卡里 —— 它必须**在戏里被撞一次**。读者信的不是设定，是
    "别人以为他是什么样 / 他其实是什么样"这两件事在一场戏里对上的那一下。
    反面写法：设定写着"深藏不露"，戏里从头到尾没有一处让人看到他藏着什么。
  适用: 人物出场、人设建立、单元剧的每一条人物线
  提示词: "让这一场里有人**撞上**他藏着的那一面 —— 别人按表层印象对他，他用真实的一面回过去。只写印象不撞，等于没写这个人。"

说话方式就是身份:
  原理: >
    区分一个人物最省力、最不靠旁白的办法，是让**他的说话方式**带上他的来历：
    句子的长短、语速、用不用行话、爱不爱绕、先说什么后说什么。
    同一个人物，如果把他一句台词换给另一个人说也毫不违和，那句话就是白写的。
    判定标准（自问）：**这一句能不能换个人说？** 能换 = 还没写到人身上。
  适用: 台词写作、人物出场、群像戏
  提示词: "写之前先定这个人怎么说话：句子多长、说不说行话、急还是慢、爱不爱把话说完。这一句**换给别人说就不成立**才算写到他了。"

性格靠对外部规则的态度:
  原理: >
    不要用形容词写性格（"他憨厚""她泼辣"），要写**他对某个外部规则的具体态度**：
    谁定了一个规矩，他是照做、绕过去、还是当场掀了它；
    为了合群他改了什么名字、藏了什么东西。
    一个"为了不被怀疑把名字改掉"的动作，比十句"他为人谨慎"都写得清。
    本项目的演员每拍只能输出一个动作或一句台词 —— 所以这门手艺不只是"更高级"，
    它**本来就是唯一写得进去的形态**。
  适用: 人物塑造、台词、动作设计
  提示词: "别交代他的性格。给他一个**跟规矩较劲的具体动作**：改了口径、藏了东西、少说了一句、多问了一句。让读者从那个动作里自己看出来。"

一句台词办四件事:
  原理: >
    好台词的信息密度不靠长，靠**同时交代多层**：这一句里可以同时有
    "我的资历""我认什么规矩""我怎么看你""我凭什么站在这儿"。
    写这类台词的方法是把**权力关系**放在信息前面 ——
    他要说的那件事（东西还我）只是载体，真正在说的是"你我谁在谁上面"。
    反过来：一句只传递了情节信息的台词，读起来就是"念设定"。
  适用: 交锋戏、压制戏、谈判、长辈对晚辈
  提示词: "这一句台词除了那件要说的事，再带上：他凭什么、他认什么规矩、他怎么称呼对方。**不要为了交代这些而加长句子** —— 让它们藏在用词和称谓里。"

弱者用对方的逻辑反打:
  原理: >
    小孩、老人、下人、外乡人这类"位置低"的人物，写得好不好全看他的台词是不是
    **顺着对方的道理把对方逼回去**。撒泼、哭闹、说狠话，都只是弱；
    而"你要我按规矩来，那按规矩本该是什么样"—— 这一下是最强的，因为它
    借的是对方自己立的规矩，对方没法反驳，还显得是他自己理亏。
    写法：先找出**对方最在意的那条规则或说法**，再让弱者用它去量对方。
  适用: 弱者发声、护人、被逼到墙角、孩子与大人对戏
  提示词: "他是弱者：**不要让他撒泼或放狠话**。让他顺着对方最在意的那个道理往回过 —— 用对方的规矩量对方。句子要短，越短越有力。"

群像靠执念分层:
  原理: >
    一群人在同一件事上【各自】露出麻烦，是群像的基本功。
    做法：先定一件所有人共同面对的事（躲、藏、凑钱、赶路），
    再给每个人一个**自己的执念**，让同一件事在每个人身上长出不同的具体麻烦 ——
    "要藏的是同一件，打湿他的是他最爱惜的那个东西，露馅的是他最不肯将就的那一处"。
    凡是"一群人做同一件事、表现也一样"的段落，就是没分层。
  适用: 群像戏、集体行动、一个院子里的人、一队人马
  提示词: "这一场是群像：给他们**同一个处境、不同的执念**。让同一件麻烦在每个人身上砸到不同的地方 —— 有人丢脸、有人丢钱、有人丢的是体面。不许两个人反应相同。"

口癖来自职业与处境:
  原理: >
    口头禅不是贴上去的标签，是从**他靠什么吃饭、怕什么**上长出来的：
    管纪律的人说"要报关、要走手续"，算账的人张口就是数目，
    行医的人拿身体作比，手艺人拿家伙作比。
    这样长出来的口癖，一开口就把职业、处境、安全感（他在什么上才踏实）全带出来了。
  适用: 台词、人物卡的口癖字段、群像
  提示词: "他的口头禅要从他**靠什么吃饭、怕什么**里长出来 —— 用他那一行的词说话（数目、手续、火候、分寸、规矩），不要用通用感叹词凑口癖。"

用旁观者拆解代替作者夸:
  原理: >
    想让读者觉得某个角色厉害，**别让作者去夸**：让另一个也懂行的人当场把他刚做的事
    一步步拆开说一遍（先做了什么、又借了谁的势、最后收在哪儿）。
    这一手同时办三件事：证明被拆的人确实有手段、显出拆解的人也聪明、
    还把刚才那段戏重讲了一遍（读者不费力就懂了）。
    反面写法：作者直接下判断（"他很聪明"），读者只能信，不能服。
  适用: 智斗、复盘、长辈点评晚辈、高手过招
  提示词: "想让谁显得厉害，就**让另一个懂行的人当场复述他刚才的步骤**（第一步试探、第二步借势、第三步收网）。不要写'他很机敏'这类判断句。"

称呼一变关系就变:
  原理: >
    同一个人在不同人的嘴里该有不同的称呼，称呼的变化就是**关系的刻度**：
    正式场合用身份、亲近了往下叫、翻了脸改回生分的叫法、改口的那一刻就是转折。
    一场戏里称呼的跳动，往往比旁白解释"他们关系变了"更可信。
  适用: 人物关系、称谓考据的落地、关系转折的戏
  提示词: "让他**怎么称呼对方**跟着关系走：刚认识用身份、熟了才用亲近的叫法、翻脸立刻改回生分的。要写关系变化，就让他**改一次口**。"

停顿与不答也是台词:
  原理: >
    该接而不接、答非所问、用一声"嗯"或一个动作带过去 —— 这些**没说出口的**，
    往往比说出口的更清楚（麦基说的"对白是冰山露出水面的那一角"）。
    写法上它还给整场戏留了气口：每句都接得很满的对话，读起来是两个人念稿。
    本项目的行动协议里本来就有这一条（应付过去、干脆不答，都比长篇大论像人），
    这一条目给它补的是理论依据与判断标准。
  适用: 台词、沉默、回避、隐藏秘密的戏
  提示词: "该他接的时候，允许他**不接**：反问、岔开、只做一个动作、嗯一声。**不说也是一种回答** —— 把它用在「他有东西瞒着」的地方，比让他解释更清楚。"

话长短由处境定:
  原理: >
    同一个人在不同处境下该有不同的"话量"：有求于人时长、心里有底时短、
    急着走时短、想拖住对方时长。**一律说得一样多**，读起来就是作者在按字数配台词。
    可操作的一条：紧张时句子变短、话变碎；他占了上风就能说完整的句子。
  适用: 台词节奏、交锋、审问、谈判
  提示词: "让他**话的长短跟着处境走**：落了下风就说半句、抢话、断句；占了上风才把一句说完整。"

口头语得有出处:
  原理: >
    "他有个口癖"是不够的，口癖要有**它为什么长在他身上**的来处（哪一年的事、
    谁教他的、哪一行带的），以及**什么时候他不用它**（急了、对长辈、对上头）。
    只用不解释，读者会当成作者的偷懒；有来处、有例外，才是这个人。
  适用: 人物卡、口癖字段、人物出场
  提示词: "口癖要写得出它从哪来、以及**他在什么人面前不用它** —— 只在最放松的人面前才冒出来的那句话，比句句都带着它更像人。"

# ──────────────────────────────────────────────────────────────────
#  第六组：**怎么说才像个活人**（2026-10-12 加，用户点名）
#
#  用户原话的意思：真人说话会犹豫、不是每句都回应、速度不会太快、
#  说话习惯由性格决定；而"很多 AI 生成的"对白**没有卡顿、速度很快、
#  从不犹豫**，还**很容易吼**，一听就不是真人。
#
#  ⇒ 上面十条讲的是"这句话该有谁的味道"（**内容层**），这一组补的是
#    "这句话从一个活人嘴里出来是什么样"（**物理层**：卡顿 / 漏接 /
#    音量 / 长度 / 停顿 / 对谁换样子）。两层缺一层，台词都是"字被念出来"。
#
#  ⚠ 与「停顿与不答也是台词」的分工（这一组最容易和它打架）：
#    那条讲**有秘密时**的不答（戏剧手段，用在"他有东西瞒着"），
#    这一组讲**日常就会漏接、就会卡**（真实质感，没有秘密也照样发生）。
# ──────────────────────────────────────────────────────────────────

话不是一条直线:
  原理: >
    真人说话**有毛边**：找词（"就是那个……那个什么来着"）、重复（"我、我没说"）、
    改口（"明天——不，后天"）、自己把自己打断（"算了，不说了"）。
    这些毛边**正好落在人心里有事的地方**：他心虚、他没想到、他在拖延、
    他在算要不要说真话。反过来，一个人**每句话都整整齐齐说完**，读起来就是
    "字被念出来"而不是"人在说话" —— 这正是对白一听就假的最显眼的破绽。
    ⚠ 分寸：**犹豫要落在关键处**；句句都结巴是另一种假（那叫在演结巴）。
  适用: 台词、心慌的戏、被问住的戏、隐瞒与试探
  提示词: "让他**在这一处**卡一下：找词、重复半个字、改口、说到一半自己停下。⚠ 只卡在他真的心虚或没想到的那一下，别每句都卡。"

不是每句都得接:
  原理: >
    真人对话里**大段是没接上的**：听岔了、只听进去半句、顺着自己那半句往下说、
    用一声"嗯"把话头摁回去、干脆装没听见。对话的分量不在"每句都有回应"，
    而在**谁在什么时候忽然认真接住了一句** —— 那一下才有重量
    （所以"接不接"本身就能写关系：他平时从不接，这一句他接了，读者就知道事情大了）。
  适用: 台词、群像、日常戏、关系变化的戏
  提示词: "这一场**不必**让每句台词都被回应：安排至少一处漏接（听岔、只应一个「嗯」、答别的）。把「他这一次认真接了」留在你最想让人注意的那一句上。"

音量是稀缺的:
  原理: >
    吼、喊、尖声叫是**动作**，不是标点。真人在戏里大部分时间用**平常声量**说话，
    音量拉满就再没有别的档位了 —— 一场戏里吼过三次，第三次就没人听了。
    而且激动**不等于**吼：它可以压低声音、可以说得更快、可以忽然停下、
    可以只说两个字。**把情绪一律外化成"吼道""厉声"是一种便宜做法**：
    用一个词把情绪标出来，而不是让情绪改变这句话的形状。真用吼，就得付代价
    （嗓子哑了、旁人回头看、他自己后悔）—— 有代价才有分量。
  适用: 冲突戏、情绪戏、争吵、审问
  提示词: "这一拍**默认平常声量**。真要用吼，写出它的**代价**（事后哑了、别人看过来）；更激动就试试**压低声音**或**说得更快**，而不是把字放大。"

一次说一件事:
  原理: >
    真人不一口气讲三件事：说一句、停、再说一句，中间甚至咽回去一句。
    **句子短、句子之间有缝**，才是"人在说话"的形状；一口气把前因后果交代完，
    是"作者在按字数配台词"。可操作的一条：他想让人听明白，就更得一句一句来 ——
    说得又长又密的人，读起来像在念材料。
  适用: 台词长度、独白、交代信息的戏
  提示词: "把这一整段拆成**几句短的**（一句一个意思，中间可以停）。⚠ 一次只说一件事，剩下的事留到他被追问或下一次开口。"

停顿要落在纸上:
  原理: >
    台词不只是**字**，还要带上**怎么说** —— 而"怎么说"必须**写下来**，
    不能指望念的人自己猜。写出来的最小单位就三样：**在哪儿停**（省略号、
    破折号、或圆括号里的一个动作）、**多轻多重**（"低着声""几乎是含在嘴里的"）、
    **多快多慢**（"急急地"）。⚠ 只写**做得到**的提示，不写"充满感情地"这种没法执行的。
    这一条的收益在下游：**剧本是给念台词和拍的人看的** —— 不写停顿，
    配音就是一路平快地念到底，那正是"一听就是 AI"最显眼的地方。
  适用: 剧本、台词、表演提示、交给下游（配音/拍摄）的稿子
  提示词: "这一句在纸上写清**怎么说**：该停的地方（……或括号里的一个动作）、该轻该重（一个词）、该快该慢（一个词）。⚠ 只写能做出来的提示。"

对谁说话就换个样子:
  原理: >
    "说话习惯"不是一个人身上的一个固定样式，而是**一套对着不同人的开关**：
    对长辈一个样、对熟人一个样、对上头一个样、对不喜欢的人又一个样 ——
    同一个人身上这几副样子的**落差越大，人越立体**（在外人面前端着的那个，
    回家才露出来的那个，才是他）。所以写人物要问的不是"他说话什么风格"，
    而是"他在**谁**面前会变成什么样"。
  适用: 人物卡、关系戏、群像、人物出场
  提示词: "这一句他是**对谁**说的？让他对着这个人换一副样子（换称呼、换语速、换用词），并且**在戏里让读者看见对着别人是什么样**。"

# ──────────────────────────────────────────────────────────────────
#  第七组：**语域：自然标准普通话**（2026-10-15 加，用户点名）
#
#  用户原话的意思：台词半文半白、不像今天真人说的话。上文十条讲"这句话该有
#  谁的味道"（内容层），第六组讲"这句话从活人嘴里出来是什么样"（物理层），
#  但**语域**是更底层的一层——这句话**用什么时代的语言在说**。
#  文言 / 半文半白 / AI 对仗句，都会让整段台词"不像人"。约束（硬）：
#   · 不许夹文言词（之乎者也、"此乃""日取夜禁"）；
#   · 不许半文半白（现代句里插古风句，读起来像翻译腔）；
#   · 不许 AI 味对仗句（左右对称的漂亮话，真人说话不这么齐）。
#  演员 · 小说作家 · 剧作者 · 语言审校 共用这一条。
# ──────────────────────────────────────────────────────────────────

语域是自然标准普通话:
  原理: >
    台词（和样章里的对话）必须像**今天真人**在说话。让台词"一听就不是人"的
    三类典型：① 文言词（之乎者也、"此乃""日取夜禁"）把人拉回戏台；
    ② 半文半白（现代句里硬插古风句）读起来像翻译腔；③ AI 对仗句
    （"他立他的规矩，我泡他的茶"这种左右对称的漂亮话）是模型偷懒的招牌，
    真人说话不会这么齐。约束是**硬**的：人物可以有口癖、有来历、有身份落差，
    但**口吻是现代人**（哪怕演古人，也用现代人能脱口而出的话，不是念文言文）。
  适用: 台词、样章对话、剧本对白
  提示词: "这句台词用**自然的标准普通话**写：不许夹文言词、不许半文半白、不许写左右对称的对仗漂亮话。像今天真人在现场说话——短、碎、带找词和改口，不文绉绉。"
