# 叙事学正典 playbook（2026-10-18 新增 A 货架）
#
# 来历：`developers/docs/写作注意事项检查表.md` 逐条对账时，30 条专业条目里
# 有 8 条"手艺库里根本没有"（#7 轮次与反应、#10 心理距离、#13 闲笔、#14 母题、
# #15 邻接对、#16 场与场的缝、#28 意象不复用、#29 时代错置），另有 #4 欲望vs需求
# 只有半个（有 goal 没有 need）、#18 悬念vs惊奇只有悬念那一半。
#
# 为什么单独一架而不是塞进原来的六架：
#   原来六架是"按文体分的货架"（古典章法 / 网文 / 编剧 / 舞台 / 空间 / 对话），
#   这十条是**跨文体的叙事学原理**（Swain 的 scene-sequel、Cohn 的心理距离、
#   会话分析的邻接对），塞进任何一架都会让那一架的定位变假。
#
# ⚠ 每条都必须有**可执行的提示词**。写"叙事要有节奏感"这种话等于没写 ——
#   判据（`verify_craft_dispatch` 的 F2）会扫"这一条被喂进提示词之后，
#   模型看到的是不是一条能照做的话"，只给概念条目的会被判成"到了也没用"。
#
# ⚠⚠ 2026-10-18 事故记录：这一份文件曾被反例法 `mutate_craft_dispatch` 的
#   M20（"摘掉叙事学那一架"）写成只剩四个标量 —— 因为当时那个变异
#   **不在还原清单里**（`WATCH` 只列了 .py）。10 条条目丢过一次，靠重写恢复。
#   现在 M20 改成"注释掉一个条目键"（改 .py 里的 SHELVES，不改 yaml），
#   并且 `WATCH` 里补了这个 yaml。**加新资产时必须同时加进备份清单。**

名称: 叙事学正典
来源: Swain《Techniques of the Selling Writer》、Cohn《Transparent Minds》、Sacks 会话分析、Truby《故事写作大师班》、普罗普、热奈特《叙事话语》、利奇与肖特《小说中的文体》
适用类型: 全部（与题材正交：这些管"叙事怎么走"，不管"讲的是哪种故事"）

# ── #7 轮次与反应（Swain：scene → sequel）──
反应与决定:
  原理: |
    Swain：一个场景（目标—冲突—挫折）之后**必须**有一个 sequel，它由三拍组成 ——
    **反应**（情绪上的、身体上的，人先被打懵）、**困境**（可选的路都不好走，说清有哪几条）、
    **决定**（他挑了一条，下一个场景的目标就从这条决定里长出来）。
    没有 sequel，戏就是"事件连着事件"：读者看到事情发生了，却不知道为什么这些人还要继续。
    这正是"戏没有落点 / 停住"的形状。
  适用: 一场戏刚吃过亏、刚知道坏消息、刚和人翻脸之后的那一段
  提示词: >-
    这一拍是**上一场的余波**，不要急着开新事。按顺序落三样：
    ① 他先有**反应**（身体上的一个动作、一句没头没尾的话，不是总结心情）；
    ② 再说清**眼下没有好路**（有几条路、每条要付什么）；
    ③ 最后让他**挑一条**（哪怕是"先回家"），这句话就是你下一拍想要什么的来处。
    ⚠ 三样不必都写全，但**不许跳过反应直接下决定** —— 那是作者替人物做决定。

# ── #4 欲望 vs 需求（Truby）──
欲望与需求:
  原理: |
    Truby：**欲望**是人物自己说得出口的目标（想要那笔钱），**需求**是他真正缺的东西
    （想被人当成一个人看）。两者拉开距离，人物弧光才有地方走 ——
    他每拿到一点欲望，就要在需求上付一次代价。
    只有欲望没有需求，人物会从头到尾"想要同一件东西"，弧光只能靠剧情硬推。
    ⚠ 需求**不能由人物自己说出口**（说破就叫"作者替他说"），只能靠他在两个选择之间
    反复选错来露出来。
  适用: 人物做选择、放弃某样东西、拿到想要的东西却不高兴的时候
  提示词: >-
    这一拍他伸手要的是**他嘴上说的那个**（欲望）；但让他**在拿到它的一瞬间露出不对**
    —— 拿到了却不高兴、或者用另一样东西去换。
    他的**需求**是什么，你自己知道就行，**不许说出来、不许让旁白点题、不许让他自己总结**。
    ⚠ 如果这一拍他两个都拿到了，那这一拍就没有戏。

# ── #10 心理距离 / 自由间接引语（Cohn、热奈特）──
自由间接引语:
  原理: |
    Cohn《透明的心灵》：同一个第三人称，可以贴到人物脑子里（"她想，这不对"），
    也可以拉到很远（"她似乎并不在意"）。距离**连续可调**，来回推拉本身就是节奏。
    停在中间那一档最好用：**用他的词、他的判断，但不加引号**（"这不对。她不该来。"）——
    读者分不清是他在想还是叙述者在说，这正是"贴着人物写"的效果。
    ⚠ 三档不能混着乱用：贴太近满篇心声，拉太远满篇旁白，两种都实测出现过。
  适用: 写人物心里那一层时的取舍；一场戏里该贴谁、该拉远谁
  提示词: >-
    这一拍的心理距离**只选一档**：
    贴近（他的原话、短句、不加"他想"）/ 中间（用他的判断词，但不加引号）/
    拉远（只写别人看得见的）。
    ⚠ 一档到底，不要在同一个自然段里从"她想"跳到"她似乎"。
    ⚠ 贴得最近的那一档，留给**最难受的那一下**，别整段都贴着。

# ── #18 悬念 vs 惊奇（希区柯克）──
悬念与惊奇:
  原理: |
    希区柯克：两个人聊天，桌下有炸弹 —— 观众知道，人物不知道，于是闲话变得可怕（悬念）；
    炸弹突然爆炸，观众也被吓一跳，但只有十秒（惊奇）。
    **悬念要先把信息给读者**（读者比人物多知道一点），惊奇只要藏住。
    本项目已有的「悬念引擎」管的是"藏"，这一条管的是**先给**。
  适用: 一场普通对话里想让它有张力；想安排一次"吓一跳"
  提示词: >-
    这一拍如果要的是**悬念**：先让读者知道一件人物不知道的事（一句说漏、一个他看不见的细节），
    然后让人物**照常说他那些闲话** —— 张力全在"他不知道"上。
    如果要的是**惊奇**：什么都别提前给，一次用完就结束，别连着用两次。

# ── #13 闲笔（金圣叹「横云断岭」的现代版）──
闲笔不是废话:
  原理: |
    真人小说里有大量"没用"的句子：看了一会儿天、把杯子挪了挪、数了数钱。
    它们不进情节，但**在控节奏** —— 紧张之后必须有一处松，读者才喘得上气，
    下一处紧才紧得起来。判"这一句推不推进"是内容判断，渲染层做这个会把闲笔当噪声删掉
    （本项目实测过：删完之后文本变成动作清单）。
  适用: 一场紧张戏之后、一段长对话中间、换场的第一拍
  提示词: >-
    这一拍**可以有一句不推进事的**：他做了一件没有目的的小事（看、摸、数、挪、听）。
    ⚠ 这一句要**挂在人身上**（是他的动作，不是风景描写），而且只写一句 ——
    写成三句就是拖。它不用为后面的情节服务。

# ── #14 母题回响（motif）──
母题回响:
  原理: |
    同一件东西、同一个动作、同一句话，隔一段再出现一次，第二次的意思就和第一次不同 ——
    这叫母题，是长篇里最便宜的结构感（读者记得住，作者不用解释）。
    ⚠ 它和"复读"只差一件事：**每次出现必须换一个位置/换一个人/换一层意思**。
    同一句话在同一场里说两遍是复读；第一次是玩笑、第三次是遗言，才是母题。
  适用: 一件反复出现的物件、一个反复做的动作、一句反复说的话
  提示词: >-
    如果你要用**回响**：让这一拍里的那个东西/那句话，和它**上一次出现时处境相反**
    （上次是玩笑这次是遗言、上次他给别人这次别人给他）。
    ⚠ 不许解释"这让我想起……"；读者自己认出来才算。
    ⚠ 同一样东西**一场只用一次**，连着用就是复读。

# ── #15 邻接对（会话分析）──
邻接对:
  原理: |
    Sacks 的邻接对：问—答、邀—应、骂—还嘴。第一句发出后，第二句有一个**期待的位置**，
    接上了才是对话；接不上（不该接的时候接了、该接的时候不接）本身也是信息。
    但**整段都在各说各话**就不是人物关系，是没写对话。
    实测：真出问题的文本"接话率 0.27、最长 4 句无人接"，而正常文本 0.90。
  适用: 三个人以上同场、有人刚问了一句没人答、有人一直没被点到
  提示词: >-
    这一拍开口之前先看：**上一个人问的是谁**？
    如果问的是你，你必须处理它（答、反问、明确地不答并让他看出你不答）。
    如果问的不是你，你可以不接，但**不许自己另开一个话题** —— 顺着刚才那件事说。
    ⚠ 全场都换话题的时候，戏就散了。

# ── #16 场与场的缝 ──
场与场的缝:
  原理: |
    大的故事由小故事组成，小故事由场景组成。场景之间除非有特殊安排（跳跃、故意简略），
    **必须有连续性**：上一场没谈完的那句话、没做完的那个动作、刚结下的那个仇，
    是下一场的第一推动力。换场时把上一场清空，等于三条线各自从头再来。
  适用: 换场的第一拍；跨天之后的第一场
  提示词: >-
    这是**刚换了地方**。先把上一场留下的那件事带过来：接着问、接着答、
    或者明确地把它放下（"那事回头再说"也是一种交代）。
    ⚠ 不许当作什么都没发生过：新场的第一句就要和上一场有关系。
    ⚠ 也不许复述上一场（"刚才你说……"整段重讲），只带**没完的那一点**。

# ── #28 意象不复用 ──
意象不复用:
  原理: |
    一场戏里三句都在写火、四句都在写雪，读者会以为作者只有这一个词。
    意象的用法是"一次立住、隔开再用"：同一场里同一个意象**只出现一次**，
    第二次要用它就得换个角度（火 → 灰、雪 → 化了的雪水）。
  适用: 环境描写、氛围句、写天气写光的时候
  提示词: >-
    写这一句环境之前先想：这一场已经用过哪个意象了？
    **同一个意象一场只立一次**。要再写它，就写它的**后果或残迹**（火→灰、雨→地上的泥），
    不要重复形容它本身。⚠ 宁可这一拍不写环境，也不要写第二句同类的。

# ── #22 视角内的感知边界（限知）──
限知与感知边界:
  原理: |
    热奈特说的 focalization：既然这一段是贴着某个人写的，就只能写**他感知得到的**。
    他看不见的（门外的、背后的、别人心里的）不能直接写，只能写成**他的推测**
    （"像是有人在说话"）或**别人说出来**。
    ⚠ 这条和"全知旁白"不是二选一：该给的信息靠**别人开口**或**他走过去看**给出来，
      而不是让叙述者临时变成上帝。
  适用: 写"另一个人在想什么"、写屋里另一个人背地里的动作、写不在场的事
  提示词: >-
    写这一句之前先问：**这件事他看得见/听得见吗**？
    看不见就写成他的推测（"门那边像是有人"），或者干脆让它由**别人说出/做出**。
    ⚠ 不许写"与此同时，另一个人正在……"这种跳出他视野的句子。
    ⚠ 也不许替另一个人写心里话 —— 你只能看见他的动作。

# ── #29 时代与地点错置 ──
时代与地点错置:
  原理: |
    一个不属于这个时空的名词会当场把读者踢出去：更鼓进了现代公寓、
    "打卡"进了宋代茶楼、街上的水汽蒸散在密封舱里。
    错置多半不是作者不懂，而是**词是从别的故事里带来的**（罐头句、模板句）。
  适用: 写环境、写器物、写时间、写职业动作的时候
  提示词: >-
    这一句里的每一样东西都要**在这个年代、这个地方存在**：
    时间怎么报（更鼓/钟表/手机）、器物叫什么（铜壶/暖瓶）、人怎么称呼彼此。
    ⚠ 拿不准的就不写 —— 宁可少一件东西，不要写错一件。
