# 网络文学方法论 playbook（设计稿 §8.1 C 货架）

名称: 网络文学方法论
来源: 起点/晋江频道头部作品、网文创作理论
适用类型: 网络文学、商业类型文

黄金三章:
  原理: 前三章必须抓住读者——建立主角、展示金手指、制造冲突
  适用: 开篇设计
  提示词: "前三章请确保：1) 主角出场 2) 核心设定展示 3) 第一个冲突"

期待感管理:
  原理: 目标→障碍→兑现的循环
  适用: 爽文节奏
  提示词: "请建立期待：主角想要什么？有什么障碍？何时兑现？"

爽点周期:
  原理: 定期满足读者期待（打脸、升级、收获）
  适用: 爽文设计
  提示词: "请在适当位置安排爽点（每 3-5 章至少一个）"

代入感纪律:
  原理: 读者需要认同主角——主角不能太弱也不能太强
  适用: 主角设计
  提示词: "请确保主角有代入感：有缺点但不讨厌，有成长但不圣母"

升级反馈环:
  原理: 升级→检验→新目标→再升级
  适用: 升级流
  提示词: "请设计升级路径：每个境界有明确的检验标准"

换地图:
  原理: 当前地图资源枯竭/冲突解决后，进入新地图
  适用: 长篇连载
  提示词: "请在适当时候引入新地图，保持新鲜感"

渠道毒点:
  原理: 避免让读者弃书的雷点
  毒点:
    - 主角降智
    - 配角抢戏
    - 无脑后宫
    - 断更
    - 烂尾
  提示词: "请检查是否有毒点：主角是否降智？配角是否抢戏？"

代入感纪律:
  原理: 第一人称或贴近主角的第三人称
  适用: 增强代入感
  提示词: "请使用贴近主角的视角，让读者有代入感"

感情曲线:
  原理: 靠近—退开—靠得更近，反复推拉；好感单调上升就没有读者
  适用: 言情、含感情线的长篇
  提示词: "这一幕让两人的距离先退一步再进一步，不要一路靠近"
误会制造:
  原理: 误会必须长在人物性格与信息差上，不能靠"作者让人降智"
  适用: 言情、都市
  提示词: "让误会产生于双方各自都合理的立场，而不是谁突然变笨"
甜蜜暴击:
  原理: 长期压着的期待，在一个具体的小处一次性兑现；甜点要短促
  适用: 言情、甜宠
  提示词: "用一个具体的小动作兑现期待，一两句话就够，别铺陈"
