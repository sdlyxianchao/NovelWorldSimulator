# 西方编剧正典 playbook（设计稿 §8.1 A 货架）

名称: 西方编剧正典
来源: 麦基《故事》、菲尔德、斯奈德《救猫咪》、特鲁比、伊格里、贝尔、西格、亚里士多德、普罗普、沃格勒
适用类型: 通用（特别适合三幕结构）

冲突三层次:
  原理: 冲突 = 障碍 + 对抗 + 代价
  适用: 所有类型的戏剧冲突
  提示词: "请确保冲突包含：1) 主角想要什么 2) 谁/什么在阻止 3) 失败的代价"

期望鸿沟:
  原理: 观众期待 vs 实际发生的落差产生戏剧张力
  适用: 反转、揭秘、打脸
  提示词: "请在关键时刻制造观众期待与实际结果的落差"

场景=价值转变:
  原理: 每个场景必须包含至少一个价值维度的正负转变
  适用: 场景设计
  提示词: "写之前先答一句：这个场景里**什么价值发生了转变**（爱/恨、生/死、希望/绝望），从哪一极到哪一极；答不出来，这一场就该删掉。"

三幕结构:
  原理: 建置 → 对抗 → 解决
  适用: 长篇叙事骨架
  提示词: "先认这一拍在哪一幕，只做那一幕的事：第一幕**建立世界和主角要什么**；第二幕让**冲突升级**（越走越窄）；第三幕**高潮并解决**。⚠ 不要在第二幕就把结局给了。"

情节点:
  原理: 第一幕结尾、第二幕中点、第二幕结尾三个关键转折
  适用: 长篇节奏控制
  提示词: "请在以下位置设置转折点：1/4处、1/2处、3/4处"

15节拍:
  原理: 斯奈德《救猫咪》的 15 个故事节拍
  适用: 商业类型片结构
  # ⚠ 2026-10-18：原来只有下面这张阶段清单，**没有 `提示词`** ——
  #   `_craft_for` 会把 `原理`（"斯奈德《救猫咪》的 15 个故事节拍"）当提示词喂出去，
  #   等于给模型报了个书名。这就是"写进库里、到了眼前也没用"。
  #   现在补一条**能照做**的：只说"这一拍处在哪个节拍、这个节拍该干什么"。
  # [EN] 2026-10-18: previously only the stage list below, with **no `提示词`** -- `_craft_for`
  # [EN] fed `原理` ("Snyder's 15 beats") as the prompt, i.e. just naming a book. Added a usable one.
  提示词: >-
    先定位这一拍在十五个节拍里的位置（开场画面→主题陈述→铺垫→催化剂→纠结→进入第二幕→
    B 故事→玩乐时光→中点→反派逼近→一无所有→灵魂至暗→进入第三幕→高潮→终场画面），
    只做**当前这个节拍该做的那件事**，不要提前做下一个节拍的活。
    ⚠ 十拍以内的短篇不要硬套：套不上就按"建置—升级—收"三段落。
  节拍:
    1. 开场画面
    2. 主题陈述
    3. 铺垫
    4. 催化剂
    5. 纠结
    6. 进入第二幕
    7. B故事
    8. 玩乐时光
    9. 中点
    10. 反派逼近
    11. 一无所有
    12. 灵魂至暗
    13. 进入第三幕
    14. 高潮
    15. 终场画面

英雄之旅:
  原理: 沃格勒的 12 阶段英雄之旅
  适用: 冒险/成长故事（慎用，容易套路化）
  # ⚠ 2026-10-18：同 `15节拍`，原来只有阶段清单、没有 `提示词`，
  #   被喂出去的就是"沃格勒的 12 阶段英雄之旅"这一句书名。
  # [EN] 2026-10-18: same as `15节拍` -- only a stage list, no `提示词`; what got fed was just the
  # [EN] book title. Added a usable one.
  提示词: >-
    只在**这一步真的到了**的时候用它：先认这一拍是不是"跨出门/受考验/带着东西回来"其中一步，
    是就把它写成**一个具体的动作**（他真的走了、真的付了钱、真的回头看了一眼），
    而不是写"他决定踏上旅程"这种总结。
    ⚠ 现代/都市/日常题材基本用不上这一条 —— 套不上就别套，硬套出来最像套路。
  阶段:
    1. 平凡世界
    2. 冒险召唤
    3. 拒绝召唤
    4. 导师出现
    5. 跨越门槛
    6. 考验、盟友、敌人
    7. 接近最深的洞穴
    8. 磨难
    9. 报酬
    10. 归途
    11. 复活
    12. 携万灵丹归来

突转与发现:
  原理: 亚里士多德《诗学》——突转（事态突然逆转）+ 发现（真相揭示）
  适用: 悬疑、推理、悲剧
  提示词: "请在关键节点设置突转或发现，改变人物认知"

悬念引擎:
  原理: 悬念来自"信息差"——读者知道危险而人物不知道，或反之；每场戏都该留一个未解的问题
  适用: 悬疑、惊悚、连载追更
  提示词: "让这一幕结束时留下一个未解的问题，让读者必须看下一幕"
人物弧光:
  原理: 人物弧光即"谎言的破碎"——他在压力下暴露并放弃自己一直信的那句自我辩护
  适用: 所有需要成长线的长篇
  提示词: "让人物在他最不想承认的地方松口，此后他的行为要真的变"
现实主义笔法:
  原理: 可信感来自具体与琐碎（行当细节、生活麻烦），而不是戏剧化腔调
  适用: 都市、行业、现实题材
  提示词: "用一个具体的行当细节或生活琐事推进这一幕，不要写抽象感慨"
世界观构建:
  原理: 设定是**结构元件**而非背景板——世界的规则必须制造人物此刻的困境
  适用: 科幻、奇幻、架空
  提示词: "让这个世界的一条规则直接变成人物此刻的障碍，而不是先讲解设定"
伦理探讨:
  原理: 两难 = 两个都成立的选择，逼人物付代价；善恶对立没有张力
  适用: 科幻、现实、历史
  提示词: "把冲突写成两个都有道理的选择，让人物的决定产生真实代价"
