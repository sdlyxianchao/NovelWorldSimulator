# 中国古典章法 playbook（设计稿 §8.1 B 货架）

名称: 中国古典章法
来源: 金圣叹、李渔、亚里士多德、普罗普
适用类型: 古典叙事、章回体、志怪

起承转合:
  原理: 四段式叙事结构
  适用: 单元剧、短篇
  提示词: "把这一段落进四段里：起（把人和地方交代清）；承（顺着往前走）；转（出一件没料到的事，把局面翻个面）；合（收在一个人身上）。缺了「转」这一段就是平的。"

草蛇灰线:
  原理: 金圣叹——伏笔如灰线，隐于草中，似断实连
  适用: 伏笔埋设
  提示词: "请在此处埋下伏笔，似断实连，后续回收"

伏脉千里:
  原理: 金圣叹——伏笔跨越长篇幅，在关键时刻回收
  适用: 长篇伏笔
  提示词: "这个伏笔将在千里之外回收，请保持一致性"

横云断岭:
  原理: 忙中偷闲的节奏阀——紧张情节中插入闲笔
  适用: 节奏调节
  提示词: "紧张之后**插入一段闲笔**（看、摸、数、挪，不推进事的动作），让读者喘一口气；⚠ 只插一段，紧着插第二段就成了拖。"

鸾胶续弦:
  原理: 旧线新接/废案回场
  适用: 支线回收
  提示词: "请将之前搁置的线索重新接入当前情节"

立主脑减头绪密针线:
  原理: 李渔——确立主线、减少支线、细节严密
  适用: 结构控制
  提示词: "请检查：1) 主线是否清晰 2) 支线是否过多 3) 细节是否严密"

章回钩子:
  原理: 章回体结尾悬念
  适用: 章节结尾
  提示词: "请在章节结尾设置悬念钩子"

志怪笔法:
  原理: 记异如记常——灵异事件用平常笔法写
  适用: 灵异/志怪
  提示词: "请用平常笔法描写灵异事件，不渲染恐惧"

权谋布局:
  原理: 信息差即权力——谁先知道、以及谁知道谁知道，决定了局势的走向
  适用: 历史架空、宫斗、群像
  提示词: "让信息不对称驱动这一幕：有人多知道一件事，有人少知道一件事"

文气:
  原理: 桐城派"因声求气"：句子的长短松紧要跟着情绪走。通篇一个节奏、连着一串同长同构的句子，读起来就是死文
  适用: 语言审校、文气、句式
  提示词: "读一遍看气顺不顺：连着三句同长同构就拆开一句；情绪紧的地方用短句，缓的地方才铺陈。别让每段都收在同一口气上。"
