# 剧作与舞台 playbook（设计稿 §8.1 D 货架：把「能读的」变成「能演的」）
#
# 为什么单开一架
# --------------
# 另外三架解决的是「故事该怎么讲」（章法 / 编剧正典 / 网文方法论），
# 这一架解决的是「讲出来的东西怎么**落到场上**」—— 分场、进退场、台词给谁、
# 舞台提示写给谁看。**写剧本的（剧作者）与写故事的（小说作家）读的不是同一批条目**：
#   · 小说作家读 A/B/C 三架（结构、铺垫、伏笔、爽点）；
#   · 剧作者读这一架（场、人、话、物）。
#
# 主要的理论来源是老舍《茶馆》的剧本实践 —— 它在中文剧作里是少见的
# 「群像 + 长时段 + 单一场景」范本，恰好与本项目"一个地点、一群人、
# 连着演很多天"的推演形态同构，所以它的做法能直接拿来用：
#
#   人物一句话立起来 · 上场下场都带戏 · 以景写时 · 群像调度 ·
#   一件小道具反复出现承住时代 · 舞台提示是给演员的
#
# ⚠ 版权红线（与 `craftmix` 模块头同一条）：这里写的是**方法**，不是台词。
#   全篇不含任何《茶馆》原句，也不许运行时把原文喂给模型。

名称: 剧作与舞台
来源: 老舍《茶馆》剧本实践、斯坦尼斯拉夫斯基（行动线）、贝克《剧作技巧》、阿契尔《剧作法》
适用类型: 舞台剧改编、群像剧、单元剧、影视分场

人物一句话立起来:
  原理: 老舍——人物一开口就见了人。台词不必长，但必须只属于这个人（口癖、见识、处境都在里面）
  适用: 台词写作、人物出场
  提示词: "让他一开口就只像他：口癖、见识、怕的东西都在这一句里。不要人人都说一样体面的话。"

上场下场都带戏:
  原理: 老舍——人物的进与出都推动场面，不做无关的过场。谁进来、为什么这时候进来，要有理由
  适用: 场次调度、人物进出
  提示词: "他这一拍进场（或离场）要带出一个变化：谁被惊动、谁被支开、话头转到哪儿。"

以景写时:
  原理: 老舍——不必交代时代，让场景与物件替你说。同一间屋子，三幕之间自己会说出年月
  适用: 长时段叙事、时代氛围
  提示词: "用场景与物件写时间与世道的变化（墙上的字、桌上的货、门外的动静），别让人物开口讲年月。"

群像调度:
  原理: 老舍——人再多也要主次分明：谁在场、谁说话、谁只是站着，读者心里有数
  适用: 群戏、多人同场
  提示词: "这一场只让两三个人推进事情，其余留在场上当背景（有反应、不抢话）。别让所有人同时开口。"

一件小道具承住一切:
  原理: 老舍——一件反复出现的小东西（一幅字、一盏灯、一把壶）能承住整段时代的压力，比议论可靠
  适用: 主题外化、时代压力
  提示词: "让一件反复出现的小道具承担此刻的压力或规矩。它出现时不必解释，读者自己会懂。"

舞台提示写给演员:
  原理: 剧本里的动作提示是**给演员的命令**，不是给读者的描写。要能照做，不要抒情
  适用: 动作提示、场面调度
  提示词: "动作提示写成能照做的命令（他站起、她按住壶盖），一句一件；不要写心理活动与文采描写。"

一场一转变:
  原理: 贝克/阿契尔——每一场（每一幕的每一拍）至少要有一个价值维度发生正负转变，否则这一段可以删
  适用: 分场、拍分
  提示词: "每一拍说清这一转变：什么事情从怎样的状态变成了怎样（从瞒住到露馅、从平安到被盯上）。"

可拍性检查:
  原理: 可拍 = 谁在哪儿、做什么、说什么，三样都能落实。写不成镜头的段落，拍的时候也拍不出来
  适用: 分场验收、成稿自查
  提示词: "逐拍自查：谁、在哪儿、做什么、说什么。四样缺一样，这一拍就还只是想法，不是戏。"

独白节制:
  原理: 舞台上的独白是重武器——一个人对着观众说心里话，用多了就廉价。能靠对手戏说清的，就别独白
  适用: 心声、内心戏
  提示词: "能让两个人物把这件事说清楚的，就不要用大段独白。心声只留给无人可说的那一处。"

以声写静:
  原理: 贝克/阿契尔论氛围——声音的最高级用法是"该响而没响"。一屋子太静、鼓声停在半拍上，比写十句"气氛紧张"都管用；环境音是免费的场面调度
  适用: 氛围、声音设计、静默
  提示词: "给这一场一句**听得见**的东西（底噪或该响而没响的那一下），用它顶掉一句议论；写完检查：把这一句删掉，场面是不是就空了。"
