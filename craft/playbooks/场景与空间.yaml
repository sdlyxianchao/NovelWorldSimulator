# 场景与空间 playbook（外部借鉴第 07 份的落地）
#
# 为什么单开一架
# --------------
# 另外几架解决的是「故事该怎么讲」（章法 / 编剧正典 / 网文方法论 / 剧作与舞台），
# 这一架解决的是「讲出来的那件事**发生在什么样的地方**」—— 平面、方位、里外、
# 走动、进出。它服务的不是某一个职位，而是**六个职位加上所有要走动的演员**：
#
#   小说作家（写环境描写）· 剧作家（写 `场` 与 `场景介绍`）· 编剧室（补局部设定）
#   导演（派活、定走位）· 美术（画图）· 道具（器物落在哪儿）· 演员（怎么走）
#
# ★ 理论来源不是某一本书，而是**外部开源项目的结构**（详见
#   `developers/docs/外部借鉴/07_地图与空间.md`）。这里只留**能核对的结构性做法**，
#   不留画风/配色/笔刷：
#
#     Azgaar/Fantasy-Map-Generator（MIT）  一份世界数据 + 纯只读渲染
#     gboeing/osmnx（MIT）                  可达性由路网决定，不由直线决定
#     pysal/momepy（BSD-3）                 形态是**算出来的**，不是形容词
#     OndrejNepozitek/Edgar（MIT）          室内 = 房间的**图**（谁连着谁、门在哪）
#     halftheopposite/graph-dungeon-gen（MIT）  先摆房间 → 再连通 → 放不下就退
#     zlzeng/DeepFloorplan（MIT）           墙 / 门洞 / 房间**三类分开**
#     streetmix（许可待核，只学原理）       一条街是**有序序列**，不是一堆点
#     SpaceGroupUCL/depthmapX（AGPL，只学原理）  "站在这里看得见什么"是可以算的
#
# ⚠ 版权红线（与 `craftmix` 模块头同一条）：这里写的是**做法**，不是源码、不是原文。

名称: 场景与空间
来源: 外部借鉴 07（Azgaar / OSMnx / momepy / Edgar / graph-dungeon-generator / DeepFloorplan / Streetmix / depthmapX）
适用类型: 所有需要在"一个地方"里演下去的叙事

里外先分清:
  原理: 屋里与院里是两件事（DeepFloorplan 把墙/门洞/房间分三类标注就是为这个）。见天的东西（井、树、影壁、水缸）**只能在院里**；有顶的东西（柜台、条案、灶台）**只能在屋里**。**有井就说明有院子，院子必须一起交待**——这是用户的硬要求
  适用: 环境描写、`场`、局部设定、出图
  提示词: "先问自己：这一处是屋里还是院里？见天的东西（井/树/影壁）写在院里，有顶的东西（柜台/条案）写在屋里。**有一口井，就必须有一处院子**——井在院里，别把它放进屋。"

门是边界不是陈设:
  原理: 门/墙/台阶是**内外之分本身**，不是屋里的一件家具（Edgar 的房间模板把"门位"算在轮廓上，不算在房间里）
  适用: 进出场、见面、挡人、偷听
  提示词: "门开在哪一面上（临街/朝院），说清楚。谁从门进来、谁被关在门外、谁隔着门听见话——门是这一场最有力的一件东西，但它**不在屋里**。"

房间是图不是点:
  原理: Edgar——“你规定有几间屋、谁连着谁，算法保证结构”；房间的身份由**它连着谁、经过哪道门**定义
  适用: 室内调度、找人、藏东西、串门
  提示词: "这一处有哪几间屋、它们怎么连着（谁通院子、谁的窗朝着街）想清楚。**屋里两间之间隔着墙**——要过去得经过院子或廊下，别让人一步跨过一整座楼。"

街是序列不是点:
  原理: Streetmix 把一条街画成**有顺序、有宽度**的横断面组件（车道/人行道/树/长椅），不是坐标点
  适用: 街道戏、赶路、追人、夜路
  提示词: "写街（巷）的时候按**从头到尾的顺序**交代：先是什么、再是什么、多宽多窄。次序与宽窄就是时间的来源——'穿过三丈宽的街面'和'贴着墙根过窄巷'是两场不同的戏。"

走动要有依据:
  原理: OSMnx——可达性由**路网**决定，不由直线决定；绕行度（circuity）是算出来的
  适用: 人物移动、赶时间、被人堵住
  提示词: "谁从哪儿走到哪儿，要能在地图上指出来（A → 院子 → B）。**别让人一步跨过没连着的地方**；要跨，就明写他中间经过了什么。"

看得见是算得出来的:
  原理: 空间句法（depthmapX）：站在一点能看见的范围（等视域）与"哪条路最容易被穿过"都是可算的量
  适用: 埋伏、相认、偷看、错身而过
  提示词: "先交代清这一场里**谁看得见谁、谁背对着谁、什么挡住了视线**（影壁、柜台、廊柱、门扇），再让人开口；看不见与看见一样是戏。"

热闹与僻静由连通决定:
  原理: momepy——连通性/中心性是可量的形态；depthmapX 的研究里"穿行潜力（choice）"是行人流量最强的预测因子
  适用: 选场景、定人流、定"这话能不能在这儿说"
  提示词: "这一处是**人来人往**还是**僻静**？按它连着多少地方来定（临街的大门 > 院子 > 里屋）。秘密话要放在人少的那一头说。"

先有底图再取景:
  原理: Azgaar——“数据层不含逻辑与渲染代码；渲染必须是纯可视化一步，不改世界数据”。所以同一处地方**每天都是从同一份底图里取景**，不是每天重摆一次
  适用: 出图、切场景、跨天连戏
  提示词: "同一处地方，位置要跟上一场对得上（门朝哪、井在哪、柜台在哪儿）。**没写到的可以补，写过的不能改**。"

景物替你说时代:
  原理: 以景写时的当代用法——同一间屋，几场之间自己会说出年月；这一条要求物件**在位**才说得出来
  适用: 长时段叙事、世道变化
  提示词: "用墙上的字、桌上的货、院里的草、门前的车这些**界内之物**写变化。它们得先站得住（在屋里还是院里），才替你说得出话。"
