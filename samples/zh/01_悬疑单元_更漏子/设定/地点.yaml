# 故事发生的几处地方（3~5 处就够）
#
# 说明 ≤20 字，写"能用的信息"（几层、有什么、什么时候人多）——
# 程序拿它判断"这地方适合什么样的客人、什么事件"。
#
# 方位 / 内里 是**可选**的两个字段（2026-10-08 起）：
#   · 方位 = 它在哪一带、挨着什么（给整体地图用）
#   · 内里 = 它里面的房间/院落/器物（给室内地图用）
# 不写也能跑 —— 程序会按"说明"和这类建筑的常识推。
# 详见《设定写作指导.md》§3.5 与 §3.5b。

- 名称: 漏刻科
  说明: 司天台最不起眼的一房，两博士三工匠
  方位: 司天台西侧偏院，紧挨着水房
  内里: [正房, 水房, 铜壶架, 值房, 后院]

- 名称: 崇仁坊
  说明: 坊门开在朱雀大街东边，夜里查得最紧
  方位: 长安东城，朱雀大街东侧

- 名称: 西市茶棚
  说明: 借着卖茶听消息的地方，三教九流都有
  方位: 西市北口，离坊门一箭地
  内里: [茶棚, 后灶, 西墙角]

- 名称: 司天台
  说明: 管天时的地方，外人轻易进不来
  方位: 皇城西南角，占了一整坊的地
