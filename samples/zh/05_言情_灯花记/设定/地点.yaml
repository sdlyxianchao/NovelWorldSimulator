# 故事发生的几处地方（3~5 处就够）
#
# 说明 ≤20 字，写"能用的信息"（几层、有什么、什么时候人多）——
# 程序拿它判断"这地方适合什么样的客人、什么事件"。
#
# 方位 / 内里 是**可选**的两个字段：
#   · 方位 = 它在哪一带、挨着什么（给整体地图用）
#   · 内里 = 它里面的房间/院落/器物（给室内地图用）
# 不写也能跑 —— 程序会按"说明"和这类建筑的常识推。

- 名称: 渡口
  说明: 灯节最后一趟船从这儿开，平日过河也在这儿
  方位: 河下游，两岸往来全靠这儿
  内里: [石阶, 船, 缆, 桩]

- 名称: 河湾
  说明: 水面上有盏断影子的灯，船到这儿会慢
  方位: 渡口往上游去的一段
  内里: [灯影, 水面]

- 名称: 桥墩
  说明: 把水里的灯影挡断，影子中间缺一块
  方位: 河湾再往上游，影子断的地方

- 名称: 铺子
  说明: 阿素绣灯花的地方，帘子一年四季放下来
  方位: 离渡口不远的街边，朝水巷
  内里: [帘子, 绣绷, 线, 灯花]
