# 故事发生的几处地方（3~5 处就够）
#
# 说明 ≤20 字，写"能用的信息"（几层、有什么、什么时候人多）——
# 程序拿它判断"这地方适合什么样的客人、什么事件"。
#
# 方位 / 内里 是**可选**的两个字段：
#   · 方位 = 它在哪一带、挨着什么（给整体地图用）
#   · 内里 = 它里面的房间/院落/器物（给室内地图用）
# 不写也能跑 —— 程序会按"说明"和这类建筑的常识推。

- 名称: 西堤
  说明: 治河主堤，西堤第三段堤高有误
  方位: 县城西边，紧挨大河
  内里: [第三段, 志桩, 草棚]

- 名称: 大河
  说明: 北边的大河，三年一汛，十年一大汛
  方位: 县境北沿，西堤临河而立

- 名称: 县衙
  说明: 本县衙门，前后两进，后堂议事
  方位: 县城正中
  内里: [大堂, 后堂, 架阁库, 班房]

- 名称: 架阁库
  说明: 存历年河工疏的库房，两间平房
  方位: 县衙东厢后院
  内里: [木架, 梯子, 案, 旧疏]
