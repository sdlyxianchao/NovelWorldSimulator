# 故事发生的几处地方（3~5 处就够）
#
# 说明 ≤20 字，写"能用的信息"（几层、有什么、什么时候人多）——
# 程序拿它判断"这地方适合什么样的客人、什么事件"。
#
# 方位 / 内里 是**可选**的两个字段：
#   · 方位 = 它在哪一带、挨着什么（给整体地图用）
#   · 内里 = 它里面的房间/院落/器物（给室内地图用）
# 不写也能跑 —— 程序会按"说明"和这类建筑的常识推。

- 名称: 归云山
  说明: 云溪宗后一座大山，借的是它的形
  方位: 云溪宗背后，出山要过山口
  内里: [石阶, 石壁, 溪, 树林]

- 名称: 云溪宗山门
  说明: 立字据的石桌在这儿，执事守在门口
  方位: 归云山口下，宗门最外一层
  内里: [石桌, 石阶, 山门]

- 名称: 归云山口
  说明: 上下山的一道口子，夜里两边点灯
  方位: 归云山南麓，下接云溪宗
  内里: [老树, 灯]

- 名称: 云溪宗
  说明: 大劫将至的宗门，字据上盖祖师印
  方位: 归云山前，依山而建
