# 《夜班书店》· 地点（3~5 处）
#
# 说明 ≤20 字，写"能用的信息"（几层、有什么、什么时候人多）。
# 方位 ≤30 字，它在哪一带、挨着什么。
# 内里 可选，里面的房间/器物。

- 名称: 夜班书店
  说明: 24 小时的旧书店，凌晨三点到四点来客
  方位: 城南老街拐角
  内里: [收银台, 书架, 最里面那排, 第二格, 鞋柜, 地垫]

- 名称: 城南老街
  说明: 整条要拆的老街，书店就在拐角
  方位: 城南，书店开在街角

- 名称: 三楼那扇窗
  说明: 临街三楼的一扇窗，入夜常黑着
  方位: 书店斜对面，三楼

- 名称: 街对面
  说明: 隔着街，看得见店门和三楼那扇窗
  方位: 正对书店门口

- 名称: 医院
  说明: 林小满上夜班的地方
  方位: 城里，离老街有一段路
