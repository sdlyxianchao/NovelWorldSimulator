# 故事发生的几处地方（3~5 处就够）
#
# 说明 ≤20 字，写"能用的信息"（几层、有什么、什么时候热闹）——
# 程序拿它判断"这地方适合什么样的客人、什么事件"。
#
# 方位 / 内里 是可选的两个字段：
#   · 方位 = 它在哪一带、挨着什么（给整体地图用）
#   · 内里 = 它里面的房间/器物（给室内地图用）
# 名字与说明都取自已有的设定文档，不新造。

- 名称: 中继站回声
  说明: 深空里的转发站，常年只有一个人
  方位: 一片没什么可看的深空区
  内里: [主控室, 天线舱, 生活舱, 走廊, 储藏格]

- 名称: 主控室
  说明: 收听长波段、记日志的地方，一天都在这
  方位: 站的正中，挨着走廊
  内里: [收听台, 日志架, 录音带架, 校准面板]

- 名称: 天线舱
  说明: 最外一圈，调天线增益的地方
  方位: 站的最外圈，出舱门就是天线
  内里: [天线转盘, 增益面板, 舱门]

- 名称: 生活舱
  说明: 吃饭睡觉的地方，堆着一旬的补给
  方位: 主控室另一头，隔一条走廊
  内里: [铺位, 灶台, 储物格]

- 名称: 走廊
  说明: 绕站一圈三百八十步，二十四盏灯
  方位: 连着主控室、天线舱、生活舱
  内里: [十七号灯, 舱门]
