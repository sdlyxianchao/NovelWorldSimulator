# 演员类型库（设计上的位置：名册管「剧组」，这里管「演员这一档人」）
#
# 为什么要有这一层
# ----------------
# 以前每个角色的"人格"就是人物卡里那几行字符串（性格/口癖/秘密/目标），
# 演员拿到手时**没有"怎么演"这一半**：他只知道自己是谁，不知道这类人**怎么说话**。
# 于是同一个"性格：沉稳"的角色，在不同书里、在同一个人物的不同拍里，
# 说话方式全凭模型当天心情 —— 这就是"每个人的台词都能换给别人说"的根子。
#
# 现实里的影视工业是两套东西：
#   · **casting type（演员类型）**：这个演员天生适合演哪一类人 —— 他说话的节奏、
#     身体的习惯、往那儿一站给人的感觉。这是**演员自带的**，不随剧本变。
#   · **role（角色）**：这一部戏里他要演谁 —— 身份、处境、目标、秘密。
#     这是**剧本给的**，一部一换。
# 本文件是前者。角色那一半在设定集的人物卡里（后者）。
#
# 两条轴的由来
# ------------
# 现实里选角是按「**年龄层 + 气质戏路**」两维粗筛的（再往下才是个体差异）：
#   · 年龄层定的是**活力与语速**：小孩话冲、老人话慢而省、少年抢话、中年斟酌；
#   · 气质定的是**待人接物的底色**：同样是"话少"，高冷是"不想说"，
#     孤僻是"不会说"，威严是"不必说"，沉稳是"想好了才说"。
# 所以本库按 `年龄层·气质` 组条目 —— 不是为了分类好看，
# 是因为这两维**各自对应提示词里不同的那一段**（语速句长 / 待人接物）。
#
# ⚠ 与"刻板印象"的界线（这条得写清楚，不然会被写坏）
# --------------------------------------------------
#   类型给的是**表演上的取向**（他习惯怎么说话），不是**对人的判断**
#   （这类人就该是什么命、该被怎么对待）。所以每个类型都有两件东西：
#     ① `变奏` —— 同一个类型必须能长出好几种人（至少 3 种），
#        这是**反刻板**的结构性保证：一个类型只有一种演法，那它就是套路；
#     ② `忌讳` —— 明确写出"别写成什么"。
#   判据 `verify_casting` 会查这两条：**每个类型都要有 ≥3 条变奏**。
#
# 版权红线：本文件是**方法**（怎么写这类人的话），不含任何作品的原文或台词。

名称: 演员类型库
来源: 影视 casting type 的两维粗筛（年龄层 × 气质戏路）+ 斯坦尼"规定情境"、迈斯纳"重复练习"对"说话节奏即性格"的处理
适用: 所有小说（类型与题材无关 —— 它管的是"人怎么说话"，不是"哪一类故事"）

# ══════════════════════════════════════════════════════════════
#  匹配用：人物卡上的字 → 类型
# ══════════════════════════════════════════════════════════════
# 配法是**两步**（见 `casting.find()`）：
#   ① 先在「年龄表」里定**年龄层** —— 年龄层定的是嗓子与节奏，最难改；
#   ② 再在「匹配表」里定**气质** —— 气质定的是待人接物的底色。
#   两步合起来才是 `年龄层·气质` 这个类型键；合不出这一型时逐级兜底
#   （同气质换年龄层 → 同年龄层换气质 → 落 `_DEFAULT`），
#   而且**兜底这件事要照实记下来**（`Casting.matched=False`）——
#   不许把"没配上"说成"配上了"。
# ⚠ 顺序有意义：先配到先得（模糊词排在最后）。
# ⚠ 年龄优先于气质：一个"七岁的毒舌"该是小孩的语速，不是成年毒舌的语速。
年龄表:
  孩: ['周岁', '岁半', '小孩', '孩子', '娃娃', '幼', '童', '四岁', '五岁', '六岁',
       '七岁', '八岁', '九岁', '十岁']
