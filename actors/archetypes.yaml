#: 配不到时用哪一型（并**照实标注"未匹配"** —— 别把它说成"配上了"）
_DEFAULT: 青年·沉稳

# ══════════════════════════════════════════════════════════════
#  类型条目
# ══════════════════════════════════════════════════════════════
# 每个条目五个字段，各落到提示词里不同的一段：
#   骨架  → "他是这样一类人"的底色
#   说话  → 语速 / 句长 / 口头禅倾向 / **忌讳**（这几项直接进"怎么说"那一段）
#   身体  → 动作习惯（本项目每一拍都要出一个动作，这一项最实用）
#   张力  → 他跟谁天然顶、跟谁天然松（**群像选型时用它避免全选一样的**）
#   变奏  → 同型多人时的区分轴（第 1 个实例用第 1 条，第 2 个用第 2 条……）

# ── 孩（4~10）──────────────────────────────────────────────────
孩·天真:
  常演: 主角位 / 伙伴位（男女皆可）
  骨架: >-
    他对世界没有防备，问什么都是真问。不懂的事当场就问，不等场合。 他记住的是具体的：谁给过他什么、谁对他凶过。大道理对他完全无效。
  说话:
    句长: 很短，常说半句就跳走
    语速: 快，抢话
    口头禅: [为什么呀, 那我也要去, 我不]
    忌讳: 不说成语、不打比方、不替人圆场
  身体: 坐不住，边说边走神；抓住什么就不放
  张力: '和"威严型/高冷型"天然撞（一个要管、一个不听）；对"甜美型"最松'
  变奏:
    - 真不懂（问到底，让人哭笑不得）
    - 装不懂（其实听懂了，故意问）—— 早慧但不外露
    - 太懂事后不敢问（把问题咽回去，只在没人的时候问）
  忌讳: 别写成懂事的大人；也别写成只会卖萌的道具 —— 他要有自己真想干的事
孩·早慧:
  常演: 主角位 / 搅局位（男女皆可）
  骨架: >
    他把大人那套规则看明白了，而且会用。说话时先算对方会怎么接，再张嘴。
    但他的算盘是明着打的 —— 他不藏，因为知道没人会防着小孩。
  说话:
    句长: 可以很长（一条一条地讲），逻辑清楚得反常
    语速: 不快，一字一句
    口头禅: ['我算过了', '你先说', '那我们讲个道理']
    忌讳: 不说幼稚的话，也不故作老成腔
  身体: 手上有小算盘似的小动作（数东西、排东西）
  张力: 和"精算型/圆滑型"互相欣赏；和"热血型"互相看不上
  变奏:
    - 讲理型（用规则压人）
    - 演型（明明会了，装不会，留一手）
    - 护人型（算的全是为了护住某个人）
  忌讳: 别写成小大人（会说教）；他的厉害要落在"动手做的事"上，不在嘴上

# ── 少年（11~17）──────────────────────────────────────────────
少年·热血:
  常演: 主角位 / 伙伴位（男女皆可）
  骨架: >
    想到就去做，做完才想后果。认死理，谁对他好他就把命给谁。
    他最大的缺点是等不了 —— 让他等，比让他拼命难。
  说话:
    句长: 短促，一句顶一句，爱抢话
    语速: 快，越急越快
    口头禅: ['我跟你讲', '怕什么', '我去']
    忌讳: 不引经据典、不说"也许""大概"
  身体: 坐不住，边说边动；走路带风
  张力: 和"沉稳型/圆滑型"顶得最厉害（一个要冲，一个要稳）
  变奏:
    - 莽在嘴上（说了就去做）
    - 莽在心里（嘴上稳，动起手来不要命）
    - 热在护人上（对自己怂，为别人敢）
  忌讳: 别写成没脑子的莽夫 —— 他的冲动要有来处（护谁、怕什么）

少年·阴郁:
  常演: 主角位 / 对手位（男女皆可）
  骨架: >
    他话少不是因为冷，是因为说了没用。他把事情记在心里，一笔一笔。
    他不吵不闹，只在关键那一下动手 —— 那一下比他喊一百句都重。
  说话:
    句长: 短，常常只回一个字
    语速: 慢
    口头禅: ['嗯', '不用了', '我记着']
    忌讳: 不解释、不诉苦、不主动搭话
  身体: 缩着，不占地方；眼神在别人身上停得比话久
  张力: 和"热血型/天真型"互相看不懂
  变奏:
    - 憋着一口气（等一个时机）
    - 已经不指望了（真的放弃，连恨都懒得）
    - 只在一个人面前不设防
  忌讳: 别写成装酷；他的沉默得有具体原因，且**在戏里要露一次**

# ── 青年（18~30）──────────────────────────────────────────────
青年·高冷:
  常演: 主角位 / 对手位（男女皆可，角色偏男性时常用）
  骨架: >
    他不是不想理人，是不习惯解释。别人说话他先听，听完只挑最关键的一处回。
    他记得住所有人的细节，只是从不主动说出来。
  说话:
    句长: 短，通常一句说完
    语速: 慢，中间有停顿
    口头禅: ['嗯。', '不用。', '随你。']
    忌讳: 不解释动机、不说长段、不用感叹
  身体: 动作少而准；不主动靠近别人
  张力: 和"甜美型/热血型"天然对冲；对"沉稳型"反而松
  变奏:
    - 冷在外（对谁都一样）
    - 冷在防（怕被看穿，对熟人话就多）
    - 冷在傲（他确实看不上大多数人，少数例外才有分量）
  忌讳: 别写成没情绪的工具人 —— 冷是他的选择，不是他没有感觉

青年·甜美:
  常演: 主角位 / 伙伴位（角色偏女性时常用，但不限）
  骨架: >
    她先照顾别人的感受，再想自己的。软，但不是没主意 ——
    真到了她认定的事上，谁劝都不动。
  说话:
    句长: 中等偏短，句尾常留个台阶给对方
    语速: 不快，带商量口气
    口头禅: ['要不……', '你别急', '没事的']
    忌讳: 不尖酸、不抢白，但也**不能一味顺从**
  身体: 手上总在替别人做点什么（递、收、扶）
  张力: 和"毒舌型/威严型"容易撞；对"憨厚型"最放松
  变奏:
    - 软在面上硬在心里（外头都让，底线一步不退）
    - 软是本事（她靠软把事办成，自己也清楚）
    - 软是没得选（处境逼的，心里其实有火）
  忌讳: 别写成只会牺牲的背景板 —— 她得有自己想要的东西

青年·毒舌:
  常演: 伙伴位 / 搅局位（男女皆可）
  骨架: >
    嘴比脑子快，专挑人最痛的那处说。但多数时候他不是想伤人 ——
    他受不了蠢和装，忍不了就说。真到要命的关口，他是最先站出来的那个。
  说话:
    句长: 短句连发，一句一个坑
    语速: 快，越得意越快
    口头禅: ['就这?', '你也信?', '用脚想都知道']
    忌讳: 不说体面话、不给人留面子（**但要有分寸感**：对谁都不留 = 没教养，不是毒舌）
  身体: 手上没个闲（磕瓜子、转东西），眼睛打量着人
  张力: 和"威严型/甜美学"顶；和"痞气型"沆瀣一气
  变奏:
    - 刀子嘴豆腐心（说完就去帮人）
    - 纯粹嘴欠（不分场合）
    - 用毒舌挡事（不想谈正事就嘴上带刺）
  忌讳: 别写成纯反派 —— 毒舌要有"看不过去"的底色，否则就是嘴臭

青年·精算:
  常演: 对手位 / 伙伴位（男女皆可）
  骨架: >
    他先问利害，再问对错。每一句话背后都在算：这句话值多少、换得到什么。
    他不觉得这有什么不对 —— 人活着本来就得算。
  说话:
    句长: 中长，爱用条件句（"要是……那……"）
    语速: 稳，不紧不慢
    口头禅: ['划不来', '这得看给多少', '先说清楚']
    忌讳: 不说亏本的场面话，不做无条件的承诺
  身体: 手指上有数的习惯（点、敲、比）
  张力: 和"热血型/天真型"最不对路
  变奏:
    - 算钱（真的在算）
    - 算人情（账本在心里，谁帮过他他都记着还）
    - 算不过就翻脸（底线被踩时的狠）
  忌讳: 别写成小气鬼 —— 他可以是极慷慨的，只要那笔账算得值

青年·痞气:
  常演: 伙伴位 / 主角位（角色偏男性时常用）
  骨架: >
    什么都不当一回事，嘴上没个正形。但真出事的时候，他跑得比谁都快 ——
    他是家里最靠不住的那个，也是最不会走掉的那个。
  说话:
    句长: 短，带拖腔，爱开玩笑
    语速: 慢悠悠
    口头禅: ['嗐', '急什么', '行行行']
    忌讳: 不说正经八百的场面话
  身体: 手插兜、靠墙、坐没坐相
  张力: 和"威严型/书卷型"撞；和"毒舌型"最好
  变奏:
    - 吊儿郎当但心里有数
    - 混不吝其实最怕事（嘴硬）
    - 痞是护身壳（认真起来判若两人）
  忌讳: 别写成没底线；他的痞要在"底线"被踩时立刻收起来

青年·孤僻:
  常演: 配角位 / 搅局位（男女皆可）
  骨架: >
    他不是讨厌人，是不知道怎么接话。别人看他一眼他就想走。
    他心里的话很多，只是没说出口 —— 出口的往往是一句很短的、听不太懂的。
  说话:
    句长: 极短，常常答非所问
    语速: 慢，声音小
    口头禅: ['啊……', '那个', '我……']
    忌讳: 不主动开场、不说完整的长句
  身体: 缩在边上，手上找东西抓；别人一靠近就退半步
  张力: 和"泼辣型/毒舌型"最难受
  变奏:
    - 怕人（社交恐惧）
    - 看不上人（自愿独处）
    - 只在某个场合能说（比如对着活物、对着某个地方）
  忌讳: 别写成神经质；他的躲要有具体怕的东西

# ── 中年（31~55）──────────────────────────────────────────────
中年·威严:
  常演: 长辈位 / 对手位（男女皆可）
  骨架: >
    他说了就算。不是靠嗓门，是靠从不改口 —— 他答应过的事没有一件落空。
    他管人是真管，护人也是真护，这两件事在他这儿是一件事。
  说话:
    句长: 短，多是结论，不是商量
    语速: 稳，一字一顿
    口头禅: ['就这么定', '不行', '我说了算']
    忌讳: 不解释理由（解释了就不是威严）、不啰嗦
  身体: 坐得直，不動；不看人也能让人知道他看着
  张力: 和"痞气型/天真型"撞；对"憨厚型"最放心
  变奏:
    - 家法在上（认规矩不认人）
    - 护短（对外一套，对内另说）
    - 其实早就想放手（威严是撑着的，累了）
  忌讳: 别写成脸谱化的爹；他要有一处**软下来的地方**，而且只给一个人看

中年·泼辣:
  常演: 长辈位 / 搅局位（角色偏女性时常用）
  骨架: >
    嗓门大，动作大，心里想什么嘴上就说什么。占着理的时候一步不让，
    占了便宜也不藏着。她的凶是真的，她的热也是真的。
  说话:
    句长: 长，一气说一串，中间不带停
    语速: 极快，越说越响
    口头禅: ['我告诉你', '你听好了', '我可不惯着']
    忌讳: 不吞吞吐吐、不说反话
  身体: 手上有动作（指、拍、叉腰），走路带响
  张力: 和"高冷型/书卷型"撞得最响
  变奏:
    - 吵架厉害，办事也厉害
    - 单纯嘴快（说完就后悔）
    - 凶是怕（怕自家吃亏，先凶起来）
  忌讳: 别写成恶婆婆；她的凶得有对象，也得有护着的人

中年·憨厚:
  常演: 长辈位 / 伙伴位（男女皆可）
  骨架: >
    他反应慢半拍，但认死理 —— 认准的事，天塌了他也照做。
    他不会说话，可他说过的话都算数。吃亏的时候他不吭声，这不是傻，是懒得计较。
  说话:
    句长: 短，常常重复对方的话再答
    语速: 慢，常有停顿
    口头禅: ['那……行吧', '我听你的', '这个我懂']
    忌讳: 不说漂亮话、不抢先开口
  身体: 动作实在，使力气的时候不藏
  张力: 和"精算型/毒舌型"最容易被占便宜
  变奏:
    - 真老实
    - 装老实（心里有数，不点破）
    - 老实人有火（一旦真被逼急了，比谁都狠）
  忌讳: 别写成供人取笑的傻；他要有自己的判断，只是不说

中年·沉稳:
  常演: 长辈位 / 主角位（男女皆可）
  骨架: >
    他是那个出事时大家都看的人。他不急着表态，因为知道话说出口就改不了。
    他劝人从不说教，只把利害摆出来，让人自己走。
  说话:
    句长: 中等，一句是一句，不重复
    语速: 慢，中间留空气
    口头禅: ['不急', '先看看', '你自己定']
    忌讳: 不说绝话、不逼人当场表态
  身体: 动作少，手上常在做一件与对话无关的活（擦、缝、舀）
  张力: 和"热血型/泼辣型"互补
  变奏:
    - 见得多所以稳（经验）
    - 心冷所以稳（不在乎）
    - 稳是撑的（自己也慌，但不能让别人看出来）
  忌讳: 别写成没脾气的和事佬；稳是他的成本，不是他的天性

中年·阴郁:
  常演: 对手位 / 配角位（男女皆可）
  骨架: >
    他心里有一本旧账，翻了很多年。他不动声色，但每一句都往那个方向带。
    他不是要赢，是要那个人尝到他尝过的。
  说话:
    句长: 短，凉，故意说得客气
    语速: 慢
    口头禅: ['是吗', '挺好', '你随意']
    忌讳: 不发作、不喊，越平静越危险
  身体: 极少动；动的时候很突然
  张力: 和"天真型/热血型"最危险（他们看不出）
  变奏:
    - 要人偿（明着来）
    - 要人偿（暗中来）
    - 想放下放不下（自己也知道这不对）
  忌讳: 别写成纯恶；他要有一个"本来可以不这样"的岔口

# ── 老年（56+）────────────────────────────────────────────────
老年·慈:
  常演: 长辈位（男女皆可）
  骨架: >
    她/他见过的事多，所以不太惊讶。劝人靠"我那时候"，不靠道理。
    她/他疼人是不动声色的 —— 说给的都是具体的、手上的、能吃的。
  说话:
    句长: 中长，爱讲从前
    语速: 慢，带停顿
    口头禅: ['你听我说', '我年轻那会儿', '不碍事的']
    忌讳: 不讲大道理、不批评人
  身体: 手上总有活；走路慢但不停
  张力: 和"泼辣型/热血型"最容易起冲突
  变奏:
    - 什么都见过所以宽容
    - 什么都见过所以谁也不信
    - 只对一个人慈（其余冷冷淡淡）
  忌讳: 别写成完人；她的宽容是有限度的，也有偏心的

老年·毒:
  常演: 长辈位（男女皆可）
  骨架: >
    他/她嘴上不留情，但说的多半是对的 —— 这最噎人。
    活到这个岁数，他/她已经不打算再替谁留面子了。
  说话:
    句长: 短，一针见血
    语速: 不快但很稳
    口头禅: ['我早说过', '早干什么去了', '就你们这脑子']
    忌讳: 不绕弯、不客气
  身体: 坐着不动，抬眼看人
  张力: 和"甜美学/圆滑型"最容易上火
  变奏:
    - 毒是真看不上
    - 毒是恨铁不成钢
    - 毒是嘴毒心软（骂完就去干活）
  忌讳: 别写成纯恶毒老人；他/她得有一处护着的

老年·疯癫:
  常演: 搅局位 / 智者位（男女皆可）
  骨架: >
    说的话东一句西一句，别人当胡话，其实隔三差五有一句戳中要害。
    他/她可能真糊涂了，也可能只是在装 —— 本库不打算说清，戏里也不说清。
  说话:
    句长: 跳，前后不搭
    语速: 时快时慢
    口头禅: ['哎你说', '那个谁', '——对了']
    忌讳: 不顺着别人的话往下接
  身体: 手上有停不下来小动作；忽然凑近人
  张力: 和"精算型/威严型"最不兼容
  变奏:
    - 真糊涂（偶尔清醒那一下最动人）
    - 装糊涂（什么都明白）
    - 只在旧事上清醒（说现在糊涂，说从前清楚）
  忌讳: 别写成用来搞笑的工具人；他/她给出的信息**必须在戏里真的有用**

老年·沉稳:
  常演: 长辈位 / 智者位（男女皆可）
  骨架: >
    话不多，听完所有人才开口。开口时往往是把大家绕远的那件事一句话收回来。
    他/她不劝人，只把话说到位，剩下的别人自己去想。
  说话:
    句长: 短，一句顶几句
    语速: 很慢
    口头禅: ['嗯，是这样', '这个不急', '你想想']
    忌讳: 不重复别人说过的话
  身体: 长时间静止；动作幅度小
  张力: 和"热血型/泼辣型"最需要彼此
  变奏:
    - 智者（真的想得透）
    - 精力不济（想说周全，说不完了）
    - 惯于权衡（看多了，不太肯表态）
  忌讳: 别写成预言机；他/她也有做不到的事

# ── 补齐型（2026-10-07 校验时发现）────────────────────────────
# ⚠ 这几型是**被机器查出来缺的**，不是凭感觉补的。当时两条已知：
#   ① `_DEFAULT` 写的是 `青年·沉稳`，而类型库里**根本没有这一型** ——
#      兜底会落到"sorted 之后的第一个"，落到谁全凭字母序（等于没兜底）；
#   ② 匹配表里有「书卷」「圆滑」两组词，却没有任何一型接得住 ——
#      那两组词是**死的**（作者在人物卡里写"书生"，配出来的和写"疯癫"一样）。
#   这两条现在都有判据盯着（`verify_casting`：默认型必须存在 / 匹配表的气质
#   必须至少有一型接得住）。**这是"假按钮"在数据层的形态**：
#   表里写着有这个选项，库里没有实现。

青年·沉稳:
  常演: 主角位 / 伙伴位（男女皆可）
  骨架: >
    他话不多，但每一句都过了脑子。他不急着表态，因为他知道话出口就改不了。
    别人慌的时候他反而慢下来 —— 不是不在乎，是知道慌没用。
  说话:
    句长: 中等，一句是一句，不重复
    语速: 慢，中间留空
    口头禅: ['不急', '先看看', '你自己定']
    忌讳: 不说绝话、不逼人当场表态
  身体: 动作少；手上常在做一件与对话无关的活
  张力: 和"热血型/泼辣型"互相补台；和"疯癫型"最对不上
  变奏:
    - 天生如此（本来就不爱急）
    - 吃过大亏所以稳（稳是代价换来的）
    - 稳是撑的（自己也慌，只是不让别人看出来）
  忌讳: 别写成没脾气的影子人物；他得有自己想要的东西，只是不喊出来

少年·书卷:
  常演: 智者位 / 伙伴位（男女皆可）
  骨架: >
    他信道理，而且真的会照着道理做 —— 这在乱世里是件很危险的事。
    他嘴上不肯输，可一旦发现自己错了，认错比谁都快。
  说话:
    句长: 长，爱分条说理
    语速: 中速，讲到他懂的地方会变快
    口头禅: ['按理说', '书上讲', '要我说清楚']
    忌讳: 不说粗话、不凭感觉下结论
  身体: 手上拿着东西（书、笔、卷），说话时手指点着数条
  张力: 和"痞气型/莽的人"最顶；和长辈反而容易被点醒
  变奏:
    - 书生意气（真的相信道理能管用）
    - 读死书（拿书上的话硬套眼前的事）
    - 心里动摇（已经不太信了，只是还照着做）
  忌讳: 别写成掉书袋的笑料；他的理要**在戏里被现实撞一次**

少年·憨厚:
  常演: 伙伴位 / 主角位（男女皆可）
  骨架: >
    他还没学会藏着 —— 信谁就是全信，答应的事做不到会自己难受半天。
    他不聪明，可他不装聪明：不知道就问，问得理直气壮。
    别人拿他当傻小子，他听得出来，只是觉得犯不上计较。
  说话:
    句长: 短，一句一个意思，不绕
    语速: 偏快，说到一半会自己卡住（在想）
    口头禅: ['哦', '那我去了', '我不懂，你再说一遍']
    忌讳: 不说漂亮话、不揣测别人的心思
  身体: 手上有活（提、扛、递），站着时重心换来换去
  张力: 和"精算型/圆滑型"最容易被拿去使；对同龄人容易先服软
  变奏:
    - 真老实（说什么信什么）
    - 慢半拍的机灵（反应慢，但回过味来很准）
    - 认死理（认准一件事，谁劝都不改，第一次跟人顶起来）
  忌讳: 别写成供人取笑的小傻子；他的笨**只在人情世故上**，不在他做的那件事上

青年·书卷:
  常演: 智者位 / 主角位（男女皆可）
  骨架: >
    他懂得多，但更怕说错，所以先听再说。他把话讲得慢而清楚，
    因为他知道对面的人未必跟得上这一层 —— 他不因此看轻别人。
  说话:
    句长: 中长，用词准确，少用感叹
    语速: 慢而稳
    口头禅: ['这个说来话长', '我换个说法', '要紧的是']
    忌讳: 不炫耀、不掉书袋（**懂的越多越不该显摆**）
  身体: 动作轻；常在纸上记东西
  张力: 和"泼辣型/痞气型"节奏最不合
  变奏:
    - 真谦和（懂而不显）
    - 只是不擅长吵架（嘴上赢不了，心里明白）
    - 有锋（平时让着，触及底线时一句把人钉住）
  忌讳: 别写成万能解答机；他要有一处不懂的、或者知道却不敢说的

中年·圆滑:
  常演: 配角位 / 中间人位（男女皆可）
  骨架: >
    他谁也不得罪。话说一半，留一半给对面接。他不是没立场，
    是知道在这个院子里有立场活不长。
  说话:
    句长: 中长，绕着说，多用"咱们""都行"
    语速: 不快
    口头禅: ['都行都好', '你看呢', '这事儿不好说']
    忌讳: 不做明确承诺、不当面否定人
  身体: 笑着，手上给人递东西（倒茶、让座）
  张力: 和"热血型/毒舌型"最容易起火
  变奏:
    - 明哲保身（保护自己）
    - 替人打圆场（护着两边的和气）
    - 其实最精（把人都看透了，只是不说）
  忌讳: 别写成没立场的墙头草；他心里有数，只是不肯说

老年·威严:
  常演: 长辈位 / 当家位（男女皆可）
  骨架: >
    他坐在那儿不说话，屋里就没人敢吵。不是靠吼 —— 是这辈子没改过口，
    说过的话都算数。他不偏心，这才是众人服他的原因。
  说话:
    句长: 短，多是定论
    语速: 很慢，一字一顿
    口头禅: ['就这么办', '不必再说', '我听着呢']
    忌讳: 不解释、不重复、不与晚辈争辩
  身体: 长久不动；抬手就是让人停下的意思
  张力: 和"痞气型/疯癫型"最容易冲
  变奏:
    - 家法在上（认规矩不认人）
    - 护短的威严（对外铁面，对自家人睁一只眼）
    - 已经力不从心（话说得硬，可有人不再听了）
  忌讳: 别写成纯粹的权威符号；他得有**撑不住的地方**，或者一件放心不下的事
