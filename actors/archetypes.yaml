         '学徒', '半大']
  老年: ['老人', '老头', '老太太', '老翁', '老妪', '花甲', '古稀', '六十', '七十',
         '八十', '祖父', '祖母']
  中年: ['中年', '四十', '五十', '三十', '当家', '掌柜', '叔', '姑', '妇人', '汉子']
  青年: ['青年', '年轻', '后生', '小伙', '姑娘', '二十', '十八', '新媳妇', '少爷',
         '少奶奶']
匹配表:
  高冷: ['高冷', '冷淡', '寡言', '沉默', '疏离', '淡漠', '不理人', '清冷', '孤傲']
  毒舌: ['毒舌', '嘴损', '刻薄', '刀子嘴', '讽刺', '爱怼']
  甜美: ['温柔', '爱笑', '甜', '软糯', '体贴', '善解人意', '好脾气']
  泼辣: ['泼辣', '泼妇', '厉害', '凶', '得理不饶人', '大嗓门', '强势']
  憨厚: ['憨厚', '老实', '实在', '木讷', '笨', '迟钝', '心大', '一根筋']
  威严: ['威严', '严肃', '不苟言笑', '有威', '说一不二', '掌事', '当家']
  书卷: ['文雅', '有文化', '书生', '斯文', '讲理', '爱读书', '学究']
  痞气: ['痞', '油滑', '吊儿郎当', '不正经', '混不吝', '无赖', '江湖']
